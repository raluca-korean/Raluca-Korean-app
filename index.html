<script>
/* First-ever visit (no onboarding flag, no existing progress) -> onboarding.
   Anyone with real history is treated as already onboarded, so returning
   users are never sent through this. Runs before anything paints. */
(function(){
  if(localStorage.getItem('RK_ONBOARDED')) return;
  var hasHistory = localStorage.getItem('RK_XP') || localStorage.getItem('RK_STREAK') || localStorage.getItem('RK_LESSON_DONE');
  if(hasHistory){ localStorage.setItem('RK_ONBOARDED','1'); }
  else { location.replace('onboarding.html'); }
})();
</script>

<style>
:root{
  --bg:#FAF9F7; --card:#FFFFFF; --text:#202124; --text-mid:#6B6B73; --text-low:#9C9CA3;
  --border:#E7E5E1; --shadow:rgba(32,33,36,.07);
  --lavender:#6C5CE7; --lavender-soft:#EFEBFC; --pink:#E96A9A; --pink-soft:#FCE9F0; --denim:#4A90A4;
  --mint:#2FB67C; --mint-soft:#E3F6EC; --red:#E5534B; --red-soft:#FCE8E6;
  --bar-bg:#EFEDE9;
  --forest:#6C5CE7; --gold:#F4C95D;
}
body.dark-mode{
  --bg:#101426; --card:#181D32; --text:#F7F4FA; --text-mid:#B8B9C5; --text-low:#7D7E93;
  --border:rgba(255,255,255,.08); --shadow:rgba(0,0,0,.35);
  --lavender:#8B7CFF; --lavender-soft:rgba(139,124,255,.16); --pink:#F17EAB; --pink-soft:rgba(241,126,171,.14); --denim:#63AFC5;
  --mint:#4CD39A; --mint-soft:rgba(76,211,154,.14); --red:#FF7A72; --red-soft:rgba(255,122,114,.14);
  --bar-bg:rgba(255,255,255,.08);
  --forest:#8B7CFF; --gold:#F3CB69;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;transition:background .25s ease,color .25s ease;
}
.kr{font-family:'Noto Sans KR',sans-serif}
a{color:inherit}
button{font-family:inherit}

.dash{max-width:560px;margin:0 auto;padding:0 16px 104px}

/* ── PAGE BACKGROUND — faint fixed Seoul skyline line-drawing ── */
.rk-seoul-bg{
  position:fixed;inset:0;width:100vw;height:100vh;
  z-index:-1;pointer-events:none;opacity:.22;
}
.rk-seoul-bg path,.rk-seoul-bg polygon,.rk-seoul-bg rect{
  fill:none;stroke:var(--forest);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;
}
.rk-seoul-bg .seoul-fill{fill:var(--forest);stroke:none}
body.dark-mode .rk-seoul-bg{opacity:.3}

/* ── TOPBAR ───────────────────────────────────────────── */
.dash-topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:18px}
.dash-brand{font-size:15px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:6px;color:var(--text)}
.rk-logo{width:22px;height:22px;flex-shrink:0}
.rk-logo .gate{stroke:#6C5CE7}
.rk-logo .ascent{stroke:#F4C95D}
body.dark-mode .rk-logo .gate{stroke:#8B7CFF}
body.dark-mode .rk-logo .ascent{stroke:#F3CB69}
.dash-topbar-actions{display:flex;align-items:center;gap:8px}
.dash-icon-btn{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--card);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--text-mid);
}
.dash-lang{display:flex;border:1px solid var(--border);border-radius:20px;overflow:hidden;background:var(--card)}
.dash-lang button{border:none;background:none;padding:7px 12px;font-size:11px;font-weight:800;color:var(--text-low);cursor:pointer}
.dash-lang button.active{background:var(--forest);color:#fff}

/* ── GREETING ─────────────────────────────────────────── */
.dash-greet{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:20px 2px 0}
.dash-greet-kr{font-size:26px;font-weight:900;line-height:1.15}
.dash-greet-sub{font-size:13px;color:var(--text-mid);margin-top:4px}
.dash-chips{display:flex;gap:6px;flex-shrink:0}
.dash-chip{
  display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:999px;
  background:var(--card);border:1px solid var(--border);font-size:13px;font-weight:800;
  box-shadow:0 2px 8px var(--shadow);
}
.dash-flame{display:inline-block;transform-origin:50% 85%}
.dash-flame.lit{animation:dashFlameFlicker 1.6s ease-in-out infinite}
@keyframes dashFlameFlicker{
  0%,100%{transform:scale(1) rotate(0deg)}
  25%{transform:scale(1.1) rotate(-4deg)}
  50%{transform:scale(.96) rotate(2deg)}
  75%{transform:scale(1.06) rotate(-1deg)}
}

/* ── TODAY HERO — one card that answers "what do I do now?" ── */
.today{
  position:relative;overflow:hidden;margin-top:18px;padding:22px 20px 20px;border-radius:28px;color:#fff;
  background:
    radial-gradient(120% 90% at 100% 0%, rgba(244,201,93,.35) 0%, rgba(244,201,93,0) 55%),
    linear-gradient(140deg,#6C5CE7 0%,#8E6CF0 45%,#E96A9A 100%);
  box-shadow:0 14px 34px rgba(108,92,231,.35);
}
.today::after{
  content:'오늘';position:absolute;right:-6px;bottom:-22px;font-family:'Noto Sans KR',sans-serif;
  font-size:110px;font-weight:900;color:rgba(255,255,255,.09);pointer-events:none;line-height:1;
}
.today-top{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:76px;height:76px;flex-shrink:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .ring-bg{stroke:rgba(255,255,255,.22)}
.ring .ring-fg{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.4,0,.2,1)}
.ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring-num b{font-size:22px;font-weight:900}
.ring-num span{font-size:10px;font-weight:700;opacity:.8;margin-top:2px}
.today-eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.today-title{font-size:20px;font-weight:900;margin-top:4px;line-height:1.2}
.today-sub{font-size:13px;opacity:.85;margin-top:4px}
.today-cta{
  position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  margin-top:18px;padding:14px 18px;border-radius:16px;border:none;cursor:pointer;text-decoration:none;
  background:#fff;color:#4B3CC4;font-size:15px;font-weight:900;
  box-shadow:0 6px 0 rgba(40,20,120,.25);transition:transform .12s ease,box-shadow .12s ease;
}
.today-cta:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(40,20,120,.25)}
.today-cta-ico{font-size:18px}

/* ── PATH — today's steps as a vertical trail ─────────── */
.sec-title{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-low);margin:26px 4px 12px}
.sec-title small{font-size:12px;letter-spacing:0;text-transform:none;color:var(--text-mid)}
.path{position:relative;display:flex;flex-direction:column;gap:10px}
.path::before{
  content:'';position:absolute;left:31px;top:24px;bottom:24px;width:3px;border-radius:3px;
  background:repeating-linear-gradient(to bottom,var(--border) 0 6px,transparent 6px 12px);
}
.step{
  position:relative;display:flex;align-items:center;gap:14px;padding:10px 14px 10px 10px;
  background:var(--card);border:1px solid var(--border);border-radius:20px;text-decoration:none;color:inherit;
  box-shadow:0 3px 12px var(--shadow);transition:transform .15s ease,border-color .15s ease;
  animation:stepIn .45s cubic-bezier(.2,.8,.2,1) both;
}
.step:hover{transform:translateX(3px)}
.step-node{
  position:relative;z-index:1;width:44px;height:44px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:20px;
  background:var(--lavender-soft);border:2px solid transparent;
}
.step-body{flex:1;min-width:0}
.step-title{font-size:15px;font-weight:800}
.step-sub{font-size:12px;color:var(--text-mid);margin-top:2px}
.step-mini{height:5px;background:var(--bar-bg);border-radius:4px;overflow:hidden;margin-top:7px;max-width:180px}
.step-mini i{display:block;height:100%;background:linear-gradient(90deg,var(--lavender),var(--pink));border-radius:4px}
.step-go{font-size:12px;font-weight:900;color:var(--lavender);flex-shrink:0}
.step.done{opacity:.62;box-shadow:none}
.step.done .step-node{background:var(--mint);color:#fff;font-size:18px;font-weight:900}
.step.done .step-title{text-decoration:line-through;text-decoration-thickness:2px}
.step.done .step-go{color:var(--mint)}
.step.current{border-color:var(--lavender);box-shadow:0 6px 20px rgba(108,92,231,.22)}
.step.current .step-node{background:var(--lavender);border-color:var(--lavender);animation:nodePulse 2s ease-out infinite}
.step.current .step-go{background:var(--lavender);color:#fff;padding:7px 12px;border-radius:999px}
@keyframes nodePulse{0%{box-shadow:0 0 0 0 rgba(108,92,231,.55)}70%{box-shadow:0 0 0 12px rgba(108,92,231,0)}100%{box-shadow:0 0 0 0 rgba(108,92,231,0)}}
@keyframes stepIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── QUICK QUIZ — an actual exercise right on the home page ── */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:24px;
  padding:20px;box-shadow:0 4px 18px var(--shadow);
}
.quiz-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.quiz-eyebrow{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--pink)}
.quiz-combo{font-size:12px;font-weight:800;color:var(--text-mid);background:var(--pink-soft);padding:4px 10px;border-radius:999px;transition:transform .2s}
.quiz-combo.bump{animation:bump .35s ease}
.quiz-word{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px 0 6px}
.quiz-ko{font-family:'Noto Sans KR',sans-serif;font-size:36px;font-weight:900;text-align:center;line-height:1.2}
.quiz-say{
  width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;font-size:17px;
  background:var(--lavender-soft);color:var(--lavender);
}
.quiz-q{text-align:center;font-size:12px;color:var(--text-low);font-weight:700;margin-bottom:14px}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quiz-opt{
  min-height:58px;padding:10px;border-radius:16px;cursor:pointer;font-size:14px;font-weight:800;color:var(--text);
  background:var(--card);border:2px solid var(--border);border-bottom-width:4px;
  transition:transform .1s ease,background .15s,border-color .15s;
}
.quiz-opt:active{transform:translateY(2px)}
.quiz-opt.right{background:var(--mint-soft);border-color:var(--mint);color:var(--mint);animation:bump .35s ease}
.quiz-opt.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red);animation:shake .35s ease}
.quiz-opt:disabled{cursor:default}
.quiz-fb{text-align:center;font-size:13px;font-weight:800;min-height:20px;margin-top:12px}
.quiz-fb.ok{color:var(--mint)}
.quiz-fb.no{color:var(--red)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ── PHRASE OF THE DAY (compact) ──────────────────────── */
.phrase{margin-top:14px;display:flex;align-items:center;gap:14px}
.phrase-body{flex:1;min-width:0}
.phrase-tag{font-size:11px;color:var(--text-low);font-weight:700}
.phrase-ko{font-family:'Noto Sans KR',sans-serif;font-size:20px;font-weight:900;margin-top:4px}
.phrase-rom{font-size:12px;color:var(--text-low);font-style:italic;margin-top:2px}
.phrase-meaning{font-size:13px;color:var(--text-mid);margin-top:4px}
.phrase-actions{display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.round-btn{
  width:42px;height:42px;border-radius:50%;border:1px solid var(--border);cursor:pointer;font-size:16px;
  background:var(--lavender-soft);color:var(--lavender);
}
.round-btn.saved{background:var(--pink-soft);color:var(--pink)}

/* ── EXPLORE LINK ─────────────────────────────────────── */
.dash-explore{
  display:flex;align-items:center;justify-content:center;gap:6px;margin-top:20px;padding:12px;
  font-size:12px;font-weight:700;color:var(--text-mid);text-decoration:none;
  border:1px dashed var(--border);border-radius:14px;
}

@media (prefers-reduced-motion: reduce){
  .dash-flame.lit,.step,.step.current .step-node,.quiz-opt,.quiz-combo.bump{animation:none !important}
  .ring .ring-fg{transition:none}
}
@media(max-width:380px){
  .dash-greet{flex-direction:column;align-items:flex-start}
  .quiz-ko{font-size:30px}
}
</style>
</head>

'use strict';

var LANG = localStorage.getItem('RK_LANG') || 'ro';
var AUDIENCE = localStorage.getItem('RK_AUDIENCE') || 'adult';
if(AUDIENCE === 'student') document.body.classList.add('audience-student');
RKNav.init('home');

var UI = {
  ro:{
    greetSub: AUDIENCE === 'student' ? 'Gata de o nouă provocare? 🎒' : 'Gata pentru coreeana de azi?',
    todayEyebrow:'AZI', stepsLbl:'pași',
    nextTitle:function(t){ return t; },
    allDoneEyebrow:'GATA PE AZI', allDoneTitle:'Ziua e completă! 🎉', allDoneSub:'Revino mâine — sau mai fă un quiz mai jos.',
    allDoneCta:'Vezi progresul',

/* ── STATS ── */
function renderStats(){
  var streak = window.RKStreak ? RKStreak.get() : {days:0};

/* ── HELPERS ── */
function dueCount(key){
  if(!window.RKSrs) return 0;
  var data = RKSrs.load(key);
  var now = Date.now();
  var n = 0;
  Object.keys(data).forEach(function(k){ if(data[k] && data[k].due <= now) n++; });
  return n;
}
function countHardExercises(){
  if(!window.RKStorage) return 0;
  var srs = RKStorage.get('RK_EX_SRS', {});
  var n = 0;
  Object.keys(srs).forEach(function(key){
    var c = srs[key];
    if(c && c.n >= 1 && c.EF < 2.2) n++;
  });
  return n;
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function isDailyFlagDone(key){
  try {
    var d = JSON.parse(localStorage.getItem(key) || 'null');
    return !!(d && d.date === todayStr() && d.done);
  } catch(e){ return false; }
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ── LESSON STEP (real lessons.json + RK_LESSON_DONE) ── */
var _lessons = null;
function lessonStep(){
  var l = L();
  if(!_lessons) return null;
  var doneLessons = JSON.parse(localStorage.getItem('RK_LESSON_DONE') || '[]');
  var goal = null;
  try { goal = JSON.parse(localStorage.getItem('RK_TOPIK_GOAL') || 'null'); } catch(e){}
  var storedLevel = parseInt(localStorage.getItem('RK_LEVEL'), 10);
  var level = (goal && goal.level) || (storedLevel >= 1 && storedLevel <= 6 ? storedLevel : 1);
  var inLevel = _lessons.filter(function(ls){ return ls.topik === level; });
  var doneIn = inLevel.filter(function(ls){ return doneLessons.indexOf(ls.id) !== -1; });
  var next = inLevel.filter(function(ls){ return doneLessons.indexOf(ls.id) === -1; })[0];
  var pct = inLevel.length ? Math.round(doneIn.length / inLevel.length * 100) : 0;

  // "Done today" = a lesson was finished today (lessons.html / exercises.js stamp RK_LESSON_TODAY)
  var doneToday = localStorage.getItem('RK_LESSON_TODAY') === todayStr();
  if(!next){
    return { icon:'🏯', title:l.levelDone, sub:l.levelDoneSub, href:'map.html', done:doneToday, pct:100 };
  }
  var title = next.title ? (next.title[LANG] || next.title.ro) : next.id;
  return {
    icon:'📖', title: doneLessons.length ? title : l.lessonStart,
    sub: 'TOPIK ' + level + ' · ' + (doneLessons.length ? l.lessonStep : title),
    href:'lessons.html?level=' + level, done:doneToday, pct:pct, isLesson:true
  };
}

/* ── TODAY: build the step list, then render hero + path from it ── */
function buildSteps(){
  var l = L();
  var goals = window.RKGamification ? RKGamification.getDailyTaskGoals() : {vocab:10, sentences:3, grammar:3};
  var tasks = window.RKGamification ? RKGamification.getDailyTasks() : {vocab:0, sentences:0, grammar:0};
  var listenDone = isDailyFlagDone('RK_DAILY_LISTEN');
  var steps = [];

  var reviewTotal = dueCount('RK_FC_SRS') + dueCount('RK_HJ_SRS') + countHardExercises();
  if(reviewTotal >= 8){
    steps.push({ icon:'🧠', title:l.reviewStep, sub:l.reviewSub(reviewTotal), href:'review.html', done:false, extra:true });
  }
  var ls = lessonStep();
  if(ls) steps.push(Object.assign({ extra:true }, ls));

  var mission;
  if(AUDIENCE === 'student'){
    mission = [
      { icon:'🃏', done: tasks.vocab >= goals.vocab, title: l.missionVocab(Math.min(tasks.vocab,goals.vocab), goals.vocab), sub:l.vocabSub, href:'exercises.html?type=ko-ro', pct: Math.round(Math.min(tasks.vocab,goals.vocab)/goals.vocab*100) },
      { icon:'가', done: isDailyFlagDone('RK_DAILY_HANGUL'), title: l.missionHangul, sub:l.hangulSub, href:'hangul.html' },
      { icon:'🧩', done: tasks.sentences >= goals.sentences, title: l.missionSentences(Math.min(tasks.sentences,goals.sentences), goals.sentences), sub:l.sentSub, href:'exercises.html?type=puzzle' },
      { icon:'🎧', done: listenDone, title: l.missionListeningGame, sub:l.listenSub, href:'listening.html' }
    ];
  } else {
    mission = [
      { icon:'🃏', done: tasks.vocab >= goals.vocab, title: l.missionVocab(Math.min(tasks.vocab,goals.vocab), goals.vocab), sub:l.vocabSub, href:'exercises.html?type=ko-ro', pct: Math.round(Math.min(tasks.vocab,goals.vocab)/goals.vocab*100) },
      { icon:'🎯', done: tasks.grammar >= goals.grammar, title: l.missionGrammar(Math.min(tasks.grammar,goals.grammar), goals.grammar), sub:l.grammarSub, href:'exercises.html?type=particle' },
      { icon:'🧩', done: tasks.sentences >= goals.sentences, title: l.missionSentences(Math.min(tasks.sentences,goals.sentences), goals.sentences), sub:l.sentSub, href:'exercises.html?type=puzzle' },
      { icon:'🎧', done: listenDone, title: l.missionListening, sub:l.listenSub, href:'listening.html' },
      { icon:'🗣️', done: isDailyFlagDone('RK_DAILY_PRON'), title: l.missionSpeaking, sub:l.speakSub, href:'reading.html' }
    ];
  }
  return { steps: steps.concat(mission), mission: mission };
}

var _lastMissionDone = null;
function renderToday(){
  var l = L();
  if(!_lessons){
    fetch('./data/lessons.json').then(function(r){ return r.json(); }).then(function(d){ _lessons = d; renderToday(); }).catch(function(){ _lessons = []; renderToday(); });
  }
  var built = buildSteps();
  var steps = built.steps;
  var doneCount = steps.filter(function(s){ return s.done; }).length;
  var current = steps.filter(function(s){ return !s.done; })[0];

  // Path
  document.getElementById('pathCount').textContent = l.pathCount(doneCount, steps.length);
  document.getElementById('path').innerHTML = steps.map(function(s, i){
    var cls = 'step' + (s.done ? ' done' : (s === current ? ' current' : ''));
    var mini = (!s.done && s.pct > 0 && s.pct < 100) ? '<div class="step-mini"><i style="width:' + s.pct + '%"></i></div>' : '';
    return '<a class="' + cls + '" href="' + s.href + '" style="animation-delay:' + (i * 50) + 'ms">' +
      '<span class="step-node">' + (s.done ? '✓' : s.icon) + '</span>' +
      '<span class="step-body"><div class="step-title">' + esc(s.title) + '</div><div class="step-sub">' + esc(s.sub || '') + '</div>' + mini + '</span>' +
      '<span class="step-go">' + (s.done ? l.done : (s === current ? l.go + ' →' : '›')) + '</span>' +
    '</a>';
  }).join('');

  // Hero ring + CTA
  var total = steps.length || 1;
  var C = 213.6;
  document.getElementById('ringFg').setAttribute('stroke-dashoffset', String(C - C * doneCount / total));
  document.getElementById('ringNum').textContent = doneCount + '/' + steps.length;
  document.getElementById('ringLbl').textContent = l.stepsLbl;
  var cta = document.getElementById('todayCta');
  if(current){
    document.getElementById('todayEyebrow').textContent = l.todayEyebrow + ' · ' + new Date().toLocaleDateString(LANG === 'ro' ? 'ro-RO' : 'en-US', { weekday:'long', day:'numeric', month:'short' });
    document.getElementById('todayTitle').textContent = current.title;
    document.getElementById('todaySub').textContent = current.sub || '';
    document.getElementById('todayCtaIco').textContent = current.icon;
    document.getElementById('todayCtaLbl').textContent = (doneCount ? l.continueCta : l.startCta) + ' →';
    cta.href = current.href;
  } else {
    document.getElementById('todayEyebrow').textContent = l.allDoneEyebrow;
    document.getElementById('todayTitle').textContent = l.allDoneTitle;
    document.getElementById('todaySub').textContent = l.allDoneSub;
    document.getElementById('todayCtaIco').textContent = '🏆';
    document.getElementById('todayCtaLbl').textContent = l.allDoneCta + ' →';
    cta.href = 'profile.html';
  }

  // Mission bonus: only the core daily tasks count, not the extra lesson/review steps.
  var missionAllDone = built.mission.every(function(s){ return s.done; });
  if(missionAllDone) maybeAwardMissionComplete(l);
  _lastMissionDone = missionAllDone;
}

var MISSION_XP_BONUS = 50;
var MISSION_COIN_BONUS = 20;
function maybeAwardMissionComplete(l){
  if(!window.RKGamification) return;
  var flagKey = 'RK_DAILY_MISSION_AWARDED';
  var rec = null;
  try { rec = JSON.parse(localStorage.getItem(flagKey) || 'null'); } catch(e){}
  if(rec && rec.date === todayStr()) return;
  localStorage.setItem(flagKey, JSON.stringify({date: todayStr()}));
  RKGamification.addXPBonus(MISSION_XP_BONUS);
  RKGamification.addCoins(MISSION_COIN_BONUS);
  if(window.RKStreak) RKStreak.touch();
  renderStats();
  showMissionCompleteOverlay(l);
}

function ensureKeyframes(){
  if(document.getElementById('dashMissionKeyframes')) return;
  var style = document.createElement('style');
  style.id = 'dashMissionKeyframes';
  style.textContent =
    '@keyframes dashFadeIn{from{opacity:0}to{opacity:1}}' +
    '@keyframes dashPop{0%{opacity:0;transform:scale(.85)}100%{opacity:1;transform:scale(1)}}' +
    '@keyframes dashConfettiFall{' +
      '0%{transform:translateY(0) rotate(0deg);opacity:1}' +
      '100%{transform:translateY(var(--fall)) rotate(var(--spin));opacity:0}' +
    '}';
  document.head.appendChild(style);
}
function showMissionCompleteOverlay(l){
  ensureKeyframes();
  var backdrop = document.createElement('div');
  backdrop.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(18,19,28,.55);' +
    'backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;cursor:pointer;' +
    'animation:dashFadeIn .25s ease both';
  var card = document.createElement('div');
  card.style.cssText = 'background:var(--card);border-radius:24px;padding:36px 32px;text-align:center;' +
    'max-width:320px;width:88vw;box-shadow:0 20px 60px rgba(0,0,0,.25);' +
    'animation:dashPop .4s cubic-bezier(.34,1.56,.64,1) both';
  card.innerHTML =
    '<div style="font-size:48px;line-height:1">🎉</div>' +
    '<div style="font-size:20px;font-weight:900;margin-top:12px;color:var(--text);letter-spacing:.02em">' + l.missionCompleteTitle + '</div>' +
    '<div style="font-size:14px;color:var(--text-mid);margin-top:8px">' + l.missionCompleteSub(MISSION_XP_BONUS) + '</div>' +
    '<div style="font-size:11px;color:var(--text-low);margin-top:16px">' + l.missionCompleteTap + '</div>';
  backdrop.appendChild(card);
  fireConfetti(backdrop, 36);
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', function(){ backdrop.remove(); });
  setTimeout(function(){ if(backdrop.parentNode) backdrop.remove(); }, 4500);
}
function fireConfetti(container, count){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  ensureKeyframes();
  var colors = ['#E96A9A','#6C5CE7','#F4C95D','#2FB67C','#4A90A4'];
  for(var i = 0; i < count; i++){
    var piece = document.createElement('div');
    var fall = 60 + Math.random() * 30;
    var spin = (Math.random() > 0.5 ? 1 : -1) * (180 + Math.random() * 360);
    piece.style.cssText =
      'position:absolute;top:-10px;left:' + (Math.random() * 100) + '%;width:8px;height:8px;background:' + colors[i % colors.length] + ';' +
      (i % 3 === 0 ? 'border-radius:50%;' : '') + 'pointer-events:none;' +
      '--fall:' + fall + 'vh;--spin:' + spin + 'deg;' +
      'animation:dashConfettiFall ' + (1.6 + Math.random() * 1.2) + 's ease-in ' + (Math.random() * 0.3) + 's both';
    container.appendChild(piece);
  }
}

/* ── QUICK QUIZ (real vocab-korean.json; a correct answer counts toward the
   daily vocab task exactly like a ko-ro exercise does) ── */
var _vocab = null, _quizItem = null, _quizCombo = 0, _quizLock = false;
function loadVocab(cb){
  if(_vocab){ cb(); return; }
  fetch('./data/vocab-korean.json').then(function(r){ return r.json(); }).then(function(d){
    // Plain words only: skip grammar endings like "-고 있다" and long entries.
    _vocab = d.filter(function(v){
      return v.ko && v.ro && v.en && v.ko.charAt(0) !== '-' && v.ko.length <= 6 &&
        !(v.categories || []).some(function(c){ return c === 'grammar'; });
    });
    cb();
  }).catch(function(){});
}
function pickQuiz(){
  var pool = _vocab;
  var item;
  do { item = pool[Math.floor(Math.random() * pool.length)]; } while(pool.length > 1 && item === _quizItem);
  var opts = [item];
  var guard = 0;
  while(opts.length < 4 && guard++ < 200){
    var o = pool[Math.floor(Math.random() * pool.length)];
    if(opts.every(function(x){ return x.ro !== o.ro && x.en !== o.en; })) opts.push(o);
  }
  opts.sort(function(){ return Math.random() - 0.5; });
  _quizItem = item;
  _quizItem._opts = opts;
}
function renderQuiz(){
  if(!_vocab){ loadVocab(function(){ pickQuiz(); renderQuiz(); }); return; }
  if(!_quizItem) pickQuiz();
  var item = _quizItem;
  document.getElementById('quizKo').textContent = item.ko;
  document.getElementById('quizFb').textContent = '';
  document.getElementById('quizFb').className = 'quiz-fb';
  document.getElementById('quizCombo').textContent = '🔥 ' + _quizCombo;
  var box = document.getElementById('quizOpts');
  box.innerHTML = '';
  item._opts.forEach(function(o){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'quiz-opt';
    b.textContent = o[LANG] || o.ro;
    b.addEventListener('click', function(){ answerQuiz(o, b); });
    box.appendChild(b);
  });
  _quizLock = false;
}
function answerQuiz(choice, btn){
  if(_quizLock) return;
  _quizLock = true;
  var l = L();
  var item = _quizItem;
  var ok = choice === item;
  var fb = document.getElementById('quizFb');
  var buttons = document.querySelectorAll('.quiz-opt');
  buttons.forEach(function(b){ b.disabled = true; });
  if(window.AudioEngine) AudioEngine.speak(item.ko);
  if(ok){
    btn.classList.add('right');
    _quizCombo++;
    fb.className = 'quiz-fb ok';
    fb.textContent = l.right[Math.floor(Math.random() * l.right.length)];
    if(window.RKGamification){
      RKGamification.addXP(_quizCombo);
      RKGamification.incrementDailyTask('vocab');
    }
    if(window.RKStreak) RKStreak.touch();
    var combo = document.getElementById('quizCombo');
    combo.classList.remove('bump'); void combo.offsetWidth; combo.classList.add('bump');
    if(_quizCombo > 0 && _quizCombo % 5 === 0) fireConfetti(document.getElementById('quizCard'), 18);
    renderStats();
    renderToday();
  } else {
    btn.classList.add('wrong');
    _quizCombo = 0;
    fb.className = 'quiz-fb no';
    fb.textContent = l.wrong(item[LANG] || item.ro);
    buttons.forEach(function(b){ if(b.textContent === (item[LANG] || item.ro)) b.classList.add('right'); });
  }
  document.getElementById('quizCombo').textContent = '🔥 ' + _quizCombo;
  setTimeout(function(){ pickQuiz(); renderQuiz(); }, ok ? 1000 : 1800);
}
document.getElementById('quizCard').style.position = 'relative';
document.getElementById('quizCard').style.overflow = 'hidden';
document.getElementById('quizSay').addEventListener('click', function(){
  if(_quizItem && window.AudioEngine) AudioEngine.speak(_quizItem.ko);
});

/* ── PHRASE OF THE DAY (real phrases.json) ── */
var _phrasePool = null;
function renderWordOfDay(){
  if(!_phrasePool){
    fetch('./data/phrases.json').then(function(r){ return r.json(); }).then(function(data){
      var pool = [];
      (data.situations || []).forEach(function(sit){
        (sit.items || []).forEach(function(item){ pool.push(Object.assign({ _situation: sit }, item)); });
      });
      _phrasePool = pool;
      renderWordOfDay();
    }).catch(function(){});
    return;
  }
  if(!_phrasePool.length) return;
  var epochDay = Math.floor(Date.now() / 86400000);
  var phrase = _phrasePool[epochDay % _phrasePool.length];
  document.getElementById('wodTag').textContent = (phrase._situation.icon || '') + ' ' + (phrase._situation[LANG] || phrase._situation.ro || '');
  document.getElementById('wodKo').textContent = phrase.ko;
  document.getElementById('wodRom').textContent = phrase.rom || '';
  document.getElementById('wodRom').style.display = localStorage.getItem('RK_SHOW_ROM') === '0' ? 'none' : '';
  document.getElementById('wodMeaning').textContent = phrase[LANG] || phrase.ro;
  document.getElementById('wodPlayBtn').onclick = function(){ if(window.AudioEngine) AudioEngine.speak(phrase.ko); };
  var saved = JSON.parse(localStorage.getItem('RK_SAVED_PHRASES') || '[]');
  var saveBtn = document.getElementById('wodSaveBtn');
  var isSaved = saved.indexOf(phrase.ko) !== -1;
  saveBtn.textContent = isSaved ? '★' : '☆';
  saveBtn.classList.toggle('saved', isSaved);
  saveBtn.onclick = function(){
    var list = JSON.parse(localStorage.getItem('RK_SAVED_PHRASES') || '[]');
    var i = list.indexOf(phrase.ko);
    if(i === -1) list.push(phrase.ko); else list.splice(i, 1);
    localStorage.setItem('RK_SAVED_PHRASES', JSON.stringify(list));
    renderWordOfDay();
  };
}

renderStats();
applyLang();
