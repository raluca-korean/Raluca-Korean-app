<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raluca Korean</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#8b7cd8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f6fb; --card:#ffffff; --text:#1f2430; --text-mid:#6b6f80; --text-low:#9a9dae;
  --border:#ececf3; --shadow:rgba(31,36,48,.06);
  --lavender:#8b7cd8; --lavender-soft:#efe9ff; --pink:#e08bb0; --pink-soft:#fdeef4; --denim:#4f6fa8;
  --bar-bg:#eeecf5;
}
body.dark-mode{
  --bg:#12131c; --card:#1a1c29; --text:#eeeef4; --text-mid:#9a9db0; --text-low:#6b6f80;
  --border:rgba(255,255,255,.08); --shadow:rgba(0,0,0,.3);
  --lavender:#a99bf0; --lavender-soft:rgba(169,155,240,.14); --pink:#e6a4c2; --pink-soft:rgba(230,164,194,.12); --denim:#87a3d6;
  --bar-bg:rgba(255,255,255,.08);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;transition:background .25s ease,color .25s ease;
}
.kr{font-family:'Noto Sans KR',sans-serif}
a{color:inherit}

.dash{max-width:560px;margin:0 auto;padding:0 16px 96px}

/* ── TOPBAR ───────────────────────────────────────────── */
.dash-topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 0 6px}
.dash-brand{font-size:15px;font-weight:800;letter-spacing:-.01em}
.dash-topbar-actions{display:flex;align-items:center;gap:8px}
.dash-icon-btn{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--card);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--text-mid);
  text-decoration:none;
}
.dash-lang{display:flex;border:1px solid var(--border);border-radius:20px;overflow:hidden;background:var(--card)}
.dash-lang button{border:none;background:none;padding:7px 12px;font-size:11px;font-weight:800;color:var(--text-low);cursor:pointer;font-family:inherit}
.dash-lang button.active{background:var(--lavender);color:#fff}

/* ── GREETING ─────────────────────────────────────────── */
.dash-greet{padding:18px 0 6px}
.dash-greet-kr{font-size:26px;font-weight:900}
.dash-greet-sub{font-size:14px;color:var(--text-mid);margin-top:4px}
.dash-stats{display:flex;gap:10px;margin-top:14px}
.dash-stat{
  display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:7px 12px;font-size:13px;font-weight:700;box-shadow:0 2px 8px var(--shadow);
}

/* ── CARDS ────────────────────────────────────────────── */
.dash-card{
  display:block;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:20px;margin-top:16px;box-shadow:0 4px 18px var(--shadow);
}
.dash-card-eyebrow{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--lavender)}
.dash-bar-bg{height:8px;background:var(--bar-bg);border-radius:5px;overflow:hidden;margin-top:12px}
.dash-bar{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--lavender),var(--pink));transition:width .8s cubic-bezier(.4,0,.2,1)}

/* ── CONTINUE LEARNING ────────────────────────────────── */
.dash-continue-title{font-size:19px;font-weight:900;margin-top:8px}
.dash-continue-sub{font-size:13px;color:var(--text-mid);margin-top:3px}
.dash-cta{display:flex;align-items:center;gap:6px;margin-top:14px;font-size:13px;font-weight:800;color:var(--lavender)}

/* ── DAILY MISSION ────────────────────────────────────── */
.dash-mission-list{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.dash-mission-item{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text)}
.dash-mission-item.done{color:var(--text-low);text-decoration:line-through}
.dash-mission-check{font-size:15px;flex-shrink:0}
.dash-cta-link{display:inline-block;margin-top:14px;font-size:13px;font-weight:800;color:var(--lavender);text-decoration:none}

/* ── QUICK PRACTICE ───────────────────────────────────── */
.dash-section-title{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-low);margin:24px 4px 10px}
.dash-quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dash-quick-item{
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;text-decoration:none;color:var(--text);
  background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 2px 10px var(--shadow);
}
.dash-quick-icon{font-size:20px}
.dash-quick-lbl{font-size:11px;font-weight:700;text-align:center}

/* ── WORD OF THE DAY ──────────────────────────────────── */
.dash-wod-tag{font-size:11px;color:var(--text-low);font-weight:700;margin-top:2px}
.dash-wod-ko{font-family:'Noto Sans KR',sans-serif;font-size:24px;font-weight:900;margin-top:10px}
.dash-wod-rom{font-size:12px;color:var(--text-low);margin-top:2px;font-style:italic}
.dash-wod-meaning{font-size:14px;color:var(--text-mid);margin-top:8px}
.dash-wod-actions{display:flex;gap:10px;margin-top:14px}
.dash-wod-btn{
  border:1px solid var(--border);background:var(--lavender-soft);color:var(--lavender);border-radius:12px;
  padding:8px 14px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;
}
.dash-wod-btn.saved{background:var(--pink-soft);color:var(--pink)}

/* ── PROGRESS PREVIEW ─────────────────────────────────── */
.dash-skill{margin-top:12px}
.dash-skill:first-of-type{margin-top:14px}
.dash-skill-head{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:5px}
.dash-skill-head span:last-child{color:var(--text-low);font-weight:600}

/* ── EXPLORE LINK ─────────────────────────────────────── */
.dash-explore{
  display:flex;align-items:center;justify-content:center;gap:6px;margin-top:20px;padding:12px;
  font-size:12px;font-weight:700;color:var(--text-mid);text-decoration:none;
  border:1px dashed var(--border);border-radius:14px;
}

/* ── BOTTOM NAV ───────────────────────────────────────── */
.dash-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;justify-content:space-around;
  background:var(--card);border-top:1px solid var(--border);
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
}
.dash-nav-item{
  display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--text-low);
  font-size:10px;font-weight:700;padding:4px 10px;border-radius:10px;
}
.dash-nav-item.active{color:var(--lavender)}
.dash-nav-icon{font-size:18px}

@media(max-width:380px){
  .dash-quick-lbl{font-size:10px}
}
</style>
</head>
<body class="theme-anime">

<div class="dash">

  <div class="dash-topbar">
    <div class="dash-brand">Raluca Korean</div>
    <div class="dash-topbar-actions">
      <div class="dash-lang">
        <button id="btnRo" type="button">RO</button>
        <button id="btnEn" type="button">EN</button>
      </div>

    </div>
  </div>

  <div class="dash-greet">
    <div class="dash-greet-kr kr">안녕하세요! 👋</div>
    <div class="dash-greet-sub" id="greetSub">Ready for today's Korean?</div>
    <div class="dash-stats">
      <div class="dash-stat">🔥 <span id="statStreak">0</span></div>

      <div class="dash-stat">🎯 Lv.<span id="statLevel">1</span></div>

  <a class="dash-card" id="continueCard" href="lessons.html">

    <div class="dash-continue-title" id="continueTitle"></div>
    <div class="dash-continue-sub" id="continueSub"></div>
    <div class="dash-bar-bg" id="continueBarWrap"><div class="dash-bar" id="continueBar" style="width:0%"></div></div>
    <div class="dash-cta" id="continueCta">CONTINUE →</div>
  </a>

  <div class="dash-card">
    <div class="dash-card-eyebrow">🇰🇷 <span id="missionTitle">TODAY'S MISSION</span></div>
    <div class="dash-mission-list" id="missionList"></div>
    <div class="dash-bar-bg"><div class="dash-bar" id="missionBar" style="width:0%"></div></div>
    <a class="dash-cta-link" id="missionCta" href="today.html">Open today's mission →</a>
  </div>

  <div class="dash-section-title" id="quickTitle">QUICK PRACTICE</div>
  <div class="dash-quick-grid" id="quickGrid"></div>

  <div class="dash-card">
    <div class="dash-card-eyebrow">오늘의 표현</div>
    <div class="dash-wod-tag" id="wodTag"></div>
    <div class="dash-wod-ko kr" id="wodKo"></div>
    <div class="dash-wod-rom" id="wodRom"></div>
    <div class="dash-wod-meaning" id="wodMeaning"></div>
    <div class="dash-wod-actions">
      <button class="dash-wod-btn" id="wodPlayBtn" type="button">🔊 Listen</button>
      <button class="dash-wod-btn" id="wodSaveBtn" type="button">☆ Save</button>
    </div>
  </div>

  <div class="dash-card">
    <div class="dash-card-eyebrow" id="progressTitle">YOUR KOREAN</div>
    <div id="progressBars"></div>
    <a class="dash-cta-link" href="profile.html" id="progressLink">Full progress →</a>
  </div>

  <a class="dash-explore" href="explore.html" id="exploreLink">🧭 See every feature</a>

</div><!-- /dash -->

<nav class="dash-nav">
  <a href="index.html" class="dash-nav-item active"><span class="dash-nav-icon">🏠</span><span id="navHome">Home</span></a>
  <a href="learn.html" class="dash-nav-item"><span class="dash-nav-icon">📚</span><span id="navLearn">Learn</span></a>
  <a href="play.html" class="dash-nav-item"><span class="dash-nav-icon">🎯</span><span id="navPractice">Practice</span></a>
  <a href="reading.html" class="dash-nav-item"><span class="dash-nav-icon">🗣️</span><span id="navSpeak">Speak</span></a>
  <a href="profile.html" class="dash-nav-item"><span class="dash-nav-icon">👤</span><span id="navProgress">Progress</span></a>
</nav>

<script src="./js/core/storage.js"></script>
<script src="./js/core/srs.js"></script>
<script src="./js/core/gamification.js"></script>
<script src="./js/core/streak.js"></script>
<script src="./js/core/audio.js"></script>
<script>
'use strict';

var LANG = localStorage.getItem('RK_LANG') || 'ro';

var UI = {
  ro:{
    greetSub:'Gata pentru coreeana de azi?',
    continueEyebrow:'CONTINUĂ ÎNVĂȚAREA', continueCta:'CONTINUĂ →',
    startTitle:'ÎNCEPE CĂLĂTORIA TA COREEANĂ', startSub:'Prima ta lecție te așteaptă.', startCta:'START →',
    levelDoneTitle:'Nivel complet! 🎉', levelDoneSub:'Ai parcurs toate lecțiile de la acest nivel.',
    missionTitle:"MISIUNEA DE AZI", missionCta:'Deschide misiunea de azi →', missionDoneCta:'Misiune completă azi! ✨',
    vocabItem:function(n){ return n + ' cuvinte de recapitulat'; },
    hanjaItem:function(n){ return n + ' caractere hanja de recapitulat'; },
    exItem:function(n){ return n + ' exerciții de recapitulat'; },
    allCaughtUp:'Totul e la zi azi',
    quickTitle:'PRACTICĂ RAPIDĂ',
    quick:[
      {icon:'🧠', lbl:'REVIEW', href:'review.html'},
      {icon:'🎧', lbl:'LISTEN', href:'listening.html'},
      {icon:'🗣️', lbl:'SPEAK', href:'reading.html'},
      {icon:'✍️', lbl:'WRITE', href:'builder.html'}
    ],
    play:'🔊 Ascultă', save:'☆ Salvează', saved:'★ Salvat',
    progressTitle:'CUNOȘTINȚELE TALE', progressLink:'Progres complet →',
    vocab:'Vocabular', grammar:'Gramatică', sentences:'Propoziții', listening:'Ascultare',
    exploreLink:'🧭 Vezi toate funcțiile',
    navHome:'Acasă', navLearn:'Învață', navPractice:'Practică', navSpeak:'Vorbește', navProgress:'Progres'
  },
  en:{
    greetSub:'Ready for today\'s Korean?',
    continueEyebrow:'CONTINUE LEARNING', continueCta:'CONTINUE →',
    startTitle:'START YOUR KOREAN JOURNEY', startSub:'Your first lesson is waiting.', startCta:'START →',
    levelDoneTitle:'Level complete! 🎉', levelDoneSub:"You've covered every lesson at this level.",
    missionTitle:"TODAY'S MISSION", missionCta:"Open today's mission →", missionDoneCta:'Daily mission complete! ✨',
    vocabItem:function(n){ return n + ' words to review'; },
    hanjaItem:function(n){ return n + ' hanja characters to review'; },
    exItem:function(n){ return n + ' exercises to review'; },
    allCaughtUp:"You're all caught up today",
    quickTitle:'QUICK PRACTICE',
    quick:[
      {icon:'🧠', lbl:'REVIEW', href:'review.html'},
      {icon:'🎧', lbl:'LISTEN', href:'listening.html'},
      {icon:'🗣️', lbl:'SPEAK', href:'reading.html'},
      {icon:'✍️', lbl:'WRITE', href:'builder.html'}
    ],
    play:'🔊 Listen', save:'☆ Save', saved:'★ Saved',
    progressTitle:'YOUR KOREAN', progressLink:'Full progress →',
    vocab:'Vocabulary', grammar:'Grammar', sentences:'Sentences', listening:'Listening',
    exploreLink:'🧭 See every feature',
    navHome:'Home', navLearn:'Learn', navPractice:'Practice', navSpeak:'Speak', navProgress:'Progress'
  }
};
function L(){ return UI[LANG]; }

/* ── LANG + DARK MODE (self-contained, no dependency on lang-picker.js's DOM shape) ── */
function applyLang(){
  var l = L();
  document.getElementById('btnRo').classList.toggle('active', LANG === 'ro');
  document.getElementById('btnEn').classList.toggle('active', LANG === 'en');
  document.getElementById('greetSub').textContent = l.greetSub;
  document.getElementById('missionCta').textContent = l.missionCta;
  document.getElementById('quickTitle').textContent = l.quickTitle;
  document.getElementById('progressTitle').textContent = l.progressTitle;
  document.getElementById('progressLink').textContent = l.progressLink;
  document.getElementById('exploreLink').textContent = l.exploreLink;
  document.getElementById('navHome').textContent = l.navHome;
  document.getElementById('navLearn').textContent = l.navLearn;
  document.getElementById('navPractice').textContent = l.navPractice;
  document.getElementById('navSpeak').textContent = l.navSpeak;
  document.getElementById('navProgress').textContent = l.navProgress;
  renderQuick();
  renderContinue();
  renderMission();
  renderWordOfDay();
  renderProgress();
}
document.getElementById('btnRo').addEventListener('click', function(){ LANG = 'ro'; localStorage.setItem('RK_LANG','ro'); applyLang(); });
document.getElementById('btnEn').addEventListener('click', function(){ LANG = 'en'; localStorage.setItem('RK_LANG','en'); applyLang(); });

function applyDarkIcon(){
  document.getElementById('darkToggle').textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
}
(function initTheme(){
  var theme = localStorage.getItem('RK_THEME');
  var isDark = theme === 'dark' || theme === null;
  document.body.classList.toggle('dark-mode', isDark);
  applyDarkIcon();
})();
document.getElementById('darkToggle').addEventListener('click', function(){
  var nowDark = !document.body.classList.contains('dark-mode');
  document.body.classList.toggle('dark-mode', nowDark);
  localStorage.setItem('RK_THEME', nowDark ? 'dark' : 'light');
  applyDarkIcon();
});

/* ── STATS ────────────────────────────────────────────── */
function renderStats(){
  var streak = window.RKStreak ? RKStreak.get() : {days:0};
  var xpData = window.RKGamification ? RKGamification.getXPData() : {total:0};
  var lvl = window.RKGamification ? RKGamification.getLevelInfo(xpData.total) : {current:{level:1}};
  document.getElementById('statStreak').textContent = streak.days;
  document.getElementById('statXp').textContent = xpData.total;
  document.getElementById('statLevel').textContent = lvl.current.level;
}

/* ── QUICK PRACTICE ───────────────────────────────────── */
function renderQuick(){
  var l = L();
  document.getElementById('quickGrid').innerHTML = l.quick.map(function(q){
    return '<a class="dash-quick-item" href="' + q.href + '">' +
      '<span class="dash-quick-icon">' + q.icon + '</span>' +
      '<span class="dash-quick-lbl">' + q.lbl + '</span>' +
    '</a>';
  }).join('');
}

/* ── CONTINUE LEARNING (real lesson data + real RK_LESSON_DONE progress) ── */
var _lessons = null;
function renderContinue(){
  var l = L();
  if(!_lessons){
    fetch('./data/lessons.json').then(function(r){ return r.json(); }).then(function(data){
      _lessons = data;
      renderContinue();
    });
    return;
  }
  var doneLessons = JSON.parse(localStorage.getItem('RK_LESSON_DONE') || '[]');
  var goal = null;
  try { goal = JSON.parse(localStorage.getItem('RK_TOPIK_GOAL') || 'null'); } catch(e){}
  var level = (goal && goal.level) || 1;

  var lessonsInLevel = _lessons.filter(function(ls){ return ls.topik === level; });
  var lessonsDone = lessonsInLevel.filter(function(ls){ return doneLessons.indexOf(ls.id) !== -1; });
  var nextLesson = lessonsInLevel.filter(function(ls){ return doneLessons.indexOf(ls.id) === -1; })[0];

  var card = document.getElementById('continueCard');
  var eyebrow = document.getElementById('continueEyebrow');
  var title = document.getElementById('continueTitle');
  var sub = document.getElementById('continueSub');
  var bar = document.getElementById('continueBar');
  var barWrap = document.getElementById('continueBarWrap');
  var cta = document.getElementById('continueCta');

  if(doneLessons.length === 0){
    eyebrow.textContent = '';
    title.textContent = l.startTitle;
    sub.textContent = l.startSub;
    barWrap.style.display = 'none';
    cta.textContent = l.startCta;
    card.href = 'lessons.html';
  } else if(!nextLesson){
    eyebrow.textContent = l.continueEyebrow;
    title.textContent = l.levelDoneTitle;
    sub.textContent = l.levelDoneSub;
    barWrap.style.display = '';
    bar.style.width = '100%';
    cta.textContent = l.continueCta;
    card.href = 'map.html';
  } else {
    eyebrow.textContent = l.continueEyebrow;
    title.textContent = nextLesson.title ? (nextLesson.title[LANG] || nextLesson.title.ro) : nextLesson.id;
    sub.textContent = 'TOPIK ' + level + ' · ' + nextLesson.id;
    barWrap.style.display = '';
    var pct = lessonsInLevel.length ? Math.round(lessonsDone.length / lessonsInLevel.length * 100) : 0;
    bar.style.width = pct + '%';
    cta.textContent = l.continueCta;
    card.href = 'lessons.html?level=' + level;
  }
}

/* ── DAILY MISSION (reuses the exact SRS due-counts + daily quest already tracked app-wide) ── */
function dueCount(key){
  if(!window.RKSrs) return 0;
  var data = RKSrs.load(key);
  var now = Date.now();
  var n = 0;
  Object.keys(data).forEach(function(k){ if(data[k] && data[k].due <= now) n++; });
  return n;
}
function renderMission(){
  var l = L();
  document.getElementById('missionTitle').textContent = l.missionTitle;

  var vocab = dueCount('RK_FC_SRS');
  var hanja = dueCount('RK_HJ_SRS');
  var ex = dueCount('RK_EX_SRS');
  var items = [
    { count: vocab, label: l.vocabItem(vocab) },
    { count: hanja, label: l.hanjaItem(hanja) },
    { count: ex, label: l.exItem(ex) }
  ];

  document.getElementById('missionList').innerHTML = items.map(function(it){
    var done = it.count === 0;
    return '<div class="dash-mission-item' + (done ? ' done' : '') + '">' +
      '<span class="dash-mission-check">' + (done ? '☑' : '☐') + '</span>' +
      '<span>' + it.label + '</span>' +
    '</div>';
  }).join('') || '<div class="dash-mission-item done"><span class="dash-mission-check">✨</span><span>' + l.allCaughtUp + '</span></div>';

  var quest = window.RKGamification ? RKGamification.getQuestData() : {done:0};
  var goal = window.RKGamification ? RKGamification.DAILY_GOAL : 10;
  var pct = Math.min(100, Math.round((quest.done || 0) / goal * 100));
  document.getElementById('missionBar').style.width = pct + '%';
  document.getElementById('missionCta').textContent = quest.completedToday ? l.missionDoneCta : l.missionCta;
}

/* ── WORD OF THE DAY (real phrases.json data — ko/romanization/ro/en, nothing invented) ── */
var _phrasePool = null;
function saveKey(){ return 'RK_SAVED_PHRASES'; }
function renderWordOfDay(){
  var l = L();
  if(!_phrasePool){
    fetch('./data/phrases.json').then(function(r){ return r.json(); }).then(function(data){
      var pool = [];
      (data.situations || []).forEach(function(sit){
        (sit.items || []).forEach(function(item){
          pool.push(Object.assign({ _situation: sit }, item));
        });
      });
      _phrasePool = pool;
      renderWordOfDay();
    });
    return;
  }
  if(!_phrasePool.length) return;
  var epochDay = Math.floor(Date.now() / 86400000);
  var phrase = _phrasePool[epochDay % _phrasePool.length];

  document.getElementById('wodTag').textContent = (phrase._situation.icon || '') + ' ' + (phrase._situation[LANG] || phrase._situation.ro || '');
  document.getElementById('wodKo').textContent = phrase.ko;
  document.getElementById('wodRom').textContent = phrase.rom || '';
  document.getElementById('wodMeaning').textContent = phrase[LANG] || phrase.ro;

  var playBtn = document.getElementById('wodPlayBtn');
  playBtn.textContent = l.play;
  playBtn.onclick = function(){ if(window.AudioEngine) AudioEngine.speak(phrase.ko); };

  var saved = JSON.parse(localStorage.getItem(saveKey()) || '[]');
  var isSaved = saved.indexOf(phrase.ko) !== -1;
  var saveBtn = document.getElementById('wodSaveBtn');
  saveBtn.textContent = isSaved ? l.saved : l.save;
  saveBtn.classList.toggle('saved', isSaved);
  saveBtn.onclick = function(){
    var list = JSON.parse(localStorage.getItem(saveKey()) || '[]');
    var i = list.indexOf(phrase.ko);
    if(i === -1) list.push(phrase.ko); else list.splice(i, 1);
    localStorage.setItem(saveKey(), JSON.stringify(list));
    renderWordOfDay();
  };
}

/* ── PROGRESS PREVIEW (same real RK_STATS.byType data as profile.html) ── */
function skillPct(stats, types){
  var total = 0, correct = 0;
  types.forEach(function(t){
    var bt = stats.byType && stats.byType[t];
    if(bt){ total += bt.total; correct += bt.correct; }
  });
  return { total: total, correct: correct, pct: total ? Math.round(correct / total * 100) : 0 };
}
function renderProgress(){
  var l = L();
  var stats = window.RKStorage ? RKStorage.get('RK_STATS', { byType:{} }) : { byType:{} };
  var vocab = skillPct(stats, ['ko-ro','ro-ko']);
  var grammar = skillPct(stats, ['particle','particlePlus','conjug']);

  document.getElementById('progressBars').innerHTML = [
    { lbl: l.vocab, data: vocab },
    { lbl: l.grammar, data: grammar }
  ].map(function(s){
    return '<div class="dash-skill">' +
      '<div class="dash-skill-head"><span>' + s.lbl + '</span><span>' + (s.data.total ? s.data.pct + '%' : '—') + '</span></div>' +
      '<div class="dash-bar-bg"><div class="dash-bar" style="width:' + s.data.pct + '%"></div></div>' +
    '</div>';
  }).join('');
}

renderStats();
applyLang();
