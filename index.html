<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* First-ever visit (no onboarding flag, no existing progress) -> onboarding.
   Anyone with real history is treated as already onboarded, so returning
   users are never sent through this. Runs before anything paints. */
(function(){
  if(localStorage.getItem('RK_ONBOARDED')) return;
  var hasHistory = localStorage.getItem('RK_XP') || localStorage.getItem('RK_STREAK') || localStorage.getItem('RK_LESSON_DONE');
  if(hasHistory){ localStorage.setItem('RK_ONBOARDED','1'); }
  else { location.replace('onboarding.html'); }
})();
</script>
<title>Raluca Korean</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1c4a3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6d9bf; --card:#fffdf8; --text:#2a2118; --text-mid:#6b5d49; --text-low:#a89876;
  --border:#e3d6b8; --shadow:rgba(60,45,20,.08);
  --lavender:#1c4a3a; --lavender-soft:#e3ede8; --pink:#c99a3f; --pink-soft:#f6ecd7; --denim:#1c4a3a;
  --bar-bg:#ece0c8;
  --forest:#1c4a3a; --gold:#d9ae52;
}
body.dark-mode{
  --bg:#161310; --card:#211d17; --text:#f0e6d0; --text-mid:#b8a888; --text-low:#7a6d55;
  --border:rgba(255,255,255,.08); --shadow:rgba(0,0,0,.3);
  --lavender:#3d8a6a; --lavender-soft:rgba(61,138,106,.16); --pink:#d9ae52; --pink-soft:rgba(217,174,82,.14); --denim:#3d8a6a;
  --bar-bg:rgba(255,255,255,.08);
  --forest:#2f6b53; --gold:#d9ae52;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;transition:background .25s ease,color .25s ease;
}
.kr{font-family:'Noto Sans KR',sans-serif}
a{color:inherit}

.dash{max-width:560px;margin:0 auto;padding:0 16px 96px}

/* ── HERO (no colored band — cream page background shows through,
   matching the parchment+forest-green mockup) ── */
.dash-hero{padding:18px 0 0}
.dash-mascot{font-size:28px;line-height:1}

/* ── TOPBAR ───────────────────────────────────────────── */
.dash-topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dash-brand{font-size:15px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:6px;color:var(--text)}
.dash-topbar-actions{display:flex;align-items:center;gap:8px}
.dash-icon-btn{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--card);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--text-mid);
  text-decoration:none;
}
.dash-lang{display:flex;border:1px solid var(--border);border-radius:20px;overflow:hidden;background:var(--card)}
.dash-lang button{border:none;background:none;padding:7px 12px;font-size:11px;font-weight:800;color:var(--text-low);cursor:pointer;font-family:inherit}
.dash-lang button.active{background:var(--forest);color:#fff}

/* ── GREETING ─────────────────────────────────────────── */
.dash-greet{padding:18px 0 0}
.dash-greet-kr{font-size:26px;font-weight:900}
.dash-greet-sub{font-size:14px;color:var(--text-mid);margin-top:4px}
.dash-stats{display:flex;gap:10px;margin-top:14px}
.dash-stat{
  display:flex;align-items:center;gap:5px;border-radius:12px;padding:7px 12px;
  font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.08);
  background:var(--forest);color:#fff;
}
.dash-flame{display:inline-block;transform-origin:50% 85%}
.dash-flame.lit{animation:dashFlameFlicker 1.6s ease-in-out infinite}
@keyframes dashFlameFlicker{
  0%,100%{transform:scale(1) rotate(0deg);filter:brightness(1) drop-shadow(0 0 0 rgba(249,115,22,0))}
  25%{transform:scale(1.08) rotate(-3deg);filter:brightness(1.15) drop-shadow(0 0 4px rgba(249,115,22,.5))}
  50%{transform:scale(0.97) rotate(2deg);filter:brightness(1.05) drop-shadow(0 0 2px rgba(249,115,22,.35))}
  75%{transform:scale(1.05) rotate(-1deg);filter:brightness(1.2) drop-shadow(0 0 5px rgba(249,115,22,.55))}
}
@media (prefers-reduced-motion: reduce){
  .dash-flame.lit{animation:none}
}

/* ── CARDS ────────────────────────────────────────────── */
.dash-card{
  display:block;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:20px;margin-top:16px;box-shadow:0 4px 18px var(--shadow);
}
.dash-card-eyebrow{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--lavender)}
.dash-card-eyebrow-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dash-rom-toggle{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--text-low);cursor:pointer;text-transform:none;letter-spacing:0}
.dash-rom-toggle input{accent-color:var(--lavender);width:28px;height:16px;cursor:pointer}
.dash-bar-bg{height:8px;background:var(--bar-bg);border-radius:5px;overflow:hidden;margin-top:12px}
.dash-bar{height:100%;border-radius:5px;background:var(--gold);transition:width .8s cubic-bezier(.4,0,.2,1)}

/* ── HERO ACTION CARDS (Continue / Focus / Mission — dark green + gold,
   the other cards stay cream) ── */
#continueCard,#focusCard,#missionCard{background:var(--forest);color:#fff;border-color:transparent}
#continueCard .dash-card-eyebrow,#focusCard .dash-card-eyebrow,#missionCard .dash-card-eyebrow{color:var(--gold)}
#continueCard .dash-continue-sub,#focusCard .dash-continue-sub{color:rgba(255,255,255,.75)}
#continueCard .dash-cta,#focusCard .dash-cta{color:var(--gold)}
#continueCard .dash-bar-bg,#missionCard .dash-bar-bg{background:rgba(255,255,255,.2)}
#missionCard .dash-mission-item{color:#fff}
#missionCard .dash-mission-item:hover{background:rgba(255,255,255,.1)}
#missionCard .dash-mission-item.done{color:rgba(255,255,255,.55)}
#missionCard .dash-cta-link{color:var(--gold)}

/* ── CONTINUE LEARNING ────────────────────────────────── */
.dash-continue-title{font-size:19px;font-weight:900;margin-top:8px}
.dash-continue-sub{font-size:13px;color:var(--text-mid);margin-top:3px}
.dash-cta{display:flex;align-items:center;gap:6px;margin-top:14px;font-size:13px;font-weight:800;color:var(--lavender)}

/* ── DAILY MISSION ────────────────────────────────────── */
.dash-mission-list{margin-top:10px;display:flex;flex-direction:column;gap:2px}
.dash-mission-item{
  display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text);
  text-decoration:none;padding:7px 4px;border-radius:10px;margin:0 -4px;transition:background .15s;
}
.dash-mission-item:hover{background:var(--lavender-soft)}
.dash-mission-item.done{color:var(--text-low);text-decoration:line-through}
.dash-mission-check{font-size:15px;flex-shrink:0}
.dash-cta-link{display:inline-block;margin-top:14px;font-size:13px;font-weight:800;color:var(--lavender);text-decoration:none}

/* ── QUICK PRACTICE ───────────────────────────────────── */
.dash-section-title{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-low);margin:24px 4px 10px}
.dash-quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dash-quick-item{
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;text-decoration:none;color:var(--text);
  background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 2px 10px var(--shadow);
}
.dash-quick-icon{font-size:20px}
.dash-quick-lbl{font-size:11px;font-weight:700;text-align:center}

/* ── QUICK FLASHCARD (flip teaser, links out to flashcards.html) ── */
.dash-flip-card{perspective:1000px;cursor:pointer}
.dash-flip-inner{
  position:relative;min-height:130px;transition:transform .5s cubic-bezier(.4,.2,.2,1);
  transform-style:preserve-3d;
}
.dash-flip-inner.flipped{transform:rotateY(180deg)}
.dash-flip-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:0 4px 18px var(--shadow);
  padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;
}
.dash-flip-back{transform:rotateY(180deg)}
.dash-flip-kr{font-family:'Noto Sans KR',sans-serif;font-size:26px;font-weight:900}
.dash-flip-hint{font-size:11px;color:var(--text-low);font-weight:700}
.dash-flip-rom{font-size:13px;color:var(--text-low);font-style:italic}
.dash-flip-meaning{font-size:16px;font-weight:800;color:var(--text)}
.dash-flip-next{
  display:block;margin:10px auto 0;background:none;border:none;color:var(--lavender);
  font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;padding:6px;
}
@media (prefers-reduced-motion: reduce){
  .dash-flip-inner{transition:none}
}

/* ── WORD OF THE DAY ──────────────────────────────────── */
.dash-wod-tag{font-size:11px;color:var(--text-low);font-weight:700;margin-top:2px}
.dash-wod-ko{font-family:'Noto Sans KR',sans-serif;font-size:24px;font-weight:900;margin-top:10px}
.dash-wod-rom{font-size:12px;color:var(--text-low);margin-top:2px;font-style:italic}
.dash-wod-meaning{font-size:14px;color:var(--text-mid);margin-top:8px}
.dash-wod-actions{display:flex;gap:10px;margin-top:14px}
.dash-wod-btn{
  border:1px solid var(--border);background:var(--lavender-soft);color:var(--lavender);border-radius:12px;
  padding:8px 14px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;
}
.dash-wod-btn.saved{background:var(--pink-soft);color:var(--pink)}

/* ── PROGRESS PREVIEW ─────────────────────────────────── */
.dash-skill{margin-top:12px}
.dash-skill:first-of-type{margin-top:14px}
.dash-skill-head{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:5px}
.dash-skill-head span:last-child{color:var(--text-low);font-weight:600}

/* ── EXPLORE LINK ─────────────────────────────────────── */
.dash-explore{
  display:flex;align-items:center;justify-content:center;gap:6px;margin-top:20px;padding:12px;
  font-size:12px;font-weight:700;color:var(--text-mid);text-decoration:none;
  border:1px dashed var(--border);border-radius:14px;
}

/* ── BOTTOM NAV ───────────────────────────────────────── */

@media(max-width:380px){
  .dash-quick-lbl{font-size:10px}
}
</style>
</head>

<script>
'use strict';

var LANG = localStorage.getItem('RK_LANG') || 'ro';
var AUDIENCE = localStorage.getItem('RK_AUDIENCE') || 'adult';
if(AUDIENCE === 'student') document.body.classList.add('audience-student');
RKNav.init('home');

var UI = {
  ro:{
    greetSub: AUDIENCE === 'student' ? 'Gata de o nouă provocare? 🎒' : 'Gata pentru coreeana de azi?',
    continueEyebrow:'CONTINUĂ ÎNVĂȚAREA', continueCta:'CONTINUĂ →',
    startTitle:'ÎNCEPE CĂLĂTORIA TA COREEANĂ', startSub:'Prima ta lecție te așteaptă.', startCta:'START →',
    levelDoneTitle:'Nivel complet! 🎉', levelDoneSub:'Ai parcurs toate lecțiile de la acest nivel.',
    missionTitle: AUDIENCE === 'student' ? "MISIUNEA ZILEI" : "MISIUNEA DE AZI",
    missionCta:'Vezi progresul complet →', missionDoneCta:'Misiune completă azi! ✨',
    missionVocab:function(n,goal){ return n + '/' + goal + (AUDIENCE==='student' ? ' cuvinte noi' : ' cuvinte de recapitulat'); },
    missionSentences:function(n,goal){ return n + '/' + goal + ' propoziții'; },
    missionGrammar:function(n,goal){ return n + '/' + goal + ' exerciții de gramatică'; },
    missionHangul:'1 provocare Hangul',
    missionListening:'2 minute de ascultare',
    missionListeningGame:'1 joc de ascultare',
    missionSpeaking:'1 exercițiu de vorbire',
    missionCompleteTitle:'MISIUNE COMPLETĂ!',
    missionCompleteSub:function(xp){ return 'Ai câștigat +' + xp + ' XP · Streak-ul continuă! 🔥'; },
    missionCompleteTap:'Atinge oriunde pentru a continua',
    focusEyebrow:'FOCUS AZI', focusCta:'Începe →',
    focusReview:'Ai multe de recapitulat — hai să le prindem din urmă.',
    focusMap:{
      speaking:{icon:'🗣️', href:'reading.html', title:'Practică vorbirea'},
      vocabulary:{icon:'📖', href:'flashcards.html', title:'Recapitulează vocabularul'},
      grammar:{icon:'🧠', href:'lessons.html', title:'Exersează gramatica'},
      listening:{icon:'🎧', href:'listening.html', title:'Exersează ascultarea'},
      reading:{icon:'📗', href:'reading.html', title:'Citește un text'},
      writing:{icon:'✍️', href:'builder.html', title:'Construiește o propoziție'}
    },
    quickTitle:'PRACTICĂ RAPIDĂ',
    quick:[
      {icon:'🧠', lbl:'REVIEW', href:'review.html'},
      {icon:'🎧', lbl:'LISTEN', href:'listening.html'},
      {icon:'🗣️', lbl:'SPEAK', href:'reading.html'},
      {icon:'✍️', lbl:'WRITE', href:'builder.html'},
      {icon:'가', lbl:'HANGUL', href:'hangul.html'},
      {icon:'漢', lbl:'HANJA', href:'hanja-book.html'}
    ],
    play:'🔊 Ascultă', save:'☆ Salvează', saved:'★ Salvat',
    progressTitle:'CUNOȘTINȚELE TALE', progressLink:'Progres complet →',
    vocab:'Vocabular', grammar:'Gramatică', sentences:'Propoziții', listening:'Ascultare',
    exploreLink:'🧭 Vezi toate funcțiile',
    flipHint:'Atinge pentru traducere', flipNext:'Cardul următor →',
    romLbl:'Rom'
  },
  en:{

    continueEyebrow:'CONTINUE LEARNING', continueCta:'CONTINUE →',
    startTitle:'START YOUR KOREAN JOURNEY', startSub:'Your first lesson is waiting.', startCta:'START →',
    levelDoneTitle:'Level complete! 🎉', levelDoneSub:"You've covered every lesson at this level.",
    missionTitle: AUDIENCE === 'student' ? "TODAY'S CHALLENGE" : "TODAY'S MISSION",
    missionCta:'See full progress →', missionDoneCta:'Daily mission complete! ✨',
    missionVocab:function(n,goal){ return n + '/' + goal + (AUDIENCE==='student' ? ' new words' : ' words to review'); },
    missionSentences:function(n,goal){ return n + '/' + goal + ' sentences'; },
    missionGrammar:function(n,goal){ return n + '/' + goal + ' grammar exercises'; },

    missionListening:'2 minutes of listening',
    missionListeningGame:'1 listening game',
    missionSpeaking:'1 speaking exercise',
    missionCompleteTitle:'MISSION COMPLETE!',
    missionCompleteSub:function(xp){ return 'You earned +' + xp + ' XP · Streak continued! 🔥'; },
    missionCompleteTap:'Tap anywhere to continue',
    focusEyebrow:'FOCUS TODAY', focusCta:'Start →',
    focusReview:"You've got a lot to review — let's catch up.",
    focusMap:{

      {icon:'漢', lbl:'HANJA', href:'hanja-book.html'}
    ],
    play:'🔊 Listen', save:'☆ Save', saved:'★ Saved',
    progressTitle:'YOUR KOREAN', progressLink:'Full progress →',
    vocab:'Vocabulary', grammar:'Grammar', sentences:'Sentences', listening:'Listening',
    exploreLink:'🧭 See every feature',
    flipHint:'Tap to reveal', flipNext:'Next card →',
    romLbl:'Rom'
  }
};
function L(){ return UI[LANG]; }

/* ── LANG + DARK MODE (self-contained, no dependency on lang-picker.js's DOM shape) ── */
function applyLang(){
  var l = L();
  document.getElementById('btnRo').classList.toggle('active', LANG === 'ro');
  document.getElementById('btnEn').classList.toggle('active', LANG === 'en');
  document.getElementById('greetSub').textContent = l.greetSub;
  document.getElementById('missionCta').textContent = l.missionCta;
  document.getElementById('quickTitle').textContent = l.quickTitle;
  document.getElementById('progressTitle').textContent = l.progressTitle;
  document.getElementById('progressLink').textContent = l.progressLink;
  document.getElementById('exploreLink').textContent = l.exploreLink;
  RKNav.setLang(LANG);
  renderQuick();
  renderContinue();
  renderFocus();
  renderMission();
  renderWordOfDay();
  renderFlipCard();
  applyRomVisibility();
  renderProgress();
}
document.getElementById('btnRo').addEventListener('click', function(){ LANG = 'ro'; localStorage.setItem('RK_LANG','ro'); applyLang(); });
document.getElementById('btnEn').addEventListener('click', function(){ LANG = 'en'; localStorage.setItem('RK_LANG','en'); applyLang(); });

/* ── CONTINUE LEARNING (real lesson data + real RK_LESSON_DONE progress) ── */
var _lessons = null;
function renderContinue(){
  var l = L();
  if(!_lessons){
    fetch('./data/lessons.json').then(function(r){ return r.json(); }).then(function(data){
      _lessons = data;
      renderContinue();
    });
    return;
  }
  var doneLessons = JSON.parse(localStorage.getItem('RK_LESSON_DONE') || '[]');
  var goal = null;
  try { goal = JSON.parse(localStorage.getItem('RK_TOPIK_GOAL') || 'null'); } catch(e){}
  var level = (goal && goal.level) || 1;

  var lessonsInLevel = _lessons.filter(function(ls){ return ls.topik === level; });
  var lessonsDone = lessonsInLevel.filter(function(ls){ return doneLessons.indexOf(ls.id) !== -1; });
  var nextLesson = lessonsInLevel.filter(function(ls){ return doneLessons.indexOf(ls.id) === -1; })[0];

  var card = document.getElementById('continueCard');
  var eyebrow = document.getElementById('continueEyebrow');
  var title = document.getElementById('continueTitle');
  var sub = document.getElementById('continueSub');
  var bar = document.getElementById('continueBar');
  var barWrap = document.getElementById('continueBarWrap');
  var cta = document.getElementById('continueCta');

  if(doneLessons.length === 0){
    eyebrow.textContent = '';
    title.textContent = l.startTitle;
    sub.textContent = l.startSub;
    barWrap.style.display = 'none';
    cta.textContent = l.startCta;
    card.href = 'lessons.html';
  } else if(!nextLesson){
    eyebrow.textContent = l.continueEyebrow;
    title.textContent = l.levelDoneTitle;
    sub.textContent = l.levelDoneSub;
    barWrap.style.display = '';
    bar.style.width = '100%';
    cta.textContent = l.continueCta;
    card.href = 'map.html';
  } else {
    eyebrow.textContent = l.continueEyebrow;
    title.textContent = nextLesson.title ? (nextLesson.title[LANG] || nextLesson.title.ro) : nextLesson.id;
    sub.textContent = 'TOPIK ' + level + ' · ' + nextLesson.id;
    barWrap.style.display = '';
    var pct = lessonsInLevel.length ? Math.round(lessonsDone.length / lessonsInLevel.length * 100) : 0;
    bar.style.width = pct + '%';
    cta.textContent = l.continueCta;
    card.href = 'lessons.html?level=' + level;
  }
}

/* ── DAILY MISSION ─────────────────────────────────────────
   The literal 4-task daily ritual: 5 vocab, 3 sentences, one
   listening session, one speaking exercise. Vocab/sentences come
   from real correct answers tracked in RK_DAILY_TASKS (see
   gamification.js); listening/speaking reuse the daily-challenge
   flags listening.js and pronunciation.js already set — nothing
   here is a fabricated stat. */
function dueCount(key){
  if(!window.RKSrs) return 0;
  var data = RKSrs.load(key);
  var now = Date.now();
  var n = 0;
  Object.keys(data).forEach(function(k){ if(data[k] && data[k].due <= now) n++; });
  return n;
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function isDailyFlagDone(key){
  try {
    var d = JSON.parse(localStorage.getItem(key) || 'null');
    return !!(d && d.date === todayStr() && d.done);
  } catch(e){ return false; }
}
function renderMission(){
  var l = L();
  document.getElementById('missionTitle').textContent = l.missionTitle;

  var goals = window.RKGamification ? RKGamification.getDailyTaskGoals() : {vocab:10, sentences:3, grammar:3};
  var tasks = window.RKGamification ? RKGamification.getDailyTasks() : {vocab:0, sentences:0, grammar:0};
  var vocabDone = tasks.vocab >= goals.vocab;
  var sentDone = tasks.sentences >= goals.sentences;
  var listenDone = isDailyFlagDone('RK_DAILY_LISTEN');

  var items;
  if(AUDIENCE === 'student'){
    var hangulDone = isDailyFlagDone('RK_DAILY_HANGUL');
    items = [
      { done: vocabDone, label: l.missionVocab(Math.min(tasks.vocab,goals.vocab), goals.vocab), href: 'exercises.html?type=ko-ro' },
      { done: hangulDone, label: l.missionHangul, href: 'hangul.html' },
      { done: sentDone, label: l.missionSentences(Math.min(tasks.sentences,goals.sentences), goals.sentences), href: 'exercises.html?type=puzzle' },
      { done: listenDone, label: l.missionListeningGame, href: 'listening.html' }
    ];
  } else {
    var grammarDone = tasks.grammar >= goals.grammar;
    var speakDone = isDailyFlagDone('RK_DAILY_PRON');
    items = [
      { done: vocabDone, label: l.missionVocab(Math.min(tasks.vocab,goals.vocab), goals.vocab), href: 'exercises.html?type=ko-ro' },
      { done: grammarDone, label: l.missionGrammar(Math.min(tasks.grammar,goals.grammar), goals.grammar), href: 'exercises.html?type=particle' },
      { done: sentDone, label: l.missionSentences(Math.min(tasks.sentences,goals.sentences), goals.sentences), href: 'exercises.html?type=puzzle' },
      { done: listenDone, label: l.missionListening, href: 'listening.html' },
      { done: speakDone, label: l.missionSpeaking, href: 'reading.html' }
    ];
  }

  document.getElementById('missionList').innerHTML = items.map(function(it){
    return '<a class="dash-mission-item' + (it.done ? ' done' : '') + '" href="' + it.href + '">' +
      '<span class="dash-mission-check">' + (it.done ? '☑' : '☐') + '</span>' +
      '<span>' + it.label + '</span>' +
    '</a>';
  }).join('');

  var doneCount = items.filter(function(it){ return it.done; }).length;
  var pct = Math.round(doneCount / items.length * 100);
  document.getElementById('missionBar').style.width = pct + '%';

  var allDone = doneCount === items.length;
  var ctaEl = document.getElementById('missionCta');
  ctaEl.textContent = allDone ? l.missionDoneCta : l.missionCta;
  ctaEl.href = allDone ? 'profile.html' : (items.filter(function(it){ return !it.done; })[0] || {}).href || 'today.html';

  if(allDone) maybeAwardMissionComplete(l);
}

var MISSION_XP_BONUS = 50;
function maybeAwardMissionComplete(l){
  if(!window.RKGamification) return;
  var flagKey = 'RK_DAILY_MISSION_AWARDED';
  var rec = null;
  try { rec = JSON.parse(localStorage.getItem(flagKey) || 'null'); } catch(e){}
  if(rec && rec.date === todayStr()) return;
  localStorage.setItem(flagKey, JSON.stringify({date: todayStr()}));
  RKGamification.addXPBonus(MISSION_XP_BONUS);
  if(window.RKStreak) RKStreak.touch();
  showMissionCompleteOverlay(l);
}

function showMissionCompleteOverlay(l){
  var backdrop = document.createElement('div');
  backdrop.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(18,19,28,.55);' +
    'backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;cursor:pointer;' +
    'animation:dashFadeIn .25s ease both';
  var card = document.createElement('div');
  card.style.cssText = 'background:var(--card);border-radius:24px;padding:36px 32px;text-align:center;' +
    'max-width:320px;width:88vw;box-shadow:0 20px 60px rgba(0,0,0,.25);' +
    'animation:dashPop .4s cubic-bezier(.34,1.56,.64,1) both';
  card.innerHTML =
    '<div style="font-size:48px;line-height:1">🎉</div>' +
    '<div style="font-size:20px;font-weight:900;margin-top:12px;color:var(--text);letter-spacing:.02em">' + l.missionCompleteTitle + '</div>' +
    '<div style="font-size:14px;color:var(--text-mid);margin-top:8px">' + l.missionCompleteSub(MISSION_XP_BONUS) + '</div>' +
    '<div style="font-size:11px;color:var(--text-low);margin-top:16px">' + l.missionCompleteTap + '</div>';
  if(!document.getElementById('dashMissionKeyframes')){
    var style = document.createElement('style');
    style.id = 'dashMissionKeyframes';
    style.textContent =
      '@keyframes dashFadeIn{from{opacity:0}to{opacity:1}}' +
      '@keyframes dashPop{0%{opacity:0;transform:scale(.85)}100%{opacity:1;transform:scale(1)}}' +
      '@keyframes dashConfettiFall{' +
        '0%{transform:translateY(0) rotate(0deg);opacity:1}' +
        '100%{transform:translateY(var(--fall)) rotate(var(--spin));opacity:0}' +
      '}';
    document.head.appendChild(style);
  }
  backdrop.appendChild(card);
  fireConfetti(backdrop);
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', function(){ backdrop.remove(); });
  setTimeout(function(){ if(backdrop.parentNode) backdrop.remove(); }, 4500);
}

function fireConfetti(container){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var colors = ['#c9922e','#1c4a3a','#f59e0b','#22c55e','#3b82f6'];
  for(var i = 0; i < 36; i++){
    var piece = document.createElement('div');
    var color = colors[i % colors.length];
    var left = Math.random() * 100;
    var fall = 60 + Math.random() * 30;
    var spin = (Math.random() > 0.5 ? 1 : -1) * (180 + Math.random() * 360);
    var duration = 1.6 + Math.random() * 1.2;
    var delay = Math.random() * 0.3;
    piece.style.cssText =
      'position:absolute;top:-10px;left:' + left + '%;width:8px;height:8px;background:' + color + ';' +
      (i % 3 === 0 ? 'border-radius:50%;' : '') +
      '--fall:' + fall + 'vh;--spin:' + spin + 'deg;' +
      'animation:dashConfettiFall ' + duration + 's ease-in ' + delay + 's both';
    container.appendChild(piece);
  }
}

/* ── PERSONALIZED "FOCUS TODAY" (section 23) ──────────────────
   Priority: real urgent review load > the user's own onboarding pick.
   Shows nothing if neither signal exists -- no fabricated personalization. */
function countHardExercises(){
  if(!window.RKStorage) return 0;
  var srs = RKStorage.get('RK_EX_SRS', {});
  var n = 0;
  Object.keys(srs).forEach(function(key){
    var c = srs[key];
    if(c && c.n >= 1 && c.EF < 2.2) n++;
  });
  return n;
}
function renderFocus(){
  var l = L();
  var card = document.getElementById('focusCard');
  var reviewTotal = dueCount('RK_FC_SRS') + dueCount('RK_HJ_SRS') + countHardExercises();

  if(reviewTotal >= 8){
    card.style.display = '';
    document.getElementById('focusEyebrow').textContent = '🧠 ' + l.focusEyebrow;
    document.getElementById('focusTitle').textContent = l.focusReview;
    document.getElementById('focusCta').textContent = l.focusCta;
    card.href = 'review.html';
    return;
  }

  var picks = [];
  try { picks = JSON.parse(localStorage.getItem('RK_ONBOARD_FOCUS') || '[]'); } catch(e){}
  if(picks.length){
    var epochDay = Math.floor(Date.now() / 86400000);
    var choice = l.focusMap[picks[epochDay % picks.length]];
    if(choice){
      card.style.display = '';
      document.getElementById('focusEyebrow').textContent = choice.icon + ' ' + l.focusEyebrow;
      document.getElementById('focusTitle').textContent = choice.title;
      document.getElementById('focusCta').textContent = l.focusCta;
      card.href = choice.href;
      return;
    }
  }

  card.style.display = 'none';
}

/* ── WORD OF THE DAY (real phrases.json data — ko/romanization/ro/en, nothing invented) ──
   _phrasePool is shared with the Quick Flashcard widget below; loadPhrasePool()
   fetches it exactly once so both stay in sync instead of racing. */
var _phrasePool = null;
var _phrasePoolPromise = null;
function loadPhrasePool(cb){
  if(_phrasePool){ cb(); return; }
  if(!_phrasePoolPromise){
    _phrasePoolPromise = fetch('./data/phrases.json').then(function(r){ return r.json(); }).then(function(data){
      var pool = [];
      (data.situations || []).forEach(function(sit){
        (sit.items || []).forEach(function(item){
          pool.push(Object.assign({ _situation: sit }, item));
        });
      });
      _phrasePool = pool;
    });
  }
  _phrasePoolPromise.then(cb);
}
function saveKey(){ return 'RK_SAVED_PHRASES'; }
function renderWordOfDay(){
  var l = L();
  if(!_phrasePool){ loadPhrasePool(renderWordOfDay); return; }
  if(!_phrasePool.length) return;
  var epochDay = Math.floor(Date.now() / 86400000);
  var phrase = _phrasePool[epochDay % _phrasePool.length];

  document.getElementById('wodTag').textContent = (phrase._situation.icon || '') + ' ' + (phrase._situation[LANG] || phrase._situation.ro || '');
  document.getElementById('wodKo').textContent = phrase.ko;
  document.getElementById('wodRom').textContent = phrase.rom || '';
  document.getElementById('wodMeaning').textContent = phrase[LANG] || phrase.ro;

  var playBtn = document.getElementById('wodPlayBtn');
  playBtn.textContent = l.play;
  playBtn.onclick = function(){ if(window.AudioEngine) AudioEngine.speak(phrase.ko); };

  var saved = JSON.parse(localStorage.getItem(saveKey()) || '[]');
  var isSaved = saved.indexOf(phrase.ko) !== -1;
  var saveBtn = document.getElementById('wodSaveBtn');
  saveBtn.textContent = isSaved ? l.saved : l.save;
  saveBtn.classList.toggle('saved', isSaved);
  saveBtn.onclick = function(){
    var list = JSON.parse(localStorage.getItem(saveKey()) || '[]');
    var i = list.indexOf(phrase.ko);
    if(i === -1) list.push(phrase.ko); else list.splice(i, 1);
    localStorage.setItem(saveKey(), JSON.stringify(list));
    renderWordOfDay();
  };
}

/* ── QUICK FLASHCARD (flip teaser — reuses the Word of the Day pool,
   picks a different random item so it doesn't just repeat that card) ── */
var _flipItem = null;
function renderFlipCard(){
  var l = L();
  document.getElementById('flipHint').textContent = l.flipHint;
  document.getElementById('flipNextBtn').textContent = l.flipNext;
  if(!_phrasePool){ loadPhrasePool(renderFlipCard); return; }
  if(!_phrasePool.length) return;
  if(!_flipItem) _flipItem = _phrasePool[Math.floor(Math.random() * _phrasePool.length)];
  document.getElementById('flipKo').textContent = _flipItem.ko;
  document.getElementById('flipRom').textContent = _flipItem.rom || '';
  document.getElementById('flipMeaning').textContent = _flipItem[LANG] || _flipItem.ro;
}
function nextFlipCard(){
  document.getElementById('flipInner').classList.remove('flipped');
  var pool = _phrasePool || [];
  if(pool.length > 1){
    var next;
    do { next = pool[Math.floor(Math.random() * pool.length)]; } while(next === _flipItem);
    _flipItem = next;
  }
  renderFlipCard();
}
function toggleFlipCard(){
  document.getElementById('flipInner').classList.toggle('flipped');
}

/* ── ROMANIZATION TOGGLE (shared by Word of Day / Flip Card) ── */
function getShowRom(){ return localStorage.getItem('RK_SHOW_ROM') !== '0'; }

  document.getElementById('romToggleLbl').textContent = L().romLbl;
  var show = getShowRom();
  ['wodRom','flipRom'].forEach(function(id){
    var el = document.getElementById(id);

  });

/* ── PROGRESS PREVIEW (same real RK_STATS.byType data as profile.html) ── */
function skillPct(stats, types){
  var total = 0, correct = 0;
  types.forEach(function(t){
    var bt = stats.byType && stats.byType[t];
    if(bt){ total += bt.total; correct += bt.correct; }
  });
  return { total: total, correct: correct, pct: total ? Math.round(correct / total * 100) : 0 };
}
function renderProgress(){
  var l = L();
  var stats = window.RKStorage ? RKStorage.get('RK_STATS', { byType:{} }) : { byType:{} };
  var vocab = skillPct(stats, ['ko-ro','ro-ko']);
  var grammar = skillPct(stats, ['particle','particlePlus','conjug']);

  document.getElementById('progressBars').innerHTML = [
    { lbl: l.vocab, data: vocab },
    { lbl: l.grammar, data: grammar }
  ].map(function(s){
    return '<div class="dash-skill">' +
      '<div class="dash-skill-head"><span>' + s.lbl + '</span><span>' + (s.data.total ? s.data.pct + '%' : '—') + '</span></div>' +
      '<div class="dash-bar-bg"><div class="dash-bar" style="width:' + s.data.pct + '%"></div></div>' +
    '</div>';
  }).join('');
}
