<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raluca Korean — Planificator TOPIK</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#db2777">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./theme-anime.css">
<style>
/* ── SETUP ────────────────────────────────────────────── */
.pl-level-row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}
.pl-level-btn{
  padding:12px 4px;border-radius:12px;text-align:center;cursor:pointer;
  background:var(--rk-bg-flat);border:2px solid var(--rk-stroke);
  font-weight:800;font-size:14px;color:var(--rk-heading);transition:all .15s;
}
.pl-level-btn:hover{border-color:rgba(219,39,119,.35)}
.pl-level-btn.on{background:linear-gradient(135deg,#db2777,#7c3aed);color:#fff;border-color:transparent}
.pl-field-lbl{font-size:12px;font-weight:700;color:var(--rk-muted);margin:16px 0 6px;letter-spacing:.02em}
.pl-date-input{
  width:100%;padding:12px 14px;border-radius:12px;font-size:15px;font-family:inherit;
  background:var(--rk-bg-flat);border:2px solid var(--rk-stroke);color:var(--rk-heading);
}
.pl-save-btn{
  display:block;width:100%;margin-top:18px;padding:13px;border-radius:14px;border:none;
  background:linear-gradient(135deg,#db2777,#7c3aed);color:#fff;font-weight:800;font-size:15px;
  cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(219,39,119,.28);
}
.pl-save-btn:disabled{opacity:.4;cursor:not-allowed}

/* ── COUNTDOWN ────────────────────────────────────────── */
.pl-countdown{text-align:center;padding:22px 16px 18px}
.pl-cd-num{font-size:44px;font-weight:900;color:var(--rk-heading);line-height:1}
.pl-cd-lbl{font-size:13px;color:var(--rk-muted);margin-top:6px;font-weight:600}
.pl-cd-date{font-size:12px;color:var(--rk-muted-ui);margin-top:4px}
.pl-edit-link{font-size:12px;color:var(--rk-violet);text-decoration:none;font-weight:700;display:inline-block;margin-top:10px}

/* ── PROGRESS ─────────────────────────────────────────── */
.pl-prog-row{margin-bottom:16px}
.pl-prog-row:last-child{margin-bottom:0}
.pl-prog-head{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;color:var(--rk-heading);margin-bottom:6px}
.pl-prog-count{font-size:12px;font-weight:700;color:var(--rk-muted)}
.pl-bar-bg{height:10px;background:rgba(0,0,0,.07);border-radius:6px;overflow:hidden}
.pl-bar{height:100%;border-radius:6px;background:linear-gradient(90deg,#db2777,#7c3aed);transition:width .8s cubic-bezier(.4,0,.2,1)}

/* ── PACE ─────────────────────────────────────────────── */
.pl-pace{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl-pace-tile{background:var(--rk-card);border:2px solid var(--rk-stroke);border-bottom:4px solid var(--rk-stroke-b);border-radius:14px;padding:16px 10px;text-align:center;box-shadow:0 4px 14px var(--rk-shadow)}
.pl-pace-num{font-size:26px;font-weight:900;color:var(--rk-pink)}
.pl-pace-lbl{font-size:11px;color:var(--rk-muted);margin-top:4px;font-weight:600}

/* ── DONE STATE ───────────────────────────────────────── */
.pl-done{text-align:center;padding:36px 20px}
.pl-done-icon{font-size:52px;line-height:1;margin-bottom:12px}
.pl-done-title{font-size:16px;font-weight:700;color:var(--rk-heading);margin-bottom:6px}
.pl-done-sub{font-size:13px;color:var(--rk-muted)}

/* ── DARK MODE ────────────────────────────────────────── */
body.dark-mode .pl-level-btn,body.dark-mode .pl-date-input{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12)}
body.dark-mode .pl-pace-tile{background:#1a0e2e;border-color:rgba(219,39,119,.22)}
body.dark-mode .pl-bar-bg{background:rgba(255,255,255,.09)}

@media(max-width:500px){
  .pl-cd-num{font-size:34px}
  .pl-pace-num{font-size:20px}
}
</style>
</head>
<body class="theme-anime">
<div class="app">

<div class="card">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
    <div>
      <h1 id="pageTitle">📅 Planificator TOPIK</h1>
      <div class="sub" id="pageSubtitle">Câte lecții și exerciții pe zi, ca să fii gata la timp</div>
    </div>
    <div id="pageControls"></div>
  </div>
</div>

<div id="mainContent"></div>

</div><!-- /app -->

<script src="./js/core/storage.js"></script>
<script src="./js/core/srs.js"></script>
<script src="./js/core/lang-picker.js"></script>
<script>
'use strict';

var LANG = RKLang.get();
var GOAL_KEY = 'RK_TOPIK_GOAL';

var UI = {
  ro:{
    title:'📅 Planificator TOPIK', sub:'Câte lecții și exerciții pe zi, ca să fii gata la timp',
    setupTitle:'Ce nivel TOPIK vizezi?', setupSub:'Alege nivelul examenului și data la care îl susții.',
    levelLbl:'Nivel TOPIK', dateLbl:'Data examenului', saveBtn:'Salvează planul',
    daysLbl:'zile până la examen', dayLbl:'zi până la examen',
    examToday:'Examenul e azi! 🎯', examPassed:'Data examenului a trecut — actualizează planul',
    lessons:'Lecții', exercises:'Exerciții',
    todayLbl:'Ca să termini la timp, azi ai de făcut:',
    newLessons:'lecții noi', newExercises:'exerciții',
    changeGoal:'✎ Schimbă planul',
    allDoneTitle:'Ai acoperit tot conținutul! 🎉',
    allDoneSub:'Toate lecțiile și exercițiile până la nivelul ales sunt parcurse cel puțin o dată. Continuă cu recapitulare din pagina Azi.',
    loadErr:'Nu s-au putut încărca datele.'
  },
  en:{
    title:'📅 TOPIK Planner', sub:"How many lessons and exercises a day, to be ready in time",
    setupTitle:'Which TOPIK level are you aiming for?', setupSub:'Pick your target level and exam date.',
    levelLbl:'TOPIK level', dateLbl:'Exam date', saveBtn:'Save plan',
    daysLbl:'days until the exam', dayLbl:'day until the exam',
    examToday:"It's exam day! 🎯", examPassed:'Exam date has passed — update your plan',
    lessons:'Lessons', exercises:'Exercises',
    todayLbl:'To finish in time, today you should do:',
    newLessons:'new lessons', newExercises:'exercises',
    changeGoal:'✎ Change plan',
    allDoneTitle:"You've covered everything! 🎉",
    allDoneSub:'Every lesson and exercise up to your chosen level has been attempted at least once. Keep reviewing from the Today page.',
    loadErr:'Could not load the data.'
  }
};
function L(){ return UI[LANG]; }

function getGoal(){
  try { return JSON.parse(localStorage.getItem(GOAL_KEY) || 'null'); }
  catch(e){ return null; }
}
function saveGoal(level, examDate){
  localStorage.setItem(GOAL_KEY, JSON.stringify({ level: level, examDate: examDate }));
}
function clearGoal(){ localStorage.removeItem(GOAL_KEY); }

// Same key format exercises.js uses for RK_EX_SRS, replicated so we can
// tell which exercise items already have a review record.
function exerciseKey(type, item){
  if(type === "ko-ro")      return "ko-ro||" + (item.q || "");
  if(type === "ro-ko")      return "ro-ko||" + (item.correct || "");
  if(type === "particle")   return "particle||" + (item.template || "") + "|" + (item.correct || "");
  if(type === "particlePlus") return "pp||" + (item.template || "") + "|" + (Array.isArray(item.correct) ? item.correct.join() : item.correct || "");
  if(type === "conjug")     return "conjug||" + (item.correct || "");
  if(type === "puzzle")     return "puzzle||" + (Array.isArray(item.correct) ? item.correct[0] : "");
  if(type === "chain")      return "chain||" + (Array.isArray(item.correct) ? item.correct[0] : "");
  return type + "||" + JSON.stringify(item.correct);
}

function renderSetup(){
  var l = L();
  var chosenLevel = 1;
  var html =
    '<div class="card">' +
      '<h2 style="margin:0 0 4px">' + l.setupTitle + '</h2>' +
      '<p class="sub" style="margin:0">' + l.setupSub + '</p>' +
      '<div class="pl-field-lbl">' + l.levelLbl + '</div>' +
      '<div class="pl-level-row" id="plLevels">' +
        [1,2,3,4,5,6].map(function(n){
          return '<div class="pl-level-btn' + (n===1?' on':'') + '" data-level="' + n + '">' + n + '</div>';
        }).join('') +
      '</div>' +
      '<div class="pl-field-lbl">' + l.dateLbl + '</div>' +
      '<input type="date" class="pl-date-input" id="plDate">' +
      '<button class="pl-save-btn" id="plSaveBtn" disabled>' + l.saveBtn + '</button>' +
    '</div>';
  document.getElementById('mainContent').innerHTML = html;

  document.querySelectorAll('.pl-level-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.pl-level-btn').forEach(function(b){ b.classList.remove('on'); });
      btn.classList.add('on');
      chosenLevel = parseInt(btn.dataset.level, 10);
    });
  });

  var dateInput = document.getElementById('plDate');
  var saveBtn = document.getElementById('plSaveBtn');
  var todayIso = new Date().toISOString().slice(0,10);
  dateInput.min = todayIso;
  dateInput.addEventListener('input', function(){
    saveBtn.disabled = !dateInput.value;
  });
  saveBtn.addEventListener('click', function(){
    if(!dateInput.value) return;
    saveGoal(chosenLevel, dateInput.value);
    render();
  });
}

function renderDashboard(goal){
  var l = L();
  Promise.all([
    fetch('./data/lessons.json').then(function(r){ return r.json(); }),
    fetch('./data/exercises.json').then(function(r){ return r.json(); })
  ]).then(function(results){
    var lessons = results[0], exJson = results[1];

    var lessonsInScope = lessons.filter(function(ls){ return ls.topik <= goal.level; });
    var doneLessons = JSON.parse(localStorage.getItem('RK_LESSON_DONE') || '[]');
    var lessonsDone = lessonsInScope.filter(function(ls){ return doneLessons.indexOf(ls.id) !== -1; }).length;

    var exSrs = window.RKSrs ? RKSrs.load('RK_EX_SRS') : {};
    var exTotal = 0, exDone = 0;
    Object.keys(exJson).forEach(function(type){
      exJson[type].forEach(function(item){
        if(item.topik > goal.level) return;
        exTotal++;
        if(exSrs[exerciseKey(type, item)]) exDone++;
      });
    });

    var now = new Date();
    var examDate = new Date(goal.examDate + 'T23:59:59');
    var msLeft = examDate - now;
    var daysLeft = Math.ceil(msLeft / 86400000);

    var lessonsLeft = Math.max(0, lessonsInScope.length - lessonsDone);
    var exLeft = Math.max(0, exTotal - exDone);
    var allDone = lessonsLeft === 0 && exLeft === 0;
    var effectiveDays = Math.max(1, daysLeft);
    var lessonsPerDay = Math.ceil(lessonsLeft / effectiveDays);
    var exPerDay = Math.ceil(exLeft / effectiveDays);

    var html = '';

    html += '<div class="card pl-countdown">';
    if(daysLeft > 1){
      html += '<div class="pl-cd-num">' + daysLeft + '</div><div class="pl-cd-lbl">' + l.daysLbl + '</div>';
    } else if(daysLeft === 1){
      html += '<div class="pl-cd-num">1</div><div class="pl-cd-lbl">' + l.dayLbl + '</div>';
    } else if(daysLeft === 0){
      html += '<div class="pl-cd-num">🎯</div><div class="pl-cd-lbl">' + l.examToday + '</div>';
    } else {
      html += '<div class="pl-cd-num">⏰</div><div class="pl-cd-lbl">' + l.examPassed + '</div>';
    }
    html += '<div class="pl-cd-date">TOPIK ' + goal.level + ' · ' + goal.examDate + '</div>';
    html += '<a href="#" class="pl-edit-link" id="plChangeGoal">' + l.changeGoal + '</a>';
    html += '</div>';

    if(allDone){
      html += '<div class="card pl-done">' +
        '<div class="pl-done-icon">🌿</div>' +
        '<div class="pl-done-title">' + l.allDoneTitle + '</div>' +
        '<div class="pl-done-sub">' + l.allDoneSub + '</div>' +
      '</div>';
    } else {
      var lessonsPct = lessonsInScope.length ? Math.round(lessonsDone / lessonsInScope.length * 100) : 100;
      var exPct = exTotal ? Math.round(exDone / exTotal * 100) : 100;

      html += '<div class="card">' +
        '<div class="pl-prog-row">' +
          '<div class="pl-prog-head"><span>' + l.lessons + '</span><span class="pl-prog-count">' + lessonsDone + '/' + lessonsInScope.length + '</span></div>' +
          '<div class="pl-bar-bg"><div class="pl-bar" style="width:' + lessonsPct + '%"></div></div>' +
        '</div>' +
        '<div class="pl-prog-row">' +
          '<div class="pl-prog-head"><span>' + l.exercises + '</span><span class="pl-prog-count">' + exDone + '/' + exTotal + '</span></div>' +
          '<div class="pl-bar-bg"><div class="pl-bar" style="width:' + exPct + '%"></div></div>' +
        '</div>' +
      '</div>';

      if(daysLeft >= 0){
        html += '<div class="card">' +
          '<div class="pl-field-lbl" style="margin-top:0">' + l.todayLbl + '</div>' +
          '<div class="pl-pace">' +
            '<div class="pl-pace-tile"><div class="pl-pace-num">' + lessonsPerDay + '</div><div class="pl-pace-lbl">' + l.newLessons + '</div></div>' +
            '<div class="pl-pace-tile"><div class="pl-pace-num">' + exPerDay + '</div><div class="pl-pace-lbl">' + l.newExercises + '</div></div>' +
          '</div>' +
        '</div>';
      }
    }

    document.getElementById('mainContent').innerHTML = html;
    document.getElementById('plChangeGoal').addEventListener('click', function(e){
      e.preventDefault();
      clearGoal();
      render();
    });
  }).catch(function(){
    document.getElementById('mainContent').innerHTML =
      '<div class="card"><div class="pl-done-sub">' + l.loadErr + '</div></div>';
  });
}

function render(){
  var l = L();
  document.getElementById('pageTitle').textContent = l.title;
  document.getElementById('pageSubtitle').textContent = l.sub;
  var goal = getGoal();
  if(goal) renderDashboard(goal); else renderSetup();
}

RKLang.init(function(lang){ LANG = lang; render(); });
render();
</script>
<script src="./js/core/dark-mode.js"></script>
<script src="./js/core/register-sw.js"></script>
</body>
</html>
