<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raluca Korean — Learn</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
<meta name="theme-color" content="#6C5CE7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F7; --card:#FFFFFF; --text:#202124; --text-mid:#6B6B73; --text-low:#9C9CA3;
  --border:#E7E5E1; --shadow:rgba(32,33,36,.07);
  --lavender:#6C5CE7; --lavender-soft:#EFEBFC; --pink:#E96A9A; --bar-bg:#EFEDE9;
  --forest:#6C5CE7; --gold:#F4C95D;
}
body.dark-mode{
  --bg:#101426; --card:#181D32; --text:#F7F4FA; --text-mid:#B8B9C5; --text-low:#7D7E93;
  --border:rgba(255,255,255,.08); --shadow:rgba(0,0,0,.35);
  --lavender:#8B7CFF; --lavender-soft:rgba(139,124,255,.16); --pink:#F17EAB; --bar-bg:rgba(255,255,255,.08);
  --forest:#8B7CFF; --gold:#F3CB69;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:96px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 0 6px}
.brand{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:800;text-decoration:none;color:var(--text)}
.rk-logo{width:20px;height:20px;flex-shrink:0}
.rk-logo .gate{stroke:#6C5CE7}
.rk-logo .ascent{stroke:#F4C95D}
body.dark-mode .rk-logo .gate{stroke:#8B7CFF}
body.dark-mode .rk-logo .ascent{stroke:#F3CB69}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--text-mid)}
.topbar-actions{display:flex;align-items:center;gap:8px}
.lang{display:flex;border:1px solid var(--border);border-radius:20px;overflow:hidden;background:var(--card)}
.lang button{border:none;background:none;padding:7px 12px;font-size:11px;font-weight:800;color:var(--text-low);cursor:pointer;font-family:inherit}
.lang button.active{background:var(--forest);color:#fff}

.title{font-size:22px;font-weight:900;margin-top:14px}
.sub{font-size:13px;color:var(--text-mid);margin-top:4px;margin-bottom:16px}

.grid{display:flex;flex-direction:column;gap:12px}
.item{
  display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:0 3px 14px var(--shadow);
}
.item-icon{font-size:26px;width:40px;text-align:center;flex-shrink:0}
.item-body{flex:1;min-width:0}
.item-title{font-size:15px;font-weight:800}
.item-desc{font-size:12px;color:var(--text-mid);margin-top:2px}
.item-bar-bg{height:5px;background:var(--bar-bg);border-radius:4px;overflow:hidden;margin-top:8px;max-width:160px}
.item-bar{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--lavender),var(--pink))}
.item-count{font-size:11px;color:var(--text-low);margin-top:6px;font-weight:700}
.item-arrow{font-size:16px;color:var(--text-low);flex-shrink:0}

</style>
</head>
<body class="theme-anime">

<div class="wrap">
  <div class="topbar">
    <a href="index.html" class="brand">←
      <svg class="rk-logo" viewBox="0 0 48 48" fill="none" aria-hidden="true" focusable="false">
        <path class="gate" d="M10 34V20c0-6 4-10 10-10h8c6 0 10 4 10 10v14" stroke-width="4.4" stroke-linecap="round"/>
        <path class="ascent" d="M15 34 24 20l9 14" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Raluca Korean</a>
    <div class="topbar-actions">
      <div class="lang">
        <button id="btnRo" type="button">RO</button>
        <button id="btnEn" type="button">EN</button>
      </div>
      <button class="icon-btn" id="darkToggle" type="button" aria-label="Toggle dark mode">🌙</button>
    </div>
  </div>

  <div class="title" id="pgTitle">Learn Korean</div>
  <div class="sub" id="pgSub">Everything you can study, in one place</div>

  <div class="grid" id="grid"></div>
</div>

<div id="rkBottomNav"></div>

<script src="./js/core/storage.js"></script>
<script src="./js/core/bottom-nav.js"></script>
<script>
'use strict';

var LANG = localStorage.getItem('RK_LANG') || 'ro';
RKNav.init('learn');
var AUDIENCE = localStorage.getItem('RK_AUDIENCE') || 'adult';
var UI = {
  ro:{
    title:'Învață coreeană',
    sub: AUDIENCE === 'student' ? 'Alege ce vrei să exersezi azi 🎒' : 'Tot ce poți studia, într-un singur loc',
    items:[
      {icon:'🧠', key:'grammar', title:'Gramatică', desc:'Structuri gramaticale pe niveluri TOPIK', href:'lessons.html'},
      {icon:'📖', key:null, title:'Vocabular', desc:'Glosar cu căutare și favorite', href:'glossary.html'},
      {icon:'🎴', key:'vocab', title:'Flashcards', desc:'Recapitulare cu repetiție spațiată', href:'flashcards.html'},
      {icon:'가', key:null, title:'Hangul', desc:'Alfabetul coreean', href:'hangul.html'},
      {icon:'漢', key:'hanja', title:'Hanja', desc:'Caractere chinezești folosite în coreeană', href:'hanja-book.html'},
      {icon:'🌌', key:null, title:'Word Universe', desc:'Constelații de cuvinte conectate', href:'word-map.html'},
      {icon:'🗺️', key:null, title:'Harta Cuvântului', desc:'Explorează relațiile dintre cuvinte', href:'word-context.html'},
      {icon:'💬', key:null, title:'Expresii', desc:'Fraze uzuale pe situații', href:'phrases.html'},
      {icon:'📓', key:null, title:'Caiet', desc:'Notele tale personale', href:'caiet.html'},
      {icon:'⚡', key:null, title:'Neural', desc:'Lecții adaptive', href:'lesson-neural.html'},
      {icon:'🙏', key:null, title:'Onorifice', desc:'Registrul politicos coreean', href:'exercises.html?type=drill-honor'}
    ]
  },
  en:{
    title:'Learn Korean',
    sub: AUDIENCE === 'student' ? 'Pick what to practice today 🎒' : 'Everything you can study, in one place',
    items:[
      {icon:'🧠', key:'grammar', title:'Grammar', desc:'Grammar structures across TOPIK levels', href:'lessons.html'},
      {icon:'📖', key:null, title:'Vocabulary', desc:'Searchable glossary with favorites', href:'glossary.html'},
      {icon:'🎴', key:'vocab', title:'Flashcards', desc:'Spaced-repetition review', href:'flashcards.html'},
      {icon:'가', key:null, title:'Hangul', desc:'The Korean alphabet', href:'hangul.html'},
      {icon:'漢', key:'hanja', title:'Hanja', desc:'Chinese characters used in Korean', href:'hanja-book.html'},
      {icon:'🌌', key:null, title:'Word Universe', desc:'Constellations of connected words', href:'word-map.html'},
      {icon:'🗺️', key:null, title:'Word Map', desc:'Explore relationships between words', href:'word-context.html'},
      {icon:'💬', key:null, title:'Phrases', desc:'Common expressions by situation', href:'phrases.html'},
      {icon:'📓', key:null, title:'Notebook', desc:'Your personal notes', href:'caiet.html'},
      {icon:'⚡', key:null, title:'Neural', desc:'Adaptive lessons', href:'lesson-neural.html'},
      {icon:'🙏', key:null, title:'Honorifics', desc:'Korean polite register', href:'exercises.html?type=drill-honor'}
    ]
  }
};
function L(){ return UI[LANG]; }

function dueOrTouchedCount(srsKey){
  if(!window.RKStorage) return 0;
  var data = RKStorage.get(srsKey, {});
  return Object.keys(data).length;
}

function render(){
  var l = L();
  document.getElementById('pgTitle').textContent = l.title;
  document.getElementById('pgSub').textContent = l.sub;
  RKNav.setLang(LANG);

  var doneLessons = JSON.parse(localStorage.getItem('RK_LESSON_DONE') || '[]');
  var vocabTouched = dueOrTouchedCount('RK_FC_SRS');
  var hanjaTouched = dueOrTouchedCount('RK_HJ_SRS');

  Promise.all([
    fetch('./data/lessons.json').then(function(r){ return r.json(); }).catch(function(){ return []; })
  ]).then(function(results){
    var lessons = results[0];
    var lessonsPct = lessons.length ? Math.round(doneLessons.length / lessons.length * 100) : 0;

    document.getElementById('grid').innerHTML = l.items.map(function(it){
      var extra = '';
      if(it.key === 'grammar'){
        extra = '<div class="item-bar-bg"><div class="item-bar" style="width:' + lessonsPct + '%"></div></div>' +
                '<div class="item-count">' + doneLessons.length + '/' + lessons.length + '</div>';
      } else if(it.key === 'vocab' && vocabTouched > 0){
        extra = '<div class="item-count">' + vocabTouched + ' ' + (LANG === 'ro' ? 'cuvinte în progres' : 'words in progress') + '</div>';
      } else if(it.key === 'hanja' && hanjaTouched > 0){
        extra = '<div class="item-count">' + hanjaTouched + ' ' + (LANG === 'ro' ? 'caractere în progres' : 'characters in progress') + '</div>';
      }
      return '<a class="item" href="' + it.href + '">' +
        '<span class="item-icon">' + it.icon + '</span>' +
        '<span class="item-body">' +
          '<span class="item-title">' + it.title + '</span>' +
          '<div class="item-desc">' + it.desc + '</div>' +
          extra +
        '</span>' +
        '<span class="item-arrow">→</span>' +
      '</a>';
    }).join('');
  });
}

document.getElementById('btnRo').addEventListener('click', function(){ LANG='ro'; localStorage.setItem('RK_LANG','ro'); document.getElementById('btnRo').classList.add('active'); document.getElementById('btnEn').classList.remove('active'); render(); });
document.getElementById('btnEn').addEventListener('click', function(){ LANG='en'; localStorage.setItem('RK_LANG','en'); document.getElementById('btnEn').classList.add('active'); document.getElementById('btnRo').classList.remove('active'); render(); });
document.getElementById('btn' + (LANG === 'en' ? 'En' : 'Ro')).classList.add('active');

(function initTheme(){
  var theme = localStorage.getItem('RK_THEME');
  var isDark = theme === 'dark' || theme === null;
  document.body.classList.toggle('dark-mode', isDark);
  document.getElementById('darkToggle').textContent = isDark ? '☀️' : '🌙';
})();
document.getElementById('darkToggle').addEventListener('click', function(){
  var nowDark = !document.body.classList.contains('dark-mode');
  document.body.classList.toggle('dark-mode', nowDark);
  localStorage.setItem('RK_THEME', nowDark ? 'dark' : 'light');
  document.getElementById('darkToggle').textContent = nowDark ? '☀️' : '🌙';
});

render();
</script>
<script src="./js/core/register-sw.js"></script>
</body>
</html>
