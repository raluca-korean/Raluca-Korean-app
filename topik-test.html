<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raluca Korean — Test TOPIK simulat</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#6C5CE7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">

<style>
/* Options and choice chips are <div role=button>, not <button>:
   theme-anime.css repaints every dark-mode <button> with !important. */
.tt-wrap{max-width:820px;margin:0 auto;padding:0 16px 80px}
.tt-phase{display:none}.tt-phase.active{display:block}
.tt-card{background:var(--rk-card,rgba(255,255,255,.06));border:1px solid var(--rk-stroke,rgba(255,255,255,.12));border-radius:18px;padding:18px;margin:14px 0}
.tt-card h2{margin:0 0 10px;font-size:16px}
.tt-muted{opacity:.7;font-size:13px;line-height:1.5}
.tt-choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tt-choice{cursor:pointer;border:2px solid var(--rk-stroke,rgba(255,255,255,.15));border-radius:14px;padding:12px 14px;transition:border-color .15s,background .15s}
.tt-choice b{display:block;font-size:15px;margin-bottom:3px}
.tt-choice span{font-size:12px;opacity:.75;line-height:1.4;display:block}
.tt-choice.sel{border-color:#6C5CE7;background:rgba(108,92,231,.16)}
.tt-table{width:100%;border-collapse:collapse;font-size:13px}
.tt-table td{padding:7px 4px;border-bottom:1px solid var(--rk-stroke,rgba(255,255,255,.1))}
.tt-table td:last-child{text-align:right;white-space:nowrap}
.tt-start{display:block;width:100%;margin-top:6px;padding:15px;border:none;border-radius:14px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;color:#fff;background:linear-gradient(135deg,#6C5CE7,#E96A9A)}
.tt-hist-row{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--rk-stroke,rgba(255,255,255,.08))}
.tt-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:20;padding:10px 0;backdrop-filter:blur(8px)}
.tt-sec{font-weight:900;font-size:14px}
.tt-sec small{display:block;font-weight:600;opacity:.7;font-size:11.5px}
.tt-timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:18px;padding:6px 12px;border-radius:12px;border:2px solid rgba(108,92,231,.5)}
.tt-timer.warn{border-color:#E96A9A;color:#E96A9A}
.tt-progress{height:5px;border-radius:9px;background:rgba(127,127,127,.2);overflow:hidden;margin-bottom:6px}
.tt-progress i{display:block;height:100%;background:linear-gradient(90deg,#6C5CE7,#E96A9A)}
.tt-qnum{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.75;margin-bottom:8px}
.tt-passage{font-family:'Noto Sans KR',sans-serif;font-size:17px;line-height:1.75;padding:14px 16px;border-radius:14px;background:rgba(108,92,231,.08);border-left:4px solid #6C5CE7;margin-bottom:12px}
.tt-passage mark{background:rgba(244,201,93,.35);color:inherit;border-radius:4px;padding:0 2px}
.tt-q{font-weight:800;font-size:16px;line-height:1.45;margin-bottom:10px}
.tt-play{display:inline-flex;align-items:center;gap:8px;cursor:pointer;padding:10px 16px;border-radius:999px;font-weight:800;border:2px solid #6C5CE7;margin-bottom:12px}
.tt-play.off{opacity:.4;cursor:not-allowed}
.tt-opt{cursor:pointer;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;margin-top:8px;border-radius:14px;border:2px solid var(--rk-stroke,rgba(255,255,255,.14));font-size:15px;line-height:1.45}
.tt-opt .n{flex:0 0 24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;border:2px solid currentColor;opacity:.7}
.tt-opt.sel{border-color:#6C5CE7;background:rgba(108,92,231,.16)}
.tt-opt.ko{font-family:'Noto Sans KR',sans-serif}
.tt-nav{display:flex;gap:10px;margin-top:16px}
.tt-nav > div{flex:1;text-align:center;cursor:pointer;padding:12px;border-radius:12px;font-weight:800;border:2px solid var(--rk-stroke,rgba(255,255,255,.15))}
.tt-nav > div.primary-ish{border-color:transparent;color:#fff;background:linear-gradient(135deg,#6C5CE7,#E96A9A)}
.tt-dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:16px}
.tt-dot{cursor:pointer;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:1.5px solid var(--rk-stroke,rgba(255,255,255,.15))}
.tt-dot.ans{background:rgba(108,92,231,.25);border-color:#6C5CE7}
.tt-dot.cur{outline:2px solid #E96A9A;outline-offset:1px}
.tt-write-prompt{font-size:15px;line-height:1.55;margin-bottom:8px}
.tt-wordbank{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.tt-wordbank span{font-family:'Noto Sans KR',sans-serif;font-size:13px;padding:4px 10px;border-radius:999px;background:rgba(108,92,231,.14)}
.tt-text{width:100%;min-height:240px;box-sizing:border-box;padding:14px;border-radius:14px;font-family:'Noto Sans KR',sans-serif;font-size:16px;line-height:1.7;border:2px solid var(--rk-stroke,rgba(255,255,255,.15));background:transparent;color:inherit;resize:vertical}
.tt-reqs{list-style:none;padding:0;margin:10px 0 0;font-size:13px}
.tt-reqs li{padding:3px 0}
.tt-count{font-size:12px;opacity:.7;text-align:right;margin-top:4px}
.tt-big{text-align:center;padding:10px 0}
.tt-big .score{font-size:46px;font-weight:900;line-height:1}
.tt-big .of{opacity:.6;font-size:14px}
.tt-level{display:inline-block;margin-top:12px;padding:8px 18px;border-radius:999px;font-weight:900;font-size:17px;color:#fff;background:linear-gradient(135deg,#6C5CE7,#E96A9A)}
.tt-level.none{background:rgba(127,127,127,.35)}
.tt-srow{display:grid;grid-template-columns:110px 1fr 64px;gap:10px;align-items:center;margin:9px 0;font-size:14px}
.tt-sbar{height:10px;border-radius:9px;background:rgba(127,127,127,.2);overflow:hidden}
.tt-sbar i{display:block;height:100%;background:linear-gradient(90deg,#6C5CE7,#E96A9A)}
.tt-review-item{padding:10px 0;border-bottom:1px solid var(--rk-stroke,rgba(255,255,255,.1));font-size:14px;line-height:1.5}
.tt-review-item .ko{font-family:'Noto Sans KR',sans-serif}
.tt-ok{color:#55A878;font-weight:800}.tt-bad{color:#E5534B;font-weight:800}
.tt-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.tt-actions > *{flex:1;min-width:140px;text-align:center;cursor:pointer;padding:13px;border-radius:12px;font-weight:800;text-decoration:none;color:inherit;border:2px solid var(--rk-stroke,rgba(255,255,255,.15))}
.tt-actions > .main{border-color:transparent;color:#fff;background:linear-gradient(135deg,#6C5CE7,#E96A9A)}
@media(max-width:560px){.tt-choices{grid-template-columns:1fr}.tt-srow{grid-template-columns:84px 1fr 54px}}
</style>
<link rel="stylesheet" href="./rk-buttons.css">
</head>
<body class="theme-anime exercise-page">

<div class="lmn-field" aria-hidden="true">
  <div class="lmn-orb lmn-orb-1"></div><div class="lmn-orb lmn-orb-2"></div>
  <div class="lmn-orb lmn-orb-3"></div><div class="lmn-orb lmn-orb-4"></div>
  <div class="lmn-orb lmn-orb-5"></div>
</div>

<div class="lmn-viewport">
  <header class="lmn-meridian">
    <div class="lmn-title-atom">
      <h1 id="pageTitle">Test TOPIK simulat</h1>
      <div class="sub" id="pageSubtitle">Structura și punctajul examenului real</div>
    </div>
    <div class="lmn-nav-atom"><div id="pageControls"></div></div>
  </header>

  <div class="tt-wrap">
    <!-- SETUP -->
    <div id="phSetup" class="tt-phase active">
      <div class="tt-card">
        <h2 id="lblExam"></h2>
        <div class="tt-choices" id="examChoices"></div>
      </div>
      <div class="tt-card">
        <h2 id="lblLen"></h2>
        <div class="tt-choices" id="lenChoices"></div>
      </div>
      <div class="tt-card">
        <h2 id="lblPlan"></h2>
        <table class="tt-table" id="planTable"></table>
        <p class="tt-muted" id="planNote"></p>
        <div role="button" tabindex="0" class="tt-start" id="startBtn"></div>
      </div>
      <div class="tt-card" id="histCard" hidden>
        <h2 id="lblHist"></h2>
        <div id="histList"></div>
      </div>
    </div>

    <!-- EXAM -->
    <div id="phExam" class="tt-phase">
      <div class="tt-bar">
        <div class="tt-sec" id="secName"></div>
        <div class="tt-timer" id="timer">00:00</div>
      </div>
      <div class="tt-progress"><i id="progFill" style="width:0%"></i></div>
      <div class="tt-card" id="qCard"></div>
      <div class="tt-dots" id="dots"></div>
    </div>

    <!-- RESULT -->
    <div id="phResult" class="tt-phase">
      <div class="tt-card" id="resCard"></div>
      <div class="tt-card" id="reviewCard"></div>
    </div>
  </div>
</div>

<script src="./js/core/storage.js"></script>
<script src="./js/core/gamification.js"></script>
<script src="./js/core/streak.js"></script>
<script src="./js/core/lang-picker.js"></script>
<script src="./js/core/audio.js"></script>
<script>
(function () {
  var LANG = RKLang.get();
  var HIST_KEY = 'RK_TOPIK_MOCK';

  // Real exam layout. Minutes and question counts follow the official TOPIK
  // (I: 듣기 30 + 읽기 40; II: 듣기 50 + 쓰기 + 읽기 50); "mini" keeps the
  // same order and scoring with fewer questions.
  var PLANS = {
    I:  { levels: [1, 2], max: 200,
          full: [{ id: 'listen', n: 30, min: 40 }, { id: 'read', n: 40, min: 60 }],
          mini: [{ id: 'listen', n: 10, min: 15 }, { id: 'read', n: 15, min: 25 }] },
    II: { levels: [3, 4, 5, 6], max: 300,
          full: [{ id: 'listen', n: 50, min: 60 }, { id: 'write', n: 1, min: 50 }, { id: 'read', n: 50, min: 70 }],
          mini: [{ id: 'listen', n: 15, min: 25 }, { id: 'write', n: 1, min: 25 }, { id: 'read', n: 15, min: 30 }] }
  };
  // Official pass marks (total score → level).
  function levelFor(exam, total) {
    if (exam === 'I') return total >= 140 ? 2 : total >= 80 ? 1 : 0;
    return total >= 230 ? 6 : total >= 190 ? 5 : total >= 150 ? 4 : total >= 120 ? 3 : 0;
  }

  var T = {
    ro: {
      title: 'Test TOPIK simulat', sub: 'Structura și punctajul examenului real',
      exam: 'Ce examen dai?', len: 'Durata',
      I: ['TOPIK I', 'Nivelurile 1–2 · ascultare + citire · 200 de puncte'],
      II: ['TOPIK II', 'Nivelurile 3–6 · ascultare + scriere + citire · 300 de puncte'],
      mini: ['Mini', 'Aceeași structură, mai puține întrebări — bun pentru exersat'],
      full: ['Complet', 'Numărul real de întrebări și timpul real'],
      plan: 'Structura testului', start: 'Începe testul ▶',
      note: 'Fiecare secțiune are cronometrul ei. Când timpul se termină, treci automat la secțiunea următoare. Fiecare secțiune valorează 100 de puncte; nivelul se calculează după pragurile oficiale.',
      sec: { listen: '듣기 · Ascultare', write: '쓰기 · Scriere', read: '읽기 · Citire' },
      qn: function (i, n) { return 'Întrebarea ' + i + ' din ' + n; },
      q: function (n) { return n === 1 ? '1 sarcină' : n + ' întrebări'; },
      min: function (m) { return m + ' min'; },
      play: function (left) { return '🔊 Ascultă (' + left + ' rămase)'; },
      noPlay: '🔇 Ai ascultat de 2 ori',
      prev: '← Înapoi', next: 'Următoarea →', endSec: 'Termină secțiunea ✓',
      confirmEnd: function (n) { return 'Mai ai ' + n + ' întrebări fără răspuns. Termini secțiunea?'; },
      meaning: 'Alegeți sensul corect al propoziției.',
      blank: 'Alegeți ce se potrivește în spațiul gol.',
      marked: 'Ce înseamnă propoziția marcată?',
      writeTitle: 'Sarcina de scriere', chars: function (n) { return n + ' caractere coreene'; },
      result: 'Rezultat', of: function (m) { return 'din ' + m + ' puncte'; },
      lvl: function (exam, l) { return l ? 'TOPIK ' + l + '급 obținut 🎉' : 'Sub pragul pentru ' + (exam === 'I' ? 'TOPIK 1' : 'TOPIK 3'); },
      bySec: 'Pe secțiuni', review: 'Greșelile tale', noErr: 'Nicio greșeală — excelent!',
      yours: 'Răspunsul tău:', right: 'Corect:', none: '(fără răspuns)',
      again: '🔁 Încă un test', home: '🏠 Acasă',
      hist: 'Testele tale', reqMet: 'Cerințe îndeplinite',
      nextLvl: function (exam, total) {
        var steps = exam === 'I' ? [[80, 1], [140, 2]] : [[120, 3], [150, 4], [190, 5], [230, 6]];
        for (var i = 0; i < steps.length; i++) if (total < steps[i][0]) return 'Până la TOPIK ' + steps[i][1] + ' îți mai trebuie ' + (steps[i][0] - total) + ' puncte.';
        return 'Ai atins nivelul maxim al acestui examen!';
      },
      timeUp: '⏰ Timpul secțiunii s-a terminat.'
    },
    en: {
      title: 'TOPIK mock test', sub: 'Real exam structure and scoring',
      exam: 'Which exam?', len: 'Length',
      I: ['TOPIK I', 'Levels 1–2 · listening + reading · 200 points'],
      II: ['TOPIK II', 'Levels 3–6 · listening + writing + reading · 300 points'],
      mini: ['Mini', 'Same structure, fewer questions — good for practice'],
      full: ['Full', 'Real number of questions and real timing'],
      plan: 'Test structure', start: 'Start the test ▶',
      note: 'Each section has its own timer. When it runs out you move on automatically. Each section is worth 100 points; your level uses the official pass marks.',
      sec: { listen: '듣기 · Listening', write: '쓰기 · Writing', read: '읽기 · Reading' },
      qn: function (i, n) { return 'Question ' + i + ' of ' + n; },
      q: function (n) { return n === 1 ? '1 task' : n + ' questions'; },
      min: function (m) { return m + ' min'; },
      play: function (left) { return '🔊 Listen (' + left + ' left)'; },
      noPlay: '🔇 Played twice already',
      prev: '← Back', next: 'Next →', endSec: 'Finish section ✓',
      confirmEnd: function (n) { return n + ' questions are unanswered. Finish the section?'; },
      meaning: 'Choose the correct meaning of the sentence.',
      blank: 'Choose what fits the blank.',
      marked: 'What does the highlighted sentence mean?',
      writeTitle: 'Writing task', chars: function (n) { return n + ' Korean characters'; },
      result: 'Result', of: function (m) { return 'out of ' + m + ' points'; },
      lvl: function (exam, l) { return l ? 'TOPIK level ' + l + ' achieved 🎉' : 'Below the pass mark for ' + (exam === 'I' ? 'TOPIK 1' : 'TOPIK 3'); },
      bySec: 'By section', review: 'Your mistakes', noErr: 'No mistakes — excellent!',
      yours: 'Your answer:', right: 'Correct:', none: '(no answer)',
      again: '🔁 Another test', home: '🏠 Home',
      hist: 'Your tests', reqMet: 'Requirements met',
      nextLvl: function (exam, total) {
        var steps = exam === 'I' ? [[80, 1], [140, 2]] : [[120, 3], [150, 4], [190, 5], [230, 6]];
        for (var i = 0; i < steps.length; i++) if (total < steps[i][0]) return (steps[i][0] - total) + ' more points to reach TOPIK ' + steps[i][1] + '.';
        return 'You reached the top level of this exam!';
      },
      timeUp: '⏰ Section time is up.'
    }
  };
  function t(k) { return T[LANG][k]; }
  function esc(x) { return String(x).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
  function $(id) { return document.getElementById(id); }
  function clickable(el, fn) {
    el.addEventListener('click', fn);
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } });
  }

  var DATA = null;
  var choice = { exam: (parseInt(localStorage.getItem('RK_TOPIK_PROGRESS'), 10) || 1) >= 3 ? 'II' : 'I', len: 'mini' };
  var run = null;   // { exam, len, sections:[{id,items,answers,min,left}], si, qi, timer }

  /* ── question pools ─────────────────────────────────────────── */
  function listenPool(levels) {
    return DATA.listening.filter(function (x) { return levels.indexOf(x.topik) !== -1; }).map(function (x) {
      return { kind: 'listen', topik: x.topik, ko: x.ko, q: x.question[LANG] || x.question.ro,
               options: x.options.map(function (o) { return o[LANG] || o.ro; }), correct: x.correct, plays: 0,
               tr: x.translation && (x.translation[LANG] || x.translation.ro) };
    });
  }
  function readPool(levels) {
    var out = [];
    DATA.reading.filter(function (x) { return levels.indexOf(x.topik) !== -1; }).forEach(function (txt) {
      var passage = txt.sentences.map(function (s) { return s.full; });
      if (txt.questions && txt.questions.length) {
        txt.questions.forEach(function (q) {
          out.push({ kind: 'passage', topik: txt.topik, passage: passage, mark: -1, q: q.q[LANG] || q.q.ro,
                     options: q.options.map(function (o) { return o[LANG] || o.ro; }), correct: q.correct });
        });
      } else {
        // Older texts: "what does the highlighted sentence mean?"
        shuffle(txt.sentences.map(function (s, i) { return i; })).slice(0, 2).forEach(function (i) {
          var right = txt.sentences[i].translation[LANG] || txt.sentences[i].translation.ro;
          var others = shuffle(txt.sentences.filter(function (s, j) { return j !== i; }))
            .map(function (s) { return s.translation[LANG] || s.translation.ro; })
            .filter(function (o, k, arr) { return o !== right && arr.indexOf(o) === k; }).slice(0, 3);
          if (others.length < 3) return;
          var opts = shuffle([right].concat(others));
          out.push({ kind: 'passage', topik: txt.topik, passage: passage, mark: i, q: t('marked'), options: opts, correct: opts.indexOf(right) });
        });
      }
    });
    var ex = DATA.exercises;
    (ex['ko-ro'] || []).forEach(function (x) {
      if (levels.indexOf(x.topik) === -1) return;
      var opts = x.answers[LANG] || x.answers.ro, right = x.correct[LANG] || x.correct.ro;
      if (!opts || opts.indexOf(right) === -1 || opts.length < 3) return;
      out.push({ kind: 'sentence', topik: x.topik, passage: [x.q], mark: -1, q: t('meaning'), options: opts.slice(), correct: opts.indexOf(right) });
    });
    (ex.particle || []).forEach(function (x) {
      if (levels.indexOf(x.topik) === -1 || !x.template || x.template.indexOf('___') === -1) return;
      var opts = x.options.slice();
      if (opts.indexOf(x.correct) === -1) return;
      out.push({ kind: 'blank', topik: x.topik, passage: [x.template.replace('___', '( _____ )')], mark: -1, q: t('blank'),
                 options: opts, correct: opts.indexOf(x.correct), koOpts: true });
    });
    return out;
  }
  // n questions spread over the levels, easiest first (like the real paper).
  function pick(pool, n, levels, mix) {
    var byKind = {};
    pool.forEach(function (q) { (byKind[q.kind] = byKind[q.kind] || []).push(q); });
    var chosen = [];
    if (mix) {
      // reading: ~40% passage questions, 30% sentence meaning, 30% grammar blank
      var want = { passage: Math.round(n * .4), sentence: Math.round(n * .3) };
      want.blank = n - want.passage - want.sentence;
      Object.keys(want).forEach(function (k) { chosen = chosen.concat(spread(byKind[k] || [], want[k], levels)); });
      if (chosen.length < n) chosen = chosen.concat(spread(pool.filter(function (q) { return chosen.indexOf(q) === -1; }), n - chosen.length, levels));
    } else chosen = spread(pool, n, levels);
    return chosen.sort(function (a, b) { return a.topik - b.topik; });
  }
  function spread(pool, n, levels) {
    var per = {}, out = [];
    levels.forEach(function (l) { per[l] = shuffle(pool.filter(function (q) { return q.topik === l; })); });
    var i = 0;
    while (out.length < n && levels.some(function (l) { return per[l].length; })) {
      var l = levels[i++ % levels.length];
      if (per[l].length) out.push(per[l].pop());
    }
    return out;
  }
  function writeTask() {
    var prompts = DATA.compose.filter(function (p) { return p.topik >= 3; });
    var p = prompts[Math.floor(Math.random() * prompts.length)];
    return { kind: 'write', topik: p.topik, prompt: p, text: '' };
  }

  /* ── setup screen ────────────────────────────────────────────── */
  function renderSetup() {
    $('pageTitle').textContent = t('title'); $('pageSubtitle').textContent = t('sub');
    $('lblExam').textContent = t('exam'); $('lblLen').textContent = t('len'); $('lblPlan').textContent = t('plan');
    $('startBtn').textContent = t('start'); $('planNote').textContent = t('note');
    function choices(boxId, keys, field) {
      var box = $(boxId); box.innerHTML = '';
      keys.forEach(function (k) {
        var d = document.createElement('div');
        d.className = 'tt-choice' + (choice[field] === k ? ' sel' : ''); d.setAttribute('role', 'button'); d.tabIndex = 0;
        d.innerHTML = '<b>' + esc(t(k)[0]) + '</b><span>' + esc(t(k)[1]) + '</span>';
        clickable(d, function () { choice[field] = k; renderSetup(); });
        box.appendChild(d);
      });
    }
    choices('examChoices', ['I', 'II'], 'exam');
    choices('lenChoices', ['mini', 'full'], 'len');
    var plan = PLANS[choice.exam][choice.len], total = 0;
    $('planTable').innerHTML = plan.map(function (s) {
      total += s.min;
      return '<tr><td>' + esc(t('sec')[s.id]) + '</td><td>' + esc(t('q')(s.n)) + '</td><td>' + esc(t('min')(s.min)) + '</td></tr>';
    }).join('') + '<tr><td><b>Total</b></td><td></td><td><b>' + esc(t('min')(total)) + '</b></td></tr>';
    renderHistory();
  }
  function renderHistory() {
    var h = RKStorage.get(HIST_KEY, []);
    $('histCard').hidden = !h.length;
    if (!h.length) return;
    $('lblHist').textContent = t('hist');
    $('histList').innerHTML = h.slice(-8).reverse().map(function (r) {
      return '<div class="tt-hist-row"><span>' + esc(r.date) + ' · TOPIK ' + r.exam + ' (' + esc(t(r.len)[0]) + ')</span><b>' +
        r.total + ' / ' + r.max + (r.level ? ' · ' + r.level + '급' : '') + '</b></div>';
    }).join('');
  }

  /* ── exam flow ───────────────────────────────────────────────── */
  function startExam() {
    var P = PLANS[choice.exam], plan = P[choice.len];
    var lp = listenPool(P.levels), rp = readPool(P.levels);
    run = { exam: choice.exam, len: choice.len, max: P.max, si: 0, qi: 0, timer: null,
            sections: plan.map(function (s) {
              var items = s.id === 'listen' ? pick(lp, s.n, P.levels, false)
                        : s.id === 'read' ? pick(rp, s.n, P.levels, true) : [writeTask()];
              return { id: s.id, items: items, answers: items.map(function () { return null; }), left: s.min * 60 };
            }) };
    show('phExam'); startSection();
  }
  function show(id) { ['phSetup', 'phExam', 'phResult'].forEach(function (p) { $(p).classList.toggle('active', p === id); }); window.scrollTo(0, 0); }
  function sec() { return run.sections[run.si]; }
  function startSection() {
    run.qi = 0;
    clearInterval(run.timer);
    run.timer = setInterval(function () {
      sec().left--; drawTimer();
      if (sec().left <= 0) { alert(t('timeUp')); nextSection(); }
    }, 1000);
    drawTimer(); renderQ();
  }
  function drawTimer() {
    var s = Math.max(0, sec().left), el = $('timer');
    el.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    el.classList.toggle('warn', s <= 120);
  }
  function nextSection() {
    var cur = sec();
    if (cur.id === 'write') { var ta = document.querySelector('.tt-text'); if (ta) cur.items[0].text = ta.value; }
    if (run.si < run.sections.length - 1) { run.si++; startSection(); }
    else finish();
  }
  function renderQ() {
    var s = sec(), item = s.items[run.qi], n = s.items.length;
    $('secName').innerHTML = esc(t('sec')[s.id]) + '<small>' + (run.si + 1) + ' / ' + run.sections.length + '</small>';
    $('progFill').style.width = Math.round(run.qi / n * 100) + '%';
    var card = $('qCard'), html = '';
    if (item.kind === 'write') {
      var p = item.prompt;
      html = '<div class="tt-qnum">' + esc(t('writeTitle')) + ' · TOPIK ' + p.topik + '</div>' +
        '<div class="tt-q">' + esc(p.icon + ' ' + (p.title[LANG] || p.title.ro)) + '</div>' +
        '<div class="tt-write-prompt">' + esc(p.prompt[LANG] || p.prompt.ro) + '</div>' +
        '<div class="tt-wordbank">' + p.wordBank.map(function (w) { return '<span>' + esc(w) + '</span>'; }).join('') + '</div>' +
        '<textarea class="tt-text" lang="ko" placeholder="여기에 쓰세요…"></textarea>' +
        '<div class="tt-count" id="wCount"></div>' +
        '<ul class="tt-reqs">' + p.requirements.map(function (r) { return '<li>☐ ' + esc(r.label[LANG] || r.label.ro) + '</li>'; }).join('') + '</ul>';
    } else {
      html = '<div class="tt-qnum">' + esc(t('qn')(run.qi + 1, n)) + '</div>';
      if (item.kind === 'listen') {
        html += '<div class="tt-play" role="button" tabindex="0" id="playBtn"></div>';
      } else {
        html += '<div class="tt-passage">' + item.passage.map(function (x, i) { return i === item.mark ? '<mark>' + esc(x) + '</mark>' : esc(x); }).join(' ') + '</div>';
      }
      html += '<div class="tt-q">' + esc(item.q) + '</div>';
      html += item.options.map(function (o, i) {
        return '<div class="tt-opt' + (item.koOpts ? ' ko' : '') + (s.answers[run.qi] === i ? ' sel' : '') + '" role="button" tabindex="0" data-i="' + i + '">' +
          '<span class="n">' + '①②③④⑤'[i] + '</span><span>' + esc(o) + '</span></div>';
      }).join('');
    }
    html += '<div class="tt-nav">' +
      (run.qi > 0 ? '<div role="button" tabindex="0" id="prevBtn">' + esc(t('prev')) + '</div>' : '') +
      (run.qi < n - 1 ? '<div role="button" tabindex="0" id="nextBtn" class="primary-ish">' + esc(t('next')) + '</div>'
                      : '<div role="button" tabindex="0" id="endBtn" class="primary-ish">' + esc(t('endSec')) + '</div>') +
      '</div>';
    card.innerHTML = html;

    if (item.kind === 'write') {
      var ta = card.querySelector('.tt-text');
      ta.value = item.text || '';
      var upd = function () { item.text = ta.value; $('wCount').textContent = t('chars')(countHangul(ta.value)); };
      ta.addEventListener('input', upd); upd();
    }
    if (item.kind === 'listen') {
      var pb = $('playBtn');
      var drawPlay = function () { var left = 2 - item.plays; pb.textContent = left > 0 ? t('play')(left) : t('noPlay'); pb.classList.toggle('off', left <= 0); };
      var doPlay = function () { if (item.plays >= 2) return; item.plays++; drawPlay(); if (window.AudioEngine) AudioEngine.speak(item.ko, { rate: 0.9 }); };
      clickable(pb, doPlay); drawPlay();
      if (item.plays === 0) doPlay();
    }
    Array.prototype.forEach.call(card.querySelectorAll('.tt-opt'), function (el) {
      clickable(el, function () {
        s.answers[run.qi] = +el.getAttribute('data-i');
        card.querySelectorAll('.tt-opt').forEach(function (x) { x.classList.toggle('sel', x === el); });
        drawDots();
      });
    });
    if ($('prevBtn')) clickable($('prevBtn'), function () { run.qi--; renderQ(); });
    if ($('nextBtn')) clickable($('nextBtn'), function () { run.qi++; renderQ(); });
    if ($('endBtn')) clickable($('endBtn'), function () {
      var open = s.id === 'write' ? 0 : s.answers.filter(function (a) { return a === null; }).length;
      if (open && !confirm(t('confirmEnd')(open))) return;
      nextSection();
    });
    drawDots();
  }
  function drawDots() {
    var s = sec(), box = $('dots');
    if (s.id === 'write') { box.innerHTML = ''; return; }
    box.innerHTML = s.items.map(function (_, i) {
      return '<div class="tt-dot' + (s.answers[i] !== null ? ' ans' : '') + (i === run.qi ? ' cur' : '') + '" role="button" tabindex="0" data-i="' + i + '">' + (i + 1) + '</div>';
    }).join('');
    Array.prototype.forEach.call(box.children, function (d) { clickable(d, function () { run.qi = +d.getAttribute('data-i'); renderQ(); }); });
  }

  /* ── scoring ─────────────────────────────────────────────────── */
  function countHangul(s) { return (s.match(/[가-힣]/g) || []).length; }
  function sentencesOf(text) { return text.split(/[.!?。]\s*|\n+/).map(function (x) { return x.trim(); }).filter(function (x) { return countHangul(x) > 0; }); }
  function reqOk(req, text) {
    var sents = sentencesOf(text);
    switch (req.type) {
      case 'minSentences': return sents.length >= req.value;
      case 'includesAny': case 'usesConnector': return req.value.some(function (w) { return text.indexOf(w) !== -1; });
      case 'includesAll': return req.value.every(function (w) { return text.indexOf(w) !== -1; });
      case 'endsWithPolite': return sents.length > 0 && sents.every(function (x) { return /(요|니다|니까|세요)\s*$/.test(x); });
      case 'minHangulChars': return countHangul(text) >= req.value;
      default: return false;
    }
  }
  function finish() {
    clearInterval(run.timer);
    var total = 0, rows = [], wrong = [];
    run.sections.forEach(function (s) {
      var pts;
      if (s.id === 'write') {
        var it = s.items[0], reqs = it.prompt.requirements;
        var met = reqs.filter(function (r) { return reqOk(r, it.text || ''); }).length;
        pts = Math.round(met / reqs.length * 100);
        s.met = met; s.reqTotal = reqs.length;
      } else {
        var c = 0;
        s.items.forEach(function (q, i) {
          if (s.answers[i] === q.correct) c++;
          else wrong.push({ sec: s.id, q: q, a: s.answers[i] });
        });
        pts = Math.round(c / s.items.length * 100);
        s.correct = c;
      }
      s.pts = pts; total += pts; rows.push(s);
    });
    var level = levelFor(run.exam, total);
    var h = RKStorage.get(HIST_KEY, []);
    h.push({ date: new Date().toISOString().slice(0, 10), exam: run.exam, len: run.len, total: total, max: run.max, level: level,
             sections: rows.map(function (s) { return { id: s.id, pts: s.pts }; }) });
    RKStorage.set(HIST_KEY, h.slice(-30));
    if (window.RKGamification) RKGamification.addXPBonus(Math.round(total / (run.len === 'full' ? 5 : 10)));
    if (window.RKStreak) RKStreak.touch();

    $('resCard').innerHTML =
      '<div class="tt-big"><div class="tt-qnum">' + esc(t('result')) + ' · TOPIK ' + run.exam + '</div>' +
      '<div class="score">' + total + '</div><div class="of">' + esc(t('of')(run.max)) + '</div>' +
      '<div class="tt-level' + (level ? '' : ' none') + '">' + esc(t('lvl')(run.exam, level)) + '</div>' +
      '<p class="tt-muted">' + esc(t('nextLvl')(run.exam, total)) + '</p></div>' +
      '<h2>' + esc(t('bySec')) + '</h2>' +
      rows.map(function (s) {
        var extra = s.id === 'write' ? ' (' + t('reqMet') + ' ' + s.met + '/' + s.reqTotal + ')' : ' (' + s.correct + '/' + s.items.length + ')';
        return '<div class="tt-srow"><span>' + esc(t('sec')[s.id].split(' · ')[1]) + '</span><span class="tt-sbar"><i style="width:' + s.pts + '%"></i></span><b>' + s.pts + '</b></div>' +
          '<div class="tt-muted" style="margin:-4px 0 6px">' + esc(extra) + '</div>';
      }).join('') +
      '<div class="tt-actions"><div class="main" role="button" tabindex="0" id="againBtn">' + esc(t('again')) + '</div><a href="index.html">' + esc(t('home')) + '</a></div>';
    clickable($('againBtn'), function () { show('phSetup'); renderSetup(); });

    var wSec = run.sections.filter(function (s) { return s.id === 'write'; })[0];
    var writeHtml = '';
    if (wSec) {
      var wi = wSec.items[0];
      writeHtml = '<div class="tt-review-item"><b>' + esc(t('writeTitle')) + '</b><ul class="tt-reqs">' +
        wi.prompt.requirements.map(function (r) { var ok = reqOk(r, wi.text || ''); return '<li class="' + (ok ? 'tt-ok' : 'tt-bad') + '">' + (ok ? '✓ ' : '✗ ') + esc(r.label[LANG] || r.label.ro) + '</li>'; }).join('') +
        '</ul></div>';
    }
    $('reviewCard').innerHTML = '<h2>' + esc(t('review')) + '</h2>' + writeHtml +
      (wrong.length ? wrong.map(function (w) {
        var q = w.q;
        var head = q.kind === 'listen' ? '🔊 <span class="ko">' + esc(q.ko) + '</span>' + (q.tr ? '<br><span class="tt-muted">' + esc(q.tr) + '</span>' : '')
                 : '<span class="ko">' + esc(q.mark >= 0 ? q.passage[q.mark] : q.passage.join(' ')) + '</span>';
        return '<div class="tt-review-item">' + head + '<br><b>' + esc(q.q) + '</b><br>' +
          '<span class="tt-bad">' + esc(t('yours')) + '</span> ' + esc(w.a === null ? t('none') : q.options[w.a]) + '<br>' +
          '<span class="tt-ok">' + esc(t('right')) + '</span> ' + esc(q.options[q.correct]) + '</div>';
      }).join('') : '<p class="tt-muted">' + esc(t('noErr')) + '</p>');
    show('phResult');
  }

  /* ── boot ────────────────────────────────────────────────────── */
  clickable($('startBtn'), function () { if (DATA) startExam(); });
  Promise.all(['listening', 'reading-texts', 'exercises', 'composition-prompts'].map(function (f) {
    return fetch('./data/' + f + '.json').then(function (r) { return r.json(); });
  })).then(function (r) {
    DATA = { listening: r[0], reading: r[1], exercises: r[2], compose: r[3] };
  });
  RKLang.init(function (l) { LANG = l; document.documentElement.lang = l; if (!run || $('phSetup').classList.contains('active')) renderSetup(); });
  renderSetup();
})();
</script>
