<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Video Maker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>📸 Photo Video Maker</h1>
    <p class="subtitle">Turn your photos into a short video with transitions, captions and music — all in your browser.</p>
  </header>

  <section class="card">
    <div id="dropzone" class="dropzone">
      <p>Click or drag photos here</p>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
    </div>
    <p id="emptyState" class="emptyState">No photos added yet.</p>
    <div id="photoList" class="photoList"></div>
  </section>

  <section class="card">
    <h2>Settings</h2>
    <div class="settingsRow">
      <label>Transition
        <select id="transition">
          <option value="fade">Fade</option>
          <option value="slide">Slide</option>
          <option value="none">None (hard cut)</option>
        </select>
      </label>
      <label class="musicLabel">Music (optional)
        <input type="file" id="musicInput" accept="audio/*">
      </label>
      <span id="musicName" class="musicName"></span>
      <button id="removeMusic" class="linkBtn" type="button" style="display:none">Remove music</button>
    </div>
    <button id="generateBtn" class="primaryBtn" type="button">Generate Video</button>
  </section>

  <section class="card">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div id="progressWrap" class="progressWrap" style="display:none">
      <div class="progressBar"><div id="progressBar" class="progressFill"></div></div>
      <p id="progressText">Rendering... 0%</p>
    </div>
    <div id="resultWrap" class="resultWrap" style="display:none">
      <video id="resultVideo" controls playsinline></video>
      <a id="downloadLink" class="primaryBtn" download>Download Video</a>
    </div>
  </section>

  <footer>
    <p>Works entirely in your browser — nothing is uploaded anywhere. Best in Chrome or Edge.</p>
  </footer>
</div>
<script src="script.js"></script>
</body>
</html>
