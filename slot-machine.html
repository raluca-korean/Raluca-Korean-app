<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raluca Korean — Slot Machine</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#6C5CE7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./theme-anime.css">
<style>
html, body { overflow-x: hidden; overflow-y: auto; min-height: 100vh; cursor: auto; }
*, *::before, *::after { cursor: auto !important; }

.sm-root { min-height: 100vh; padding-bottom: 48px; position: relative; z-index: 1; }

/* BACKGROUND */
.lmn-field { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.lmn-orb   { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .15; }
.lmn-orb-1 { width:500px;height:500px;background:#6C5CE7;top:-150px;left:-100px; }
.lmn-orb-2 { width:400px;height:400px;background:#E96A9A;top:20%;right:-100px; }
.lmn-orb-3 { width:300px;height:300px;background:#1CB0F6;bottom:15%;left:5%; }
.lmn-orb-4 { width:250px;height:250px;background:#58CC02;bottom:-50px;right:25%; }
.lmn-orb-5 { width:200px;height:200px;background:#f59e0b;top:45%;left:35%; }
html[data-mode="day"] .lmn-orb { opacity: .07; }

/* HEADER */
.sm-nav {
  position: sticky; top: 0; z-index: 200;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: rgba(7,7,28,.9); backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,.07);
}
html[data-mode="day"] .sm-nav { background: rgba(240,240,250,.93); border-bottom-color: rgba(0,0,0,.08); }
.sm-nav-brand { flex: 1; }
.sm-nav-title {
  font-size: 16px; font-weight: 900;
  background: linear-gradient(135deg, #8B7CFF, #E96A9A);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.sm-nav-sub {
  display: block; font-size: 9px; font-weight: 700; letter-spacing: .08em;
  color: rgba(139,124,255,.55); -webkit-text-fill-color: rgba(139,124,255,.55);
  margin-top: 1px;
}
html[data-mode="day"] .sm-nav-sub { color: rgba(108,92,231,.5); -webkit-text-fill-color: rgba(108,92,231,.5); }

/* STRUCTURE LABEL */
.sm-structure {
  text-align: center; padding: 8px 14px 2px;
  font-size: 11px; font-weight: 700;
  color: rgba(255,255,255,.25); letter-spacing: .05em;
}
html[data-mode="day"] .sm-structure { color: rgba(0,0,0,.28); }
.sm-structure b { font-weight: 900; }

/* REELS WRAPPER */
.sm-reels-wrap { padding: 10px 10px 0; overflow-x: auto; scrollbar-width: none; }
.sm-reels-wrap::-webkit-scrollbar { display: none; }
.sm-reels {
  display: grid; grid-template-columns: repeat(6, 1fr);
  gap: 6px; min-width: 330px;
}
@media (max-width: 560px) { .sm-reels { grid-template-columns: repeat(3, 1fr); min-width: 0; } }

/* SINGLE REEL */
.sm-reel {
  position: relative; border-radius: 14px;
  background: rgba(255,255,255,.04);
  border: 1.5px solid rgba(255,255,255,.09);
  overflow: hidden; transition: border-color .3s, box-shadow .3s;
  cursor: pointer !important;
}
html[data-mode="day"] .sm-reel { background: rgba(255,255,255,.82); border-color: rgba(0,0,0,.1); }
.sm-reel.locked { border-color: rgba(251,191,36,.6) !important; box-shadow: 0 0 14px rgba(251,191,36,.2); }
.sm-reel:hover { background: rgba(255,255,255,.07); }
html[data-mode="day"] .sm-reel:hover { background: rgba(108,92,231,.05); }
.reel-bar { height: 3px; }
.reel-inner {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 8px 4px 10px; gap: 3px; min-height: 108px;
}
.reel-lbl { font-size: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; opacity: .7; }
.reel-emoji { font-size: 26px; line-height: 1.1; }
.reel-ko {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px; font-weight: 900; text-align: center; line-height: 1.2;
  color: white;
}
html[data-mode="day"] .reel-ko { color: #20264A; }
.reel-ptcl { font-size: 10px; opacity: .5; font-weight: 400; }
.reel-tr { font-size: 8px; opacity: .4; text-align: center; max-width: 100%; padding: 0 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reel-lockbtn {
  position: absolute; top: 7px; right: 5px;
  font-size: 11px; line-height: 1;
  background: none; border: none; padding: 2px;
  opacity: .3; cursor: pointer !important;
  transition: opacity .2s; z-index: 2;
}
.sm-reel.locked .reel-lockbtn { opacity: .85; }
.reel-lockbtn:hover { opacity: .7 !important; }
.reel-edit-hint {
  position: absolute; bottom: 4px; right: 5px;
  font-size: 10px; opacity: .28; cursor: pointer !important;
  transition: opacity .15s; z-index: 2; padding: 2px;
}
.reel-edit-hint:hover { opacity: .7; }

/* REEL ANIMATIONS */
@keyframes reel-out {
  0%   { opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
  100% { opacity:0; transform:translateY(-14px) scale(.85); filter:blur(3px); }
}
@keyframes reel-in {
  0%   { opacity:0; transform:translateY(14px) scale(.85); filter:blur(3px); }
  65%  { transform:translateY(-3px) scale(1.07); filter:blur(0); }
  100% { opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
}
.sm-reel.is-out  .reel-inner { animation: reel-out .22s ease forwards; }
.sm-reel.is-in   .reel-inner { animation: reel-in  .32s cubic-bezier(.34,1.56,.64,1) forwards; }

/* SPIN BUTTON */
.sm-spin-wrap { padding: 14px 14px 6px; text-align: center; }
.sm-spin-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 15px 38px; border-radius: 999px; border: none;
  background: linear-gradient(135deg, #6C5CE7, #E96A9A, #f59e0b);
  background-size: 200% 100%;
  color: white; font-size: 16px; font-weight: 900; letter-spacing: .04em;
  cursor: pointer !important;
  box-shadow: 0 6px 28px rgba(108,92,231,.45);
  transition: transform .15s, box-shadow .2s, background-position .4s;
  animation: spin-pulse 3s ease infinite;
}
.sm-spin-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 38px rgba(233,106,154,.5); background-position: 100% 0; }
.sm-spin-btn:active { transform: scale(.96); }
.sm-spin-btn:disabled { animation: none; opacity: .6; cursor: not-allowed !important; pointer-events: none; }
@keyframes spin-pulse {
  0%,100% { box-shadow: 0 6px 28px rgba(108,92,231,.45); }
  50%      { box-shadow: 0 6px 36px rgba(233,106,154,.55), 0 0 0 4px rgba(233,106,154,.12); }
}

/* STATS */
.sm-stats {
  display: flex; gap: 8px; justify-content: center;
  padding: 8px 14px 0; flex-wrap: wrap;
}
.sm-stat {
  display: flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 700;
  padding: 4px 10px; border-radius: 999px;
  background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
  color: rgba(255,255,255,.45);
}
html[data-mode="day"] .sm-stat { background: rgba(0,0,0,.04); border-color: rgba(0,0,0,.08); color: rgba(0,0,0,.4); }
.sm-stat-val { color: white; font-size: 13px; font-weight: 900; }
html[data-mode="day"] .sm-stat-val { color: #20264A; }

/* RESULT CARD */
.sm-result {
  margin: 10px 14px 0; border-radius: 20px;
  background: rgba(255,255,255,.03); border: 1.5px solid rgba(255,255,255,.08);
  overflow: hidden; transition: border-color .4s, background .4s;
}
html[data-mode="day"] .sm-result { background: rgba(255,255,255,.65); border-color: rgba(0,0,0,.1); }
.sm-result.lit { border-color: rgba(139,124,255,.35); background: rgba(108,92,231,.06); }
html[data-mode="day"] .sm-result.lit { border-color: rgba(108,92,231,.22); background: rgba(108,92,231,.04); }
.sm-placeholder {
  text-align: center; padding: 28px 20px;
  color: rgba(255,255,255,.18); font-size: 13px; line-height: 1.6;
}
html[data-mode="day"] .sm-placeholder { color: rgba(0,0,0,.22); }
.sm-result-body { padding: 16px; animation: sm-fadein .35s ease; }
@keyframes sm-fadein { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

/* SENTENCE */
.sm-sentence {
  display: flex; flex-wrap: wrap; gap: 6px 10px;
  align-items: flex-end; margin-bottom: 12px;
}
.sm-chip {
  display: inline-flex; flex-direction: column; align-items: center; gap: 2px;
}
.sm-chip-ko {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 21px; font-weight: 900; line-height: 1.2;
}
.sm-chip-ptcl { font-size: 14px; opacity: .55; }
.sm-chip-lbl {
  font-size: 7px; font-weight: 900; text-transform: uppercase;
  letter-spacing: .08em; opacity: .55;
}
.sm-chip-tr {
  font-size: 10px; opacity: .4; font-style: italic;
  white-space: nowrap;
}

/* TRANSLATION ROW */
.sm-trans-row {
  font-size: 13px; color: rgba(255,255,255,.45);
  line-height: 1.5; margin-bottom: 12px; font-style: italic;
}
html[data-mode="day"] .sm-trans-row { color: rgba(0,0,0,.42); }

/* ACTIONS */
.sm-actions { display: flex; align-items: center; gap: 8px; }
.sm-speak {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 8px 16px; border-radius: 999px;
  border: 1.5px solid rgba(139,124,255,.3); background: transparent;
  color: #8B7CFF; font-size: 13px; font-weight: 700;
  cursor: pointer !important; transition: all .15s;
}
.sm-speak:hover { background: rgba(139,124,255,.12); }
.sm-total { margin-left: auto; font-size: 11px; color: rgba(255,255,255,.28); font-weight: 700; }
html[data-mode="day"] .sm-total { color: rgba(0,0,0,.28); }
.sm-total span { color: #fbbf24; }

/* WORD PICKER MODAL */
.sm-picker-overlay {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,.55); backdrop-filter: blur(4px);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.sm-picker-overlay.open { opacity: 1; pointer-events: all; }
.sm-picker-panel {
  width: 100%; max-width: 540px; max-height: 72vh;
  background: #0e0e26; border-radius: 24px 24px 0 0;
  border: 1.5px solid rgba(255,255,255,.1); border-bottom: none;
  overflow: hidden; display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform .3s cubic-bezier(.34,1.56,.64,1);
}
.sm-picker-overlay.open .sm-picker-panel { transform: translateY(0); }
html[data-mode="day"] .sm-picker-panel { background: #f0f0fa; border-color: rgba(0,0,0,.1); }
.sm-picker-header {
  display: flex; align-items: center; gap: 8px;
  padding: 14px 16px 10px; flex-shrink: 0;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
html[data-mode="day"] .sm-picker-header { border-bottom-color: rgba(0,0,0,.08); }
.sm-picker-title { flex: 1; font-size: 15px; font-weight: 900; }
.sm-picker-hint { font-size: 10px; opacity: .4; }
.sm-picker-close {
  background: none; border: none; color: rgba(255,255,255,.35);
  font-size: 20px; line-height: 1; padding: 4px 8px;
  cursor: pointer !important; transition: color .15s;
}
html[data-mode="day"] .sm-picker-close { color: rgba(0,0,0,.35); }
.sm-picker-close:hover { color: rgba(255,255,255,.85); }
html[data-mode="day"] .sm-picker-close:hover { color: rgba(0,0,0,.8); }
.sm-picker-list {
  overflow-y: auto; flex: 1; padding: 10px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
  gap: 6px; scrollbar-width: thin;
}
.sm-picker-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 9px 5px; border-radius: 12px;
  border: 1.5px solid rgba(255,255,255,.07);
  background: rgba(255,255,255,.03);
  cursor: pointer !important; transition: background .15s, border-color .15s;
  text-align: center; width: 100%;
}
html[data-mode="day"] .sm-picker-item { background: rgba(255,255,255,.7); border-color: rgba(0,0,0,.08); }
.sm-picker-item:hover { background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.18); }
html[data-mode="day"] .sm-picker-item:hover { background: rgba(108,92,231,.08); border-color: rgba(108,92,231,.2); }
.sm-picker-item.active { border-color: var(--pk-color, #6C5CE7); background: rgba(108,92,231,.14); }
.sm-picker-item-emoji { font-size: 22px; line-height: 1.1; }
.sm-picker-item-ko {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 12px; font-weight: 900; color: white;
}
html[data-mode="day"] .sm-picker-item-ko { color: #20264A; }
.sm-picker-item-tr { font-size: 8px; opacity: .4; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* RESPONSIVE */
.sm-picker-list.wide { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.sm-picker-list.wide .sm-picker-item { align-items: flex-start; text-align: left; padding: 9px 11px; height: auto !important; max-height: none !important; }
.sm-picker-list.wide .sm-picker-item > span { flex-shrink: 0; }
.sm-picker-list.wide .sm-picker-item-emoji { display: none; }
.sm-picker-list.wide .sm-picker-item-ko { font-size: 14px; white-space: normal; text-align: left; }
.sm-picker-list.wide .sm-picker-item-tr { font-size: 11.5px; opacity: .7; white-space: normal; }
.sm-picker-group { grid-column: 1 / -1; width: 100%; margin: 10px 2px 2px; font-size: 11px; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; opacity: .65; }
@media (max-width: 400px) {
  .sm-chip-ko { font-size: 17px; }
  .sm-spin-btn { padding: 13px 26px; font-size: 14px; }
  .reel-emoji { font-size: 22px; }
  .reel-ko { font-size: 11px; }
  .reel-inner { min-height: 96px; }
}
</style>

function fuseJ(w, jong) {
  const c = w.charCodeAt(w.length - 1);
  if (c < 44032 || c > 55203 || (c - 44032) % 28 !== 0) return w;

  const st = stemOf(v);

  const st = stemOf(v);

/* ── PARTICLES ────────────────────────────────────────────── */
function hasBatchim(w) {
  if (!w) return false;
  const c = w.charCodeAt(w.length - 1);
  return c >= 44032 && c <= 55203 && (c - 44032) % 28 !== 0;
}
function topicP(w)  { return hasBatchim(w) ? '은' : '는'; }
function objectP(w) { return hasBatchim(w) ? '을' : '를'; }
function particle(def, item) {
  if (def.id === 'subject')  return topicP(item.ko);
  if (def.id === 'location') return '에서';
  if (def.id === 'object')   return objectP(item.ko);
  return '';
}

// future), altfel propoziția coreeană se conjugă dar traducerea rămâne
// mereu la infinitiv ("a mânca"/"to eat"). RO folosește RoConjugator
// (motor general, acoperă orice glosă RO din vocab). EN reutilizează
// tabelul deja existent SentenceGenerator.enVerbConj (~226 verbe de bază,
// acoperă practic tot vocabularul de verbe) în loc să-l dubleze aici.
function roPersonIdx(subjKo) {
  if (subjKo === '저' || subjKo === '나') return 0; // eu
  if (subjKo === '너') return 1;                    // tu
  if (subjKo === '우리') return 3;                  // noi
  return 2;                                         // el/ea (subiect la persoana a 3-a)
}
// Descompune o glosă EN ("to buy", "to look for", "to be busy"…) în formele
// de bază / persoana a 3-a / trecut, folosind tabelul comun pentru capul
// verbului. Restul de gramatică specială (be/feel/not/rain) e cazul rar
// din vocab (~6%), tratat separat aici — pattern-ul e mic și izolat,
// tabelul mare de date rămâne unic în sentence-generator.js.
function enVerbForms(enGloss) {
  const conj = (window.SentenceGenerator && window.SentenceGenerator.enVerbConj) || {};
  const first = (enGloss || '').split(',')[0].split(';')[0].trim().replace(/\s*\([^)]*\)\s*$/, '');
  let m;
  if ((m = first.match(/^to not (.+)$/)))  return { negated: true, base: m[1] };
  if ((m = first.match(/^to feel (.+)$/))) return { base: `feel ${m[1]}`, third: `feels ${m[1]}`, past: `felt ${m[1]}` };
  if ((m = first.match(/^to be (.+)$/)))   return { beVerb: true, tail: m[1] };
  if (first === 'to rain') return { base: 'rain', third: 'rains', past: 'rained' };
  if ((m = first.match(/^to (.+)$/))) {
    const parts = m[1].split(' ');
    const head = parts[0], tail = parts.slice(1).join(' ');
    const pair = conj[head];
    if (!pair) return { base: m[1], third: m[1], past: m[1] };
    return { base: m[1], third: tail ? `${pair[0]} ${tail}` : pair[0], past: tail ? `${pair[1]} ${tail}` : pair[1] };
  }
  return { base: first, third: first, past: first };
}
function verbTranslation(verb, subjKo, tense, lang) {
  if (lang === 'en') {
    const isFirstSecond = subjKo === '저' || subjKo === '나' || subjKo === '너' || subjKo === '우리';
    const f = enVerbForms(verb.en);
    if (f.negated) {
      if (tense === 'past')   return `didn't ${f.base}`;
      if (tense === 'future') return `won't ${f.base}`;
      return isFirstSecond ? `don't ${f.base}` : `doesn't ${f.base}`;
    }
    if (f.beVerb) {
      if (tense === 'past')   return `was ${f.tail}`;
      if (tense === 'future') return `will be ${f.tail}`;
      if (subjKo === '저' || subjKo === '나') return `am ${f.tail}`;
      return isFirstSecond ? `are ${f.tail}` : `is ${f.tail}`;
    }
    if (tense === 'past')   return f.past;
    if (tense === 'future') return `will ${f.base}`;
    return isFirstSecond ? f.base : f.third;
  }
  if (window.RoConjugator) {
    const c = RoConjugator.conjugate(verb.ro);
    if (c) {
      const idx = roPersonIdx(subjKo);
      if (tense === 'past')   return c.trecut[idx]  || verb.ro;
      if (tense === 'future') return c.viitor[idx]  || verb.ro;
      return c.present[idx]  || verb.ro;
    }
  }
  return verb.ro;
}

/* ── STATE ────────────────────────────────────────────────── */
const SPINS_KEY = 'RK_SLOT_SPINS';
let spins = parseInt(localStorage.getItem(SPINS_KEY) || '0', 10) || 0, spinning = false;
const ST = {};
REELS.forEach(r => { ST[r.id] = { idx: 0, locked: false }; });
function cur(id) {
  const items = REELS.find(r => r.id === id).items;
  return items[ST[id].idx] || { ko:'…', ro:'…', en:'…', emoji:'•' };
}

/* ── ÎNCARCĂ VOCABULARUL ──────────────────────────────────── */
async function loadVocab() {
  let byKo = { ...EXTRAS };
  try {
    const data = await fetch('./data/vocab-korean.json').then(r => r.json());
    data.forEach(d => { if (!byKo[d.ko]) byKo[d.ko] = d; });
  } catch(e) {
    console.warn('Vocabularul nu s-a putut încărca, folosesc cuvintele de bază.');
  }

  // Vocabularul separă alternativele fie prin ",", fie prin "/" (niciodată
  // ambele în aceeași glosă) — ex. "to wipe / to clean" pentru 닦다. Fără
  // split pe "/" aici, coada rămasă ("/ to clean") se scurgea în traducerea
  // conjugată a verbului.
  function makeItem(ko, cat) {
    const v = byKo[ko];
    if (!v) return { ko, emoji: emj(ko, cat), ro: ko, en: ko };
    const ro = (v.ro || ko).split(',')[0].split(';')[0].split('/')[0].trim();
    const en = (v.en || ko).split(',')[0].split(';')[0].split('/')[0].trim();
    return { ko, emoji: emj(ko, cat), ro, en };
  }

  // SUBIECTE: pronume esențiale + toți subiecții din vocab
  const SKIP_SUBJ = new Set(['회사','책']);
  const subjKos = ['저','나','너','우리'];
  Object.values(byKo)
    .filter(d => d.categories && d.categories.includes('subjects') && !SKIP_SUBJ.has(d.ko) && !subjKos.includes(d.ko))
    .sort((a,b) => a.ko.localeCompare(b.ko))
    .forEach(d => subjKos.push(d.ko));

  // TIMPURI: de bază + toți din vocab (fără unități abstracte)
  const SKIP_T = new Set(['분','초','주','달','년','언제']);
  const timeKos = ['오늘','매일','어제','내일','아침에','저녁에','주말에','지금'];
  Object.values(byKo)
    .filter(d => d.categories && d.categories.includes('times') && !SKIP_T.has(d.ko) && !timeKos.includes(d.ko))
    .sort((a,b) => a.ko.localeCompare(b.ko))
    .forEach(d => timeKos.push(d.ko));

  // LOCURI / OBIECTE: toate din vocab (categoriile 'places'/'objects')
  const locKos = Object.values(byKo)
    .filter(d => d.categories && d.categories.includes('places'))
    .map(d => d.ko);
  const objKos = Object.values(byKo)
    .filter(d => d.categories && d.categories.includes('objects'))
    .map(d => d.ko);

  // VERBE: toate din vocab, cu excluderi necesare pentru propoziții
  // gramatical corecte (rolele se combină independent, fără nicio logică
  // de potrivire semantică sau de registru):
  //  1) verbele onorifice/smerite (계시다, 주무시다 etc.) presupun un
  //     subiect anume (persoană cu statut superior / vorbitorul însuși),
  //     dar subiectul e ales independent aici;
  //  2) glosele "to be/to feel/to not X" sunt de fapt adjective-predicat
  //     în coreeană — nu iau obiect direct cu 을/를 ca restul verbelor din
  //     tiparul fix subiect+timp+loc+obiect+verb — iar "to rain" e
  //     impersonal (fără subiect uman);
  //  3) 싫어하다: singura glosă RO din tot vocabularul de verbe scrisă ca
  //     construcție dativă negată ("a nu-i plăcea") — RoConjugator nu o
  //     parsează corect (îi pierde negația, inversând sensul în "place"/
  //     "a plăcut"). Vocabul are și "a detesta" ca alternativă, dar e a
  //     doua opțiune din listă; mai simplu de exclus aici decât de reparat
  //     parserul general pentru un singur cuvânt.
  const SKIP_VERB = new Set(['계시다','주무시다','말씀하시다','드리다','돌아가시다','뵈다','싫어하다']);
  function isSlotVerb(d) {
    const en = (d.en || '').split(',')[0].split(';')[0].trim();
    return en !== 'to rain' && /^to (?!not |feel |be )\S/.test(en);
  }
  const verbKos = Object.values(byKo)
    .filter(d => d.categories && d.categories.includes('verbs') && !SKIP_VERB.has(d.ko) && isSlotVerb(d))
    .map(d => d.ko);

  REELS.find(r => r.id === 'subject').items  = subjKos.map(ko => makeItem(ko, 'subjects'));
  REELS.find(r => r.id === 'time').items     = timeKos.map(ko => makeItem(ko, 'times'));
  REELS.find(r => r.id === 'location').items = locKos.map(ko  => makeItem(ko, 'places'));
  REELS.find(r => r.id === 'object').items   = objKos.map(ko  => makeItem(ko, 'objects'));
  REELS.find(r => r.id === 'verb').items     = verbKos.map(ko => makeItem(ko, 'verbs'));
  REELS.find(r => r.id === 'ending').items   = ENDINGS;

  REELS.forEach(r => { ST[r.id].idx = Math.floor(Math.random() * r.items.length); });
  buildReels();
}

/* ── RENDER REEL ──────────────────────────────────────────── */
function renderReel(def) {
  const s    = ST[def.id];
  const item = def.items[s.idx];
  if (!item) return;
  const ptcl = particle(def, item);
  const lang = window.RKLang ? RKLang.get() : 'ro';
  const el   = document.querySelector(`[data-rid="${def.id}"]`);
  if (!el) return;

  el.classList.toggle('locked', s.locked);
  el.querySelector('.reel-lbl').textContent     = def.label[lang];
  el.querySelector('.reel-emoji').textContent   = item.emoji;
  el.querySelector('.reel-ko-word').textContent = item.ko;
  el.querySelector('.reel-ptcl').textContent    = ptcl;
  el.querySelector('.reel-tr').textContent      = item[lang];
  el.querySelector('.reel-lockbtn').textContent = s.locked ? '🔒' : '🔓';
}

function buildReels() {
  const container = document.getElementById('smReels');
  const lang = window.RKLang ? RKLang.get() : 'ro';
  container.innerHTML = '';
  REELS.forEach(def => {
    const s    = ST[def.id];
    const item = def.items[s.idx] || { ko:'…', emoji:'•', ro:'…', en:'…' };
    const ptcl = particle(def, item);
    const el   = document.createElement('div');
    el.className = 'sm-reel' + (s.locked ? ' locked' : '');
    el.dataset.rid = def.id;
    el.innerHTML = `
      <div class="reel-bar" style="background:${def.color}"></div>
      <button class="reel-lockbtn" type="button" title="Blochează rela">${s.locked ? '🔒' : '🔓'}</button>
      <div class="reel-inner">
        <div class="reel-lbl" style="color:${def.color}">${def.label[lang]}</div>
        <div class="reel-emoji">${item.emoji}</div>
        <div class="reel-ko"><span class="reel-ko-word">${item.ko}</span><span class="reel-ptcl">${ptcl}</span></div>
        <div class="reel-tr">${item[lang]}</div>
      </div>
      <span class="reel-edit-hint">✏️</span>`;
    el.querySelector('.reel-lockbtn').addEventListener('click', e => {
      e.stopPropagation();
      if (spinning) return;
      ST[def.id].locked = !ST[def.id].locked;
      renderReel(def);
    });
    el.querySelector('.reel-edit-hint').addEventListener('click', e => {
      e.stopPropagation();
      openPicker(def.id);
    });
    el.addEventListener('click', e => {
      if (e.target.closest('.reel-lockbtn')) return;
      if (e.target.closest('.reel-edit-hint')) return;
      if (spinning) return;
      const items = def.items;
      if (!items.length) return;
      ST[def.id].idx = (ST[def.id].idx + 1) % items.length;
      renderReel(def);
      if (spins > 0) showResult();
    });
    container.appendChild(el);
  });
}

/* ── WORD PICKER ──────────────────────────────────────────── */
let pickerReelId = null;

function openPicker(reelId) {
  if (spinning) return;
  pickerReelId = reelId;
  const def  = REELS.find(r => r.id === reelId);
  const lang = window.RKLang ? RKLang.get() : 'ro';

  const titleEl = document.getElementById('smPickerTitle');
  titleEl.textContent = def.label[lang];
  titleEl.style.color = def.color;

  const hintEl = document.getElementById('smPickerHint');
  hintEl.textContent = lang === 'ro'
    ? 'Atinge un cuvânt pentru a-l selecta'
    : 'Tap a word to select it';

  const list = document.getElementById('smPickerList');
  list.innerHTML = '';
  list.classList.toggle('wide', reelId === 'ending');
  let lastGroup = null;
  def.items.forEach((item, idx) => {
    if (item.g && item.g !== lastGroup) {
      lastGroup = item.g;
      const h = document.createElement('div');
      h.className = 'sm-picker-group';
      h.textContent = ENDING_GROUPS[item.g].emoji + ' ' + ENDING_GROUPS[item.g][lang];
      list.appendChild(h);
    }
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'sm-picker-item' + (idx === ST[reelId].idx ? ' active' : '');
    btn.style.setProperty('--pk-color', def.color);
    btn.innerHTML = `
      <span class="sm-picker-item-emoji">${item.emoji}</span>
      <span class="sm-picker-item-ko">${item.ko}</span>
      <span class="sm-picker-item-tr">${item[lang]}</span>`;
    btn.addEventListener('click', () => {
      ST[reelId].idx    = idx;
      ST[reelId].locked = true;
      renderReel(def);
      if (spins > 0) showResult();
      closePicker();
    });
    list.appendChild(btn);
  });

  // Scroll to active item
  const overlay = document.getElementById('smPickerOverlay');
  overlay.classList.add('open');
  requestAnimationFrame(() => {
    const activeBtn = list.querySelector('.active');
    if (activeBtn) activeBtn.scrollIntoView({ block:'center', behavior:'smooth' });
  });
}

function closePicker() {
  document.getElementById('smPickerOverlay').classList.remove('open');
  pickerReelId = null;
}

/* ── SPIN ─────────────────────────────────────────────────── */
function spinOne(def, delay, finalIdx, cb) {
  const el = document.querySelector(`[data-rid="${def.id}"]`);
  setTimeout(() => {
    el.classList.add('is-out');
    el.querySelector('.reel-inner').addEventListener('animationend', () => {
      el.classList.remove('is-out');
      ST[def.id].idx = finalIdx;
      renderReel(def);
      void el.offsetWidth;
      el.classList.add('is-in');
      el.querySelector('.reel-inner').addEventListener('animationend', () => {
        el.classList.remove('is-in');
        cb && cb();
      }, { once: true });
    }, { once: true });
  }, delay);
}

function doSpin() {
  if (spinning) return;
  spinning = true;
  document.getElementById('smSpinBtn').disabled = true;

  const delays = [0, 90, 180, 270, 360, 450];
  let done = 0;
  const total = REELS.filter(r => !ST[r.id].locked).length || 0;
  if (total === 0) { spinning = false; document.getElementById('smSpinBtn').disabled = false; return; }

  // Fiecare rolă trage independent din tot vocabularul ei — nu mai există
  // o listă fixă de combinații "coerente" (vezi loadVocab), deci fiecare
  // rolă blocată rămâne pur și simplu neschimbată, restul se rotesc liber.
  const targets = {};
  REELS.forEach(def => {
    const len = def.items.length;
    let t = Math.floor(Math.random() * len);
    if (t === ST[def.id].idx && len > 1)
      t = (ST[def.id].idx + 1 + Math.floor(Math.random() * (len - 1))) % len;
    targets[def.id] = t;
  });

  REELS.forEach((def, i) => {
    if (ST[def.id].locked) return;
    spinOne(def, delays[i], targets[def.id], () => {
      done++;
      if (done === total) finishSpin();
    });
  });
}

function finishSpin() {
  spinning = false;
  spins++;
  localStorage.setItem(SPINS_KEY, String(spins));
  const streakDays = window.RKStreak ? RKStreak.touch().days : 0;
  document.getElementById('smSpinBtn').disabled = false;
  document.getElementById('statSpins').textContent = spins;
  document.getElementById('statStreak').textContent = streakDays;
  document.getElementById('smTotal').textContent = spins;
  showResult();
  setTimeout(() => {
    if (window.AudioEngine) AudioEngine.speak(buildKoSentence(), { repeat: 1 });
  }, 150);
}

/* ── RESULT ───────────────────────────────────────────────── */
function buildKoSentence() {
  const subj = cur('subject'), time = cur('time'),
        loc  = cur('location'), obj = cur('object'), verb = cur('verb');
  const verbConj = endingForm(verb.ko);
  return `${subj.ko}${topicP(subj.ko)} ${time.ko} ${loc.ko}에서 ${obj.ko}${objectP(obj.ko)} ${verbConj}`;
}

function showResult() {
  const lang = window.RKLang ? RKLang.get() : 'ro';
  const subj = cur('subject'), time = cur('time'),
        loc  = cur('location'), obj = cur('object'), verb = cur('verb');
  const verbConj = endingForm(verb.ko);
  const end = cur('ending');
  const verbTr = end.tense ? verbTranslation(verb, subj.ko, end.tense, lang) : `${end[lang]} (${verb[lang]})`;

  const chips = [
    { ko: subj.ko,  ptcl: topicP(subj.ko),  color:'#f472b6', lbl:'주어',   tr: subj[lang]  },
    { ko: time.ko,  ptcl: '',               color:'#fbbf24', lbl:'시간',   tr: time[lang]  },
    { ko: loc.ko,   ptcl: '에서',           color:'#38bdf8', lbl:'장소',   tr: loc[lang]   },
    { ko: obj.ko,   ptcl: objectP(obj.ko),  color:'#4ade80', lbl:'목적어', tr: obj[lang]   },
    { ko: verbConj, ptcl: '',               color:'#a78bfa', lbl:'동사 + 어미', tr: verbTr },
  ];

  document.getElementById('smSentence').innerHTML = chips.map(c => `
    <span class="sm-chip">
      <span class="sm-chip-ko" style="color:${c.color}">${c.ko}<span class="sm-chip-ptcl">${c.ptcl}</span></span>
      <span class="sm-chip-lbl" style="color:${c.color}">${c.lbl}</span>
      <span class="sm-chip-tr">${c.tr}</span>
    </span>`).join('');

  const transLabel = lang === 'ro' ? 'Structura:' : 'Structure:';
  document.getElementById('smTrans').textContent =
    `${transLabel} ${chips.map(c => c.tr).join(' · ')}`;

  document.getElementById('smSpeakLbl').textContent = lang === 'ro' ? 'Ascultă' : 'Listen';
  document.getElementById('smPlaceholder').style.display = 'none';
  const body = document.getElementById('smBody');
  body.style.display = 'block';
  body.style.animation = 'none';
  void body.offsetWidth;
  body.style.animation = 'sm-fadein .35s ease';
  document.getElementById('smResult').classList.add('lit');
}

/* ── INIT ─────────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('smReels').innerHTML =
    '<div style="grid-column:1/-1;text-align:center;padding:24px;opacity:.35;font-size:12px;font-weight:700">Se încarcă vocabularul…</div>';

  document.getElementById('statSpins').textContent = spins;
  document.getElementById('statStreak').textContent = window.RKStreak ? RKStreak.get().days : 0;
  document.getElementById('smTotal').textContent = spins;

  loadVocab();


  document.getElementById('smSpinBtn').addEventListener('click', doSpin);

  document.getElementById('smSpeak').addEventListener('click', () => {
    if (spins === 0) return;
    if (window.AudioEngine) AudioEngine.speak(buildKoSentence(), { repeat: 1 });
  });

  document.getElementById('smPickerClose').addEventListener('click', closePicker);
  document.getElementById('smPickerOverlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) closePicker();
  });

  RKLang.init(lang => {
    REELS.forEach(renderReel);
    document.getElementById('smSpeakLbl').textContent = lang === 'ro' ? 'Ascultă' : 'Listen';
    if (spins > 0) showResult();
  });
});
</script>
