<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raluca Korean — Magazin</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#db2777">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./theme-anime.css">
<style>
.sh-balance{text-align:center;padding:26px 16px 22px}
.sh-balance-num{font-size:44px;font-weight:900;color:var(--rk-heading);line-height:1}
.sh-balance-lbl{font-size:13px;color:var(--rk-muted);margin-top:6px;font-weight:600}

.sh-item{
  display:flex;align-items:center;gap:14px;
  padding:16px;border-radius:14px;margin-bottom:12px;
  background:var(--rk-card);border:2px solid var(--rk-stroke);border-bottom:4px solid var(--rk-stroke-b);
  box-shadow:0 4px 14px var(--rk-shadow);
}
.sh-item:last-child{margin-bottom:0}
.sh-icon{font-size:32px;width:44px;text-align:center;flex-shrink:0}
.sh-info{flex:1;min-width:0}
.sh-title{font-size:15px;font-weight:800;color:var(--rk-heading)}
.sh-sub{font-size:12px;color:var(--rk-muted);margin-top:2px}
.sh-owned{font-size:11px;color:var(--rk-pink,#db2777);margin-top:4px;font-weight:700}
.sh-buy{
  flex-shrink:0;border:none;border-radius:12px;padding:10px 16px;
  background:linear-gradient(135deg,#db2777,#7c3aed);color:#fff;font-weight:800;font-size:13px;
  font-family:inherit;cursor:pointer;box-shadow:0 4px 14px rgba(219,39,119,.28);transition:opacity .15s,transform .15s;
  white-space:nowrap;
}
.sh-buy:hover{transform:translateY(-1px)}
.sh-buy:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

.sh-toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:linear-gradient(135deg,#db2777,#7c3aed);color:#fff;font-weight:800;font-size:14px;
  padding:12px 22px;border-radius:16px;box-shadow:0 8px 26px rgba(124,58,237,.4);
  opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:9999;
}
.sh-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

body.dark-mode .sh-item{background:#1a0e2e;border-color:rgba(219,39,119,.22)}

@media(max-width:500px){
  .sh-balance-num{font-size:34px}
}
</style>
</head>
<body class="theme-anime">
<div class="app">

<div class="card">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
    <div>
      <h1 id="pageTitle">🪙 Magazin</h1>
      <div class="sub" id="pageSubtitle">Cheltuiește monedele câștigate din exerciții</div>
    </div>
    <div id="pageControls"></div>
  </div>
</div>

<div class="card sh-balance">
  <div class="sh-balance-num" id="balanceNum">0</div>
  <div class="sh-balance-lbl" id="balanceLbl">🪙 Seoul Coins</div>
</div>

<div class="card" id="itemsCard"></div>

</div><!-- /app -->

<div class="sh-toast" id="toast"></div>

<script src="./js/core/storage.js"></script>
<script src="./js/core/gamification.js"></script>
<script src="./js/core/streak.js"></script>
<script src="./js/core/lang-picker.js"></script>
<script>
'use strict';

var LANG = RKLang.get();

var UI = {
  ro:{
    title:'🪙 Magazin', sub:'Cheltuiește monedele câștigate din exerciții',
    balanceLbl:'🪙 Seoul Coins',
    freezeTitle:'🧊 Streak Freeze', freezeSub:'Îți protejează streak-ul dacă ratezi o zi întreagă.',
    freezeOwned:function(n){ return n + ' ' + (n===1?'protecție deținută':'protecții deținute'); },
    boostTitle:'⚡ XP Boost ×10', boostSub:'Dublează XP-ul pentru următoarele 10 răspunsuri corecte.',
    boostActive:function(n){ return '⚡ Activ — ' + n + ' răspunsuri rămase'; },
    buy:function(cost){ return 'Cumpără · 🪙' + cost; },
    bought:'Cumpărat! 🎉',
    notEnough:'Nu ai suficiente monede 🪙'
  },
  en:{
    title:'🪙 Shop', sub:'Spend the coins you earn from exercises',
    balanceLbl:'🪙 Seoul Coins',
    freezeTitle:'🧊 Streak Freeze', freezeSub:'Protects your streak if you miss a whole day.',
    freezeOwned:function(n){ return n + ' ' + (n===1?'freeze owned':'freezes owned'); },
    boostTitle:'⚡ XP Boost ×10', boostSub:'Doubles XP for your next 10 correct answers.',
    boostActive:function(n){ return '⚡ Active — ' + n + ' answers left'; },
    buy:function(cost){ return 'Buy · 🪙' + cost; },
    bought:'Purchased! 🎉',
    notEnough:'Not enough coins 🪙'
  }
};
function L(){ return UI[LANG]; }

var ITEMS = [
  {
    id:'freeze', icon:'🧊', cost:100,
    title:function(l){ return l.freezeTitle; }, sub:function(l){ return l.freezeSub; },
    owned:function(l){ return l.freezeOwned(window.RKStreak ? RKStreak.getFreezes() : 0); },
    buy:function(){ RKStreak.addFreeze(1); }
  },
  {
    id:'boost', icon:'⚡', cost:60,
    title:function(l){ return l.boostTitle; }, sub:function(l){ return l.boostSub; },
    owned:function(l){
      var b = window.RKGamification ? RKGamification.getXPBoost() : {usesLeft:0};
      return b.usesLeft > 0 ? l.boostActive(b.usesLeft) : '';
    },
    buy:function(){ RKGamification.addXPBoostUses(10); }
  }
];

function render(){
  var l = L();
  document.getElementById('pageTitle').textContent = l.title;
  document.getElementById('pageSubtitle').textContent = l.sub;
  document.getElementById('balanceLbl').textContent = l.balanceLbl;

  var coins = window.RKGamification ? RKGamification.getCoins() : 0;
  document.getElementById('balanceNum').textContent = coins;

  var html = '';
  ITEMS.forEach(function(item){
    var canAfford = coins >= item.cost;
    var ownedText = item.owned(l);
    html += '<div class="sh-item">' +
      '<div class="sh-icon">' + item.icon + '</div>' +
      '<div class="sh-info">' +
        '<div class="sh-title">' + item.title(l) + '</div>' +
        '<div class="sh-sub">' + item.sub(l) + '</div>' +
        (ownedText ? '<div class="sh-owned">' + ownedText + '</div>' : '') +
      '</div>' +
      '<button type="button" class="sh-buy" data-id="' + item.id + '"' + (canAfford ? '' : ' disabled') + '>' + l.buy(item.cost) + '</button>' +
    '</div>';
  });
  document.getElementById('itemsCard').innerHTML = html;

  document.querySelectorAll('.sh-buy').forEach(function(btn){
    btn.addEventListener('click', function(){
      var item = ITEMS.filter(function(i){ return i.id === btn.dataset.id; })[0];
      if(!item || !window.RKGamification) return;
      if(!RKGamification.spendCoins(item.cost)){ showToast(L().notEnough); return; }
      item.buy();
      showToast(L().bought);
      render();
    });
  });
}

function showToast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}

RKLang.init(function(lang){ LANG = lang; render(); });
render();
</script>
<script src="./js/core/dark-mode.js"></script>
<script src="./js/core/register-sw.js"></script>
<script src="./js/core/page-help.js"></script>
</body>
</html>
