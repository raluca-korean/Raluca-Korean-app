<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raluca Korean — Profil</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#6C5CE7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F7; --card:#FFFFFF; --text:#202124; --text-mid:#6B6B73; --text-low:#9C9CA3;
  --border:#E7E5E1; --shadow:rgba(32,33,36,.07);
  --lavender:#6C5CE7; --lavender-soft:#EFEBFC; --pink:#E96A9A; --bar-bg:#EFEDE9;
  --forest:#6C5CE7; --gold:#F4C95D;
}
body.dark-mode{
  --bg:#101426; --card:#181D32; --text:#F7F4FA; --text-mid:#B8B9C5; --text-low:#7D7E93;
  --border:rgba(255,255,255,.08); --shadow:rgba(0,0,0,.35);
  --lavender:#8B7CFF; --lavender-soft:rgba(139,124,255,.16); --pink:#F17EAB; --bar-bg:rgba(255,255,255,.08);
  --forest:#8B7CFF; --gold:#F3CB69;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:96px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 0 6px}
.brand{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:800;text-decoration:none;color:var(--text)}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--text-mid)}
.topbar-actions{display:flex;align-items:center;gap:8px}
.lang{display:flex;border:1px solid var(--border);border-radius:20px;overflow:hidden;background:var(--card)}
.lang button{border:none;background:none;padding:7px 12px;font-size:11px;font-weight:800;color:var(--text-low);cursor:pointer;font-family:inherit}
.lang button.active{background:var(--forest);color:#fff}

.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;margin-top:16px;box-shadow:0 4px 18px var(--shadow)}
.card-eyebrow{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--lavender)}

/* ── HEADER ───────────────────────────────────────────── */
.pf-head{text-align:center;padding:22px 16px 18px}
.pf-avatar{font-size:48px;line-height:1}
.pf-level{font-size:18px;font-weight:900;margin-top:8px}
.pf-persona{font-size:12px;color:var(--text-mid);margin-top:4px;font-weight:700;text-decoration:none}
.pf-persona.empty{color:var(--lavender)}

.pf-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.pf-stat{background:var(--bar-bg);border-radius:14px;padding:12px 8px}
.pf-stat-val{font-size:18px;font-weight:900}
.pf-stat-lbl{font-size:10px;color:var(--text-mid);margin-top:2px;font-weight:600}

/* ── SKILLS ───────────────────────────────────────────── */
.pf-skill{margin-bottom:14px}
.pf-skill:last-child{margin-bottom:0}
.pf-skill-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:800;margin-bottom:6px}
.pf-skill-count{font-size:11px;font-weight:600;color:var(--text-mid)}
.pf-bar-bg{height:10px;background:var(--bar-bg);border-radius:6px;overflow:hidden}
.pf-bar{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--lavender),var(--pink));transition:width .8s cubic-bezier(.4,0,.2,1)}

/* ── ACHIEVEMENTS ─────────────────────────────────────── */
.pf-ach-count{font-size:11px;color:var(--text-mid);margin:0 0 12px}
.pf-ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.pf-ach{
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:12px 6px;border-radius:12px;
  background:var(--bar-bg);border:1px solid var(--border);
}
.pf-ach.locked{opacity:.4}
.pf-ach-icon{font-size:26px}
.pf-ach-title{font-size:10px;font-weight:700;line-height:1.3}

/* ── MODE SWITCH ──────────────────────────────────────── */
.pf-mode-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pf-mode-current{font-size:14px;font-weight:800}
.pf-mode-hint{font-size:11px;color:var(--text-mid);margin-top:2px}
.pf-mode-btn{
  flex-shrink:0;border:1px solid var(--border);background:var(--bar-bg);color:var(--lavender);
  font-weight:800;font-size:12px;padding:9px 14px;border-radius:12px;cursor:pointer;font-family:inherit;
}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <a href="index.html" class="brand">← <span aria-hidden="true">🐯</span> Raluca Korean</a>
    <div class="topbar-actions">
      <div class="lang">
        <button id="btnRo" type="button">RO</button>
        <button id="btnEn" type="button">EN</button>
      </div>
      <button class="icon-btn" id="darkToggle" type="button" aria-label="Toggle dark mode">🌙</button>
    </div>
  </div>

  <div class="card pf-head">
    <div class="pf-avatar" id="pfAvatar">👤</div>
    <div class="pf-level" id="pfLevel"></div>
    <a href="index.html" class="pf-persona" id="pfPersona"></a>
    <div class="pf-stats">
      <div class="pf-stat"><div class="pf-stat-val" id="pfStreak"></div><div class="pf-stat-lbl" id="pfStreakLbl"></div></div>
      <div class="pf-stat"><div class="pf-stat-val" id="pfXp"></div><div class="pf-stat-lbl">XP</div></div>
      <div class="pf-stat"><div class="pf-stat-val" id="pfCoins"></div><div class="pf-stat-lbl" id="pfCoinsLbl"></div></div>
    </div>
  </div>

  <div class="card">
    <div class="card-eyebrow" id="skillsTitle"></div>
    <div id="skillsBody" style="margin-top:12px"></div>
  </div>

  <div class="card">
    <div class="card-eyebrow" id="achTitle"></div>
    <div class="pf-ach-count" id="achCount" style="margin-top:6px"></div>
    <div class="pf-ach-grid" id="achGrid"></div>
  </div>

  <div class="card">
    <div class="card-eyebrow" id="modeTitle"></div>
    <div class="pf-mode-row" style="margin-top:10px">
      <div>
        <div class="pf-mode-current" id="modeCurrent"></div>
        <div class="pf-mode-hint" id="modeHint"></div>
      </div>
      <button class="pf-mode-btn" id="modeSwitchBtn" type="button"></button>
    </div>
  </div>
</div>

<div id="rkBottomNav"></div>

<script src="./js/core/storage.js"></script>
<script src="./js/core/gamification.js"></script>
<script src="./js/core/streak.js"></script>
<script src="./js/core/bottom-nav.js"></script>
<script>
'use strict';

var LANG = localStorage.getItem('RK_LANG') || 'ro';
RKNav.init('progress');
var UI = {
  ro:{
    streakLbl:'Streak', coinsLbl:'Monede', pickPersona:'Alege stilul tău →',
    skillsTitle:'Abilități', achTitle:'Realizări',
    achCount:function(n,total){ return n + ' din ' + total + ' deblocate'; },
    vocab:'Vocabular', grammar:'Gramatică', sentences:'Propoziții', listening:'Ascultare',
    speaking:'Vorbire', reading:'Citire', writing:'Scriere',
    noData:'—',
    streakAch:function(n){ return n + ' zile la rând'; },
    modeTitle:'MOD DE ÎNVĂȚARE',
    modeCurrent:{student:'🎒 Mod Elev', adult:'🌿 Mod Adult'},
    modeHint:'Progresul, XP-ul și streak-ul rămân neschimbate.',
    modeSwitchBtn:{student:'Comută la Adult →', adult:'Comută la Elev →'}
  },
  en:{
    streakLbl:'Streak', coinsLbl:'Coins', pickPersona:'Pick your style →',
    skillsTitle:'Skills', achTitle:'Achievements',
    achCount:function(n,total){ return n + ' of ' + total + ' unlocked'; },
    vocab:'Vocabulary', grammar:'Grammar', sentences:'Sentences', listening:'Listening',
    speaking:'Speaking', reading:'Reading', writing:'Writing',
    noData:'—',
    streakAch:function(n){ return n + '-day streak'; },
    modeTitle:'LEARNING MODE',
    modeCurrent:{student:'🎒 Student Mode', adult:'🌿 Adult Mode'},
    modeHint:'Your progress, XP, and streak stay exactly the same.',
    modeSwitchBtn:{student:'Switch to Adult →', adult:'Switch to Student →'}
  }
};
function L(){ return UI[LANG]; }

var PERSONAS = {
  cafe:{icon:'☕', ro:'Café Korean', en:'Café Korean'},
  kpop:{icon:'🎤', ro:'K-Pop Korean', en:'K-Pop Korean'},
  travel:{icon:'✈️', ro:'Travel Korean', en:'Travel Korean'},
  business:{icon:'💼', ro:'Business Korean', en:'Business Korean'},
  drama:{icon:'🎬', ro:'K-Drama Korean', en:'K-Drama Korean'},
  conversation:{icon:'🗣', ro:'Conversation Korean', en:'Conversation Korean'}
};

function skillPct(stats, types){
  var total = 0, correct = 0;
  types.forEach(function(t){
    var bt = stats.byType && stats.byType[t];
    if(bt){ total += bt.total; correct += bt.correct; }
  });
  return { total: total, correct: correct, pct: total ? Math.round(correct / total * 100) : 0 };
}

// Total counts for static content pools (mirrors the fixed data sets in
// reading-texts.json / composition-prompts.json — not fetched here to
// avoid pulling a quarter-megabyte JSON file just to read its length).
var READING_TEXTS_TOTAL = 24;
var COMPOSITION_PROMPTS_TOTAL = 9;

function speakingSkill(){
  var scores = RKStorage.get('RK_CONV_SCORES', {});
  var correct = 0, total = 0;
  Object.keys(scores).forEach(function(id){
    var e = scores[id];
    if(e && typeof e === 'object' && typeof e.total === 'number'){
      correct += e.correct; total += e.total;
    }
  });
  return { total: total, correct: correct, pct: total ? Math.round(correct / total * 100) : 0 };
}

function readingSkill(){
  var read = RKStorage.get('RK_RD_READ', []);
  var n = Array.isArray(read) ? read.length : 0;
  return { total: READING_TEXTS_TOTAL, correct: n, pct: Math.round(n / READING_TEXTS_TOTAL * 100) };
}

function writingSkill(){
  var comps = RKStorage.get('RK_COMPOSITIONS', {});
  var n = Object.keys(comps).filter(function(id){ return comps[id] && comps[id].everCompleted; }).length;
  return { total: COMPOSITION_PROMPTS_TOTAL, correct: n, pct: Math.round(n / COMPOSITION_PROMPTS_TOTAL * 100) };
}

function renderSkillRow(label, data){
  var l = L();
  var countText = data.total ? (data.correct + '/' + data.total) : l.noData;
  return '<div class="pf-skill">' +
    '<div class="pf-skill-head"><span>' + label + '</span><span class="pf-skill-count">' + countText + '</span></div>' +
    '<div class="pf-bar-bg"><div class="pf-bar" style="width:' + data.pct + '%"></div></div>' +
  '</div>';
}

function render(){
  var l = L();
  document.getElementById('btnRo').classList.toggle('active', LANG === 'ro');
  document.getElementById('btnEn').classList.toggle('active', LANG === 'en');
  document.getElementById('pfStreakLbl').textContent = l.streakLbl;
  document.getElementById('pfCoinsLbl').textContent = l.coinsLbl;
  document.getElementById('skillsTitle').textContent = l.skillsTitle;
  document.getElementById('achTitle').textContent = l.achTitle;
  RKNav.setLang(LANG);

  var streak = window.RKStreak ? RKStreak.get() : {days:0};
  var xpData = window.RKGamification ? RKGamification.getXPData() : {total:0};
  var coins = window.RKGamification ? RKGamification.getCoins() : 0;
  var lvl = window.RKGamification ? RKGamification.getLevelInfo(xpData.total) : {current:{level:1}};
  var levelTitle = lvl.current ? (LANG === 'ro' ? lvl.current.title_ro : lvl.current.title_en) : '';

  document.getElementById('pfLevel').textContent = 'Lv.' + lvl.current.level + ' · ' + levelTitle;
  document.getElementById('pfStreak').textContent = '🔥' + streak.days;
  document.getElementById('pfXp').textContent = xpData.total;
  document.getElementById('pfCoins').textContent = '🪙' + coins;

  var personaId = localStorage.getItem('RK_PERSONA');
  var persona = personaId && PERSONAS[personaId];
  var personaEl = document.getElementById('pfPersona');
  if(persona){
    personaEl.textContent = persona.icon + ' ' + persona[LANG];
    personaEl.classList.remove('empty');
  } else {
    personaEl.textContent = l.pickPersona;
    personaEl.classList.add('empty');
  }

  // ── SKILLS (all computed from RK_STATS.byType, shared by exercises/flashcards/listening) ──
  var stats = RKStorage.get('RK_STATS', { byType:{} });
  var vocab    = skillPct(stats, ['ko-ro','ro-ko']);
  var grammar  = skillPct(stats, ['particle','particlePlus','conjug']);
  var sentences = skillPct(stats, ['puzzle','chain']);
  var listening = skillPct(stats, ['listening']);
  var speaking = speakingSkill();
  var reading  = readingSkill();
  var writing  = writingSkill();

  document.getElementById('skillsBody').innerHTML =
    renderSkillRow(l.vocab, vocab) +
    renderSkillRow(l.grammar, grammar) +
    renderSkillRow(l.sentences, sentences) +
    renderSkillRow(l.listening, listening) +
    renderSkillRow(l.speaking, speaking) +
    renderSkillRow(l.reading, reading) +
    renderSkillRow(l.writing, writing);

  // ── ACHIEVEMENTS (badges + streak milestones already tracked by gamification.js/streak.js) ──
  var earnedBadges = window.RKGamification ? RKGamification.getEarnedBadges() : [];
  var badgeDefs = window.RKGamification ? RKGamification.BADGE_DEFS : [];
  var earnedMilestones = window.RKStreak ? RKStreak.getEarnedMilestones() : [];
  var allMilestones = window.RKStreak ? RKStreak.MILESTONES : [];

  var tiles = badgeDefs.map(function(b){
    var unlocked = earnedBadges.indexOf(b.id) !== -1;
    return { icon: unlocked ? b.icon : '🔒', title: LANG === 'ro' ? b.title_ro : b.title_en, unlocked: unlocked };
  }).concat(allMilestones.map(function(days){
    var unlocked = earnedMilestones.indexOf(days) !== -1;
    return { icon: unlocked ? '🔥' : '🔒', title: l.streakAch(days), unlocked: unlocked };
  }));

  var unlockedCount = tiles.filter(function(t){ return t.unlocked; }).length;
  document.getElementById('achCount').textContent = l.achCount(unlockedCount, tiles.length);
  document.getElementById('achGrid').innerHTML = tiles.map(function(t){
    return '<div class="pf-ach' + (t.unlocked ? '' : ' locked') + '">' +
      '<div class="pf-ach-icon">' + t.icon + '</div>' +
      '<div class="pf-ach-title">' + t.title + '</div>' +
    '</div>';
  }).join('');

  // ── LEARNING MODE (audience) switch — flips RK_AUDIENCE only, nothing else ──
  var audience = localStorage.getItem('RK_AUDIENCE') === 'student' ? 'student' : 'adult';
  document.getElementById('modeTitle').textContent = l.modeTitle;
  document.getElementById('modeCurrent').textContent = l.modeCurrent[audience];
  document.getElementById('modeHint').textContent = l.modeHint;
  document.getElementById('modeSwitchBtn').textContent = l.modeSwitchBtn[audience];
}

document.getElementById('modeSwitchBtn').addEventListener('click', function(){
  var current = localStorage.getItem('RK_AUDIENCE') === 'student' ? 'student' : 'adult';
  localStorage.setItem('RK_AUDIENCE', current === 'student' ? 'adult' : 'student');
  render();
});

document.getElementById('btnRo').addEventListener('click', function(){ LANG = 'ro'; localStorage.setItem('RK_LANG','ro'); render(); });
document.getElementById('btnEn').addEventListener('click', function(){ LANG = 'en'; localStorage.setItem('RK_LANG','en'); render(); });

(function initTheme(){
  var theme = localStorage.getItem('RK_THEME');
  var isDark = theme === 'dark' || theme === null;
  document.body.classList.toggle('dark-mode', isDark);
  document.getElementById('darkToggle').textContent = isDark ? '☀️' : '🌙';
})();
document.getElementById('darkToggle').addEventListener('click', function(){
  var nowDark = !document.body.classList.contains('dark-mode');
  document.body.classList.toggle('dark-mode', nowDark);
  localStorage.setItem('RK_THEME', nowDark ? 'dark' : 'light');
  document.getElementById('darkToggle').textContent = nowDark ? '☀️' : '🌙';
});

render();
</script>
<script src="./js/core/register-sw.js"></script>
</body>
</html>
