<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raluca Korean — Profil</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#7c3aed">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./theme-anime.css">
<style>
/* ── HEADER ───────────────────────────────────────────── */
.pf-head{text-align:center;padding:24px 16px 20px}
.pf-avatar{font-size:52px;line-height:1}
.pf-level{font-size:19px;font-weight:900;color:var(--rk-heading);margin-top:8px}
.pf-persona{font-size:12px;color:var(--rk-muted);margin-top:4px;font-weight:700}
.pf-persona.empty{color:var(--rk-muted-ui);text-decoration:none}

.pf-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.pf-stat{background:var(--rk-bg-flat);border-radius:14px;padding:12px 8px}
.pf-stat-val{font-size:18px;font-weight:900;color:var(--rk-heading)}
.pf-stat-lbl{font-size:10px;color:var(--rk-muted);margin-top:2px;font-weight:600}

/* ── SKILLS ───────────────────────────────────────────── */
.pf-skill{margin-bottom:14px}
.pf-skill:last-child{margin-bottom:0}
.pf-skill-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:800;color:var(--rk-heading);margin-bottom:6px}
.pf-skill-count{font-size:11px;font-weight:600;color:var(--rk-muted)}
.pf-bar-bg{height:10px;background:rgba(0,0,0,.07);border-radius:6px;overflow:hidden}
body.dark-mode .pf-bar-bg{background:rgba(255,255,255,.09)}
.pf-bar{height:100%;border-radius:6px;background:linear-gradient(90deg,#db2777,#7c3aed);transition:width .8s cubic-bezier(.4,0,.2,1)}

/* ── ACHIEVEMENTS ─────────────────────────────────────── */
.pf-ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.pf-ach{
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:12px 6px;border-radius:12px;
  background:var(--rk-bg-flat);border:1px solid var(--rk-stroke);
}
.pf-ach.locked{opacity:.4}
.pf-ach-icon{font-size:26px}
.pf-ach-title{font-size:10px;font-weight:700;color:var(--rk-heading);line-height:1.3}
.pf-ach-count{font-size:11px;color:var(--rk-muted-ui);text-align:center;margin-top:8px}
</style>
</head>
<body class="theme-anime">
<div class="app">

<div class="card">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
    <div>
      <h1 id="pageTitle">👤 Profil</h1>
      <div class="sub" id="pageSubtitle">Călătoria ta coreeană, într-un singur loc</div>
    </div>
    <div id="pageControls"></div>
  </div>
</div>

<div class="card pf-head">
  <div class="pf-avatar" id="pfAvatar">👤</div>
  <div class="pf-level" id="pfLevel"></div>
  <a href="index.html" class="pf-persona" id="pfPersona"></a>
  <div class="pf-stats">
    <div class="pf-stat"><div class="pf-stat-val" id="pfStreak"></div><div class="pf-stat-lbl" id="pfStreakLbl"></div></div>
    <div class="pf-stat"><div class="pf-stat-val" id="pfXp"></div><div class="pf-stat-lbl">XP</div></div>
    <div class="pf-stat"><div class="pf-stat-val" id="pfCoins"></div><div class="pf-stat-lbl" id="pfCoinsLbl"></div></div>
  </div>
</div>

<div class="card">
  <h3 id="skillsTitle" style="margin:0 0 14px"></h3>
  <div id="skillsBody"></div>
</div>

<div class="card">
  <h3 id="achTitle" style="margin:0 0 4px"></h3>
  <div class="pf-ach-count" id="achCount" style="text-align:left;margin-top:0;margin-bottom:12px"></div>
  <div class="pf-ach-grid" id="achGrid"></div>
</div>

</div><!-- /app -->

<script src="./js/core/storage.js"></script>
<script src="./js/core/gamification.js"></script>
<script src="./js/core/streak.js"></script>
<script src="./js/core/lang-picker.js"></script>
<script>
'use strict';

var LANG = RKLang.get();
var UI = {
  ro:{
    title:'👤 Profil', sub:'Călătoria ta coreeană, într-un singur loc',
    streakLbl:'Streak', coinsLbl:'Monede', pickPersona:'Alege stilul tău →',
    skillsTitle:'Abilități', achTitle:'Realizări',
    achCount:function(n,total){ return n + ' din ' + total + ' deblocate'; },
    vocab:'Vocabular', grammar:'Gramatică', sentences:'Propoziții', listening:'Ascultare',
    noData:'—',
    streakAch:function(n){ return n + ' zile la rând'; }
  },
  en:{
    title:'👤 Profile', sub:'Your Korean journey, in one place',
    streakLbl:'Streak', coinsLbl:'Coins', pickPersona:'Pick your style →',
    skillsTitle:'Skills', achTitle:'Achievements',
    achCount:function(n,total){ return n + ' of ' + total + ' unlocked'; },
    vocab:'Vocabulary', grammar:'Grammar', sentences:'Sentences', listening:'Listening',
    noData:'—',
    streakAch:function(n){ return n + '-day streak'; }
  }
};
function L(){ return UI[LANG]; }

var PERSONAS = {
  cafe:{icon:'☕', ro:'Café Korean', en:'Café Korean'},
  kpop:{icon:'🎤', ro:'K-Pop Korean', en:'K-Pop Korean'},
  travel:{icon:'✈️', ro:'Travel Korean', en:'Travel Korean'},
  business:{icon:'💼', ro:'Business Korean', en:'Business Korean'},
  drama:{icon:'🎬', ro:'K-Drama Korean', en:'K-Drama Korean'},
  conversation:{icon:'🗣', ro:'Conversation Korean', en:'Conversation Korean'}
};

function skillPct(stats, types){
  var total = 0, correct = 0;
  types.forEach(function(t){
    var bt = stats.byType && stats.byType[t];
    if(bt){ total += bt.total; correct += bt.correct; }
  });
  return { total: total, correct: correct, pct: total ? Math.round(correct / total * 100) : 0 };
}

function renderSkillRow(label, data){
  var l = L();
  var countText = data.total ? (data.correct + '/' + data.total) : l.noData;
  return '<div class="pf-skill">' +
    '<div class="pf-skill-head"><span>' + label + '</span><span class="pf-skill-count">' + countText + '</span></div>' +
    '<div class="pf-bar-bg"><div class="pf-bar" style="width:' + data.pct + '%"></div></div>' +
  '</div>';
}

function render(){
  var l = L();
  document.getElementById('pageTitle').textContent = l.title;
  document.getElementById('pageSubtitle').textContent = l.sub;
  document.getElementById('pfStreakLbl').textContent = l.streakLbl;
  document.getElementById('pfCoinsLbl').textContent = l.coinsLbl;
  document.getElementById('skillsTitle').textContent = l.skillsTitle;
  document.getElementById('achTitle').textContent = l.achTitle;

  var streak = window.RKStreak ? RKStreak.get() : {days:0};
  var xpData = window.RKGamification ? RKGamification.getXPData() : {total:0};
  var coins = window.RKGamification ? RKGamification.getCoins() : 0;
  var lvl = window.RKGamification ? RKGamification.getLevelInfo(xpData.total) : {current:{level:1}};
  var levelTitle = lvl.current ? (LANG === 'ro' ? lvl.current.title_ro : lvl.current.title_en) : '';

  document.getElementById('pfLevel').textContent = 'Lv.' + lvl.current.level + ' · ' + levelTitle;
  document.getElementById('pfStreak').textContent = '🔥' + streak.days;
  document.getElementById('pfXp').textContent = xpData.total;
  document.getElementById('pfCoins').textContent = '🪙' + coins;

  var personaId = localStorage.getItem('RK_PERSONA');
  var persona = personaId && PERSONAS[personaId];
  var personaEl = document.getElementById('pfPersona');
  if(persona){
    personaEl.textContent = persona.icon + ' ' + persona[LANG];
    personaEl.classList.remove('empty');
  } else {
    personaEl.textContent = l.pickPersona;
    personaEl.classList.add('empty');
  }

  // ── SKILLS (all computed from RK_STATS.byType, shared by exercises/flashcards/listening) ──
  var stats = RKStorage.get('RK_STATS', { byType:{} });
  var vocab    = skillPct(stats, ['ko-ro','ro-ko']);
  var grammar  = skillPct(stats, ['particle','particlePlus','conjug']);
  var sentences = skillPct(stats, ['puzzle','chain']);
  var listening = skillPct(stats, ['listening']);

  document.getElementById('skillsBody').innerHTML =
    renderSkillRow(l.vocab, vocab) +
    renderSkillRow(l.grammar, grammar) +
    renderSkillRow(l.sentences, sentences) +
    renderSkillRow(l.listening, listening);

  // ── ACHIEVEMENTS (badges + streak milestones already tracked by gamification.js/streak.js) ──
  var earnedBadges = window.RKGamification ? RKGamification.getEarnedBadges() : [];
  var badgeDefs = window.RKGamification ? RKGamification.BADGE_DEFS : [];
  var earnedMilestones = window.RKStreak ? RKStreak.getEarnedMilestones() : [];
  var allMilestones = window.RKStreak ? RKStreak.MILESTONES : [];

  var tiles = badgeDefs.map(function(b){
    var unlocked = earnedBadges.indexOf(b.id) !== -1;
    return { icon: unlocked ? b.icon : '🔒', title: LANG === 'ro' ? b.title_ro : b.title_en, unlocked: unlocked };
  }).concat(allMilestones.map(function(days){
    var unlocked = earnedMilestones.indexOf(days) !== -1;
    return { icon: unlocked ? '🔥' : '🔒', title: l.streakAch(days), unlocked: unlocked };
  }));

  var unlockedCount = tiles.filter(function(t){ return t.unlocked; }).length;
  document.getElementById('achCount').textContent = l.achCount(unlockedCount, tiles.length);
  document.getElementById('achGrid').innerHTML = tiles.map(function(t){
    return '<div class="pf-ach' + (t.unlocked ? '' : ' locked') + '">' +
      '<div class="pf-ach-icon">' + t.icon + '</div>' +
      '<div class="pf-ach-title">' + t.title + '</div>' +
    '</div>';
  }).join('');
}

RKLang.init(function(lang){ LANG = lang; render(); });
render();
</script>
<script src="./js/core/dark-mode.js"></script>
<script src="./js/core/register-sw.js"></script>
<script src="./js/core/page-help.js"></script>
</body>
</html>
