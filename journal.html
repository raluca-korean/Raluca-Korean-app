<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raluca Korean — Jurnal</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#58cc02">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./theme-anime.css">
<link rel="stylesheet" href="./journal.css">
</head>
<body class="theme-anime">
<div class="app">

<!-- ══ HEADER ══════════════════════════════════════════ -->
<div class="card hdr">
  <div class="hdr-left">
    <h1 id="pageTitle">Jurnal</h1>
    <div class="sub" id="pageSub">Scrie liber în coreeană, în fiecare zi</div>
  </div>
  <div class="hdr-right">
    <div id="pageControls"></div>
  </div>
</div>

<!-- ══ STREAK ══════════════════════════════════════════ -->
<div class="streak-strip" id="streakStrip"></div>

<!-- ══ PROMPT ══════════════════════════════════════════ -->
<div class="prompt-card">
  <div class="prompt-label" id="promptLabel">Subiectul zilei</div>
  <div class="prompt-text" id="promptText">...</div>
</div>

<!-- ══ STARTER CHIPS ═══════════════════════════════════ -->
<div class="chip-row" id="chipRow"></div>

<!-- ══ WRITE AREA ══════════════════════════════════════ -->
<textarea class="journal-textarea" id="journalText" placeholder="Scrie aici, în coreeană..."></textarea>
<div class="meta-row">
  <span id="metaCount">0</span>
</div>
<div class="save-row">
  <button class="save-btn" id="saveBtn">💾 Salvează</button>
  <span class="save-status" id="saveStatus">✅ Salvat!</span>
</div>

<!-- ══ HISTORY ═════════════════════════════════════════ -->
<div class="history-title" id="historyTitle">Jurnalul tău</div>
<div id="historyList"></div>

</div><!-- /app -->

<script src="./js/core/storage.js"></script>
<script src="./js/core/lang-picker.js"></script>
<script src="./js/core/gamification.js"></script>
<script src="./js/core/streak.js"></script>
<script src="./js/core/utils.js"></script>
<script src="./js/journal.js"></script>

<script src="./js/core/dark-mode.js"></script>
<script src="./js/core/seoul-bg.js"></script>
<script src="./js/core/register-sw.js"></script>
<script src="./js/core/page-help.js"></script>
</body>
</html>
