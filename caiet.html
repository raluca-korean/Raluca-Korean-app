<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raluca Korean — Caiet</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#7c3aed">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./theme-anime.css">
<link rel="stylesheet" href="./caiet.css">
</head>
<body class="theme-anime">
<div class="app">

<!-- ══ HEADER ══════════════════════════════════════════ -->
<div class="card hdr">
  <div class="hdr-left">
    <h1 id="pageTitle">Caiet coreean</h1>
    <div class="sub" id="pageSub">Liniatură specifică pentru exersat scrisul de mână</div>
  </div>
  <div class="hdr-right">
    <div id="pageControls"></div>
  </div>
</div>

<!-- ══ LEVEL SELECTOR ══════════════════════════════════ -->
<div class="card lvl-card">
  <div class="lvl-label" id="lvlLabel">Mărime liniatură pentru pagina nouă</div>
  <div class="lvl-row" id="lvlRow">
    <button type="button" class="lvl-btn" data-level="large">
      <span class="lvl-swatch lvl-swatch-large" aria-hidden="true"></span>
      <span class="lvl-name" id="lvlNameLarge">Mare · Începător</span>
    </button>
    <button type="button" class="lvl-btn" data-level="medium">
      <span class="lvl-swatch lvl-swatch-medium" aria-hidden="true"></span>
      <span class="lvl-name" id="lvlNameMedium">Medie</span>
    </button>
    <button type="button" class="lvl-btn" data-level="small">
      <span class="lvl-swatch lvl-swatch-small" aria-hidden="true"></span>
      <span class="lvl-name" id="lvlNameSmall">Mică · Scrii mai mult</span>
    </button>
  </div>
</div>

<!-- ══ GLOBAL ACTIONS ══════════════════════════════════ -->
<div class="nb-actions">
  <button type="button" class="nb-act nb-act-primary" id="btnAddPage">
    <span id="btnAddPageLbl">+ Pagină nouă</span>
  </button>
  <button type="button" class="nb-act" id="btnPrint">
    <span id="btnPrintLbl">🖨 Printează</span>
  </button>
</div>

<!-- ══ NOTEBOOK PAGES ══════════════════════════════════ -->
<div id="notebookPages" class="nb-pages"></div>

<div class="nb-hint" id="nbHint">
  Scrie direct pe pagină cu mouse-ul, degetul sau un stylus. Fiecare căsuță are un ghidaj punctat în cruce, ca în caietele coreene reale, ca să poți poziționa corect componentele silabei.
</div>

</div><!-- /app -->

<script src="./js/core/storage.js"></script>
<script src="./js/core/lang-picker.js"></script>
<script src="./js/core/gamification.js"></script>
<script src="./js/core/streak.js"></script>
<script src="./js/caiet.js"></script>

<script src="./js/core/dark-mode.js"></script>
<script src="./js/core/register-sw.js"></script>
<script src="./js/core/page-help.js"></script>
</body>
</html>
