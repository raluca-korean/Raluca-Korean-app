<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raluca Korean — Play</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#7c3aed">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./theme-anime.css">
<style>
.pl-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){ .pl-grid{grid-template-columns:1fr} }
.pl-card{
  display:flex;flex-direction:column;gap:6px;padding:18px 16px;border-radius:16px;text-decoration:none;
  background:var(--rk-card);border:2px solid var(--rk-stroke);border-bottom:4px solid var(--rk-stroke-b);
  box-shadow:0 4px 14px var(--rk-shadow);transition:transform .12s,border-color .15s;
}
.pl-card:hover{transform:translateY(-2px);border-color:rgba(124,58,237,.35)}
.pl-card-icon{font-size:34px;line-height:1}
.pl-card-title{font-size:15px;font-weight:800;color:var(--rk-heading)}
.pl-card-sub{font-size:12px;color:var(--rk-muted)}
.app{padding-bottom:80px}
.pl-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;
  background:var(--rk-card);border-top:1px solid var(--rk-stroke);padding:8px 4px calc(8px + env(safe-area-inset-bottom));
}
.pl-nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--rk-muted-ui);font-size:10px;font-weight:700;padding:4px 10px;border-radius:10px}
.pl-nav-item.active{color:#7c3aed}
.pl-nav-icon{font-size:18px}
</style>
</head>
<body class="theme-anime">
<div class="app">

<div class="card">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
    <div>
      <h1 id="pageTitle">🎮 Play</h1>
      <div class="sub" id="pageSubtitle">Alege un tip de joc</div>
    </div>
    <div id="pageControls"></div>
  </div>
</div>

<div class="card">
  <div class="pl-grid" id="playGrid"></div>
</div>

</div><!-- /app -->

<nav class="pl-nav">
  <a href="index.html" class="pl-nav-item"><span class="pl-nav-icon">🏠</span><span id="navHome">Home</span></a>
  <a href="learn.html" class="pl-nav-item"><span class="pl-nav-icon">📚</span><span id="navLearn">Learn</span></a>
  <a href="play.html" class="pl-nav-item active"><span class="pl-nav-icon">🎯</span><span id="navPractice">Practice</span></a>
  <a href="reading.html" class="pl-nav-item"><span class="pl-nav-icon">🗣️</span><span id="navSpeak">Speak</span></a>
  <a href="profile.html" class="pl-nav-item"><span class="pl-nav-icon">👤</span><span id="navProgress">Progress</span></a>
</nav>

<script src="./js/core/storage.js"></script>
<script src="./js/core/lang-picker.js"></script>
<script>
'use strict';

var LANG = RKLang.get();
var UI = {
  ro:{
    title:'🎮 Play', sub:'Alege un tip de joc',
    games:[
      {icon:'⚡', href:'quick60.html', title:'Quick 60', sub:'60 de secunde, cât de multe rezolvi?'},
      {icon:'🧠', href:'memory.html', title:'Memory', sub:'Ține minte cuvântul înainte să dispară'},
      {icon:'🎧', href:'listening.html', title:'Listen', sub:'Ascultă și alege răspunsul corect'},
      {icon:'🧩', href:'builder.html', title:'Build', sub:'Construiește propoziția — Sentence Challenge'},
      {icon:'🎯', href:'exercises.html?type=particle', title:'Particle Master', sub:'은/는, 이/가, 을/를, 에, 에서...'},
      {icon:'🗣', href:'reading.html', title:'Speak', sub:'Citește cu voce tare și înregistrează-te'},
      {icon:'👑', href:'boss.html', title:'Boss', sub:'Provocarea finală pentru fiecare structură'},
      {icon:'💬', href:'conversation.html', title:'Conversații', sub:'50 de situații reale — restaurant, aeroport, metrou...'},
      {icon:'✦', href:'stories.html', title:'Stories', sub:'19 povești pe episoade, cu practică și recompensă'},
      {icon:'🧠', href:'review.html', title:'Smart Review', sub:'Ce ai uitat, prioritizat automat'},
      {icon:'🎯', href:'today.html', title:'Daily Challenge', sub:'Misiunea ta de azi'},
      {icon:'❌', href:'mistakes.html', title:'Mistakes', sub:'Greșelile tale, ca să nu le mai repeți'},
      {icon:'✍️', href:'composition.html', title:'Compunere', sub:'Scrie texte scurte în coreeană'},
      {icon:'📔', href:'journal.html', title:'Jurnal', sub:'Jurnalul tău personal în coreeană'}
    ]
  },
  en:{
    title:'🎮 Play', sub:'Choose a game type',
    games:[
      {icon:'⚡', href:'quick60.html', title:'Quick 60', sub:'60 seconds, how many can you solve?'},
      {icon:'🧠', href:'memory.html', title:'Memory', sub:'Remember the word before it disappears'},
      {icon:'🎧', href:'listening.html', title:'Listen', sub:'Listen and pick the right answer'},
      {icon:'🧩', href:'builder.html', title:'Build', sub:'Build the sentence — Sentence Challenge'},
      {icon:'🎯', href:'exercises.html?type=particle', title:'Particle Master', sub:'은/는, 이/가, 을/를, 에, 에서...'},
      {icon:'🗣', href:'reading.html', title:'Speak', sub:'Read aloud and record yourself'},
      {icon:'👑', href:'boss.html', title:'Boss', sub:'The final challenge for every structure'},
      {icon:'💬', href:'conversation.html', title:'Conversations', sub:'50 real-life situations — restaurant, airport, subway...'},
      {icon:'✦', href:'stories.html', title:'Stories', sub:'19 episodic stories with practice and rewards'},
      {icon:'🧠', href:'review.html', title:'Smart Review', sub:"What you've forgotten, auto-prioritized"},
      {icon:'🎯', href:'today.html', title:'Daily Challenge', sub:"Today's mission"},
      {icon:'❌', href:'mistakes.html', title:'Mistakes', sub:"Your mistakes, so you don't repeat them"},
      {icon:'✍️', href:'composition.html', title:'Composition', sub:'Write short texts in Korean'},
      {icon:'📔', href:'journal.html', title:'Journal', sub:'Your personal journal in Korean'}
    ]
  }
};
function L(){ return UI[LANG]; }

var NAV_LABELS = {
  ro:{home:'Acasă', learn:'Învață', practice:'Practică', speak:'Vorbește', progress:'Progres'},
  en:{home:'Home', learn:'Learn', practice:'Practice', speak:'Speak', progress:'Progress'}
};

function render(){
  var l = L();
  document.getElementById('pageTitle').textContent = l.title;
  document.getElementById('pageSubtitle').textContent = l.sub;
  var nl = NAV_LABELS[LANG];
  document.getElementById('navHome').textContent = nl.home;
  document.getElementById('navLearn').textContent = nl.learn;
  document.getElementById('navPractice').textContent = nl.practice;
  document.getElementById('navSpeak').textContent = nl.speak;
  document.getElementById('navProgress').textContent = nl.progress;
  document.getElementById('playGrid').innerHTML = l.games.map(function(g){
    return '<a class="pl-card" href="' + g.href + '">' +
      '<div class="pl-card-icon">' + g.icon + '</div>' +
      '<div class="pl-card-title">' + g.title + '</div>' +
      '<div class="pl-card-sub">' + g.sub + '</div>' +
    '</a>';
  }).join('');
}

RKLang.init(function(lang){ LANG = lang; render(); });
render();
</script>
<script src="./js/core/dark-mode.js"></script>
<script src="./js/core/register-sw.js"></script>
<script src="./js/core/page-help.js"></script>
</body>
</html>
