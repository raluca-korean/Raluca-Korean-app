<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raluca Korean — Play</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1c4a3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./theme-anime.css">
<style>
.pl-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){ .pl-grid{grid-template-columns:1fr} }
.pl-card{
  display:flex;flex-direction:column;gap:6px;padding:18px 16px;border-radius:16px;text-decoration:none;
  background:var(--rk-card);border:2px solid var(--rk-stroke);border-bottom:4px solid var(--rk-stroke-b);
  box-shadow:0 4px 14px var(--rk-shadow);transition:transform .12s,border-color .15s;
}
.pl-card:hover{transform:translateY(-2px);border-color:rgba(28,74,58,.35)}
.pl-card-icon{font-size:34px;line-height:1}
.pl-card-title{font-size:15px;font-weight:800;color:var(--rk-heading)}
.pl-card-sub{font-size:12px;color:var(--rk-muted)}
.pl-surprise{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;font-family:inherit;
  padding:16px 18px;border-radius:16px;margin-bottom:12px;border:none;
  background:linear-gradient(135deg,#2f6b53,#1c4a3a);color:#fff;box-shadow:0 6px 18px rgba(28,74,58,.3);
}
.pl-surprise-icon{font-size:28px;flex-shrink:0}
.pl-surprise-title{font-size:15px;font-weight:900}
.pl-surprise-sub{font-size:12px;opacity:.85;margin-top:2px}
.app{padding-bottom:80px}

/* ── HERO (coral band, page-local override — theme-anime.css itself is
   untouched so every other page that imports it is unaffected) ── */
.card.pl-hero{
  background:#1c4a3a;
  border:none;color:#fff;
}
.card.pl-hero h1,.card.pl-hero .sub{color:#fff}
.card.pl-hero .sub{opacity:.85}
</style>
</head>
<body class="theme-anime">
<div class="app">

<div class="card pl-hero">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
    <div>
      <h1 id="pageTitle">🐯 Play</h1>
      <div class="sub" id="pageSubtitle">Alege un tip de joc</div>
    </div>
    <div id="pageControls"></div>
  </div>
</div>

<div class="card">
  <button class="pl-surprise" id="surpriseBtn" type="button" style="display:none">
    <span class="pl-surprise-icon">🎲</span>
    <span>
      <span class="pl-surprise-title" id="surpriseTitle"></span>
      <div class="pl-surprise-sub" id="surpriseSub"></div>
    </span>
  </button>
  <div class="pl-grid" id="playGrid"></div>
</div>

</div><!-- /app -->

<div id="rkBottomNav"></div>

<script src="./js/core/storage.js"></script>
<script src="./js/core/srs.js"></script>
<script src="./js/core/gamification.js"></script>
<script src="./js/core/lang-picker.js"></script>
<script src="./js/core/bottom-nav.js"></script>
<script>
'use strict';

var LANG = RKLang.get();
var AUDIENCE = localStorage.getItem('RK_AUDIENCE') || 'adult';
var UI = {
  ro:{
    title:'🐯 Play',
    sub: AUDIENCE === 'student' ? 'Alege o provocare' : 'Alege un tip de joc',
    surpriseTitle:'Surprinde-mă', surpriseSub:'Alegem noi ce exersezi azi, pe baza progresului tău real',
    games:[
      {icon:'⚡', href:'quick60.html', title:'Quick 60', sub:'60 de secunde, cât de multe rezolvi?'},
      {icon:'🧠', href:'memory.html', title:'Memory', sub:'Ține minte cuvântul înainte să dispară'},
      {icon:'🎧', href:'listening.html', title:'Listen', sub:'Ascultă și alege răspunsul corect'},
      {icon:'🧩', href:'builder.html', title:'Build', sub:'Construiește propoziția — Sentence Challenge'},
      {icon:'🎯', href:'exercises.html?type=particle', title:'Particle Master', sub:'은/는, 이/가, 을/를, 에, 에서...'},
      {icon:'🗣', href:'reading.html', title:'Speak', sub:'Citește cu voce tare și înregistrează-te'},
      {icon:'👑', href:'boss.html', title:'Boss', sub:'Provocarea finală pentru fiecare structură'},
      {icon:'💬', href:'conversation.html', title:'Conversații', sub:'50 de situații reale — restaurant, aeroport, metrou...'},
      {icon:'✦', href:'stories.html', title:'Stories', sub:'19 povești pe episoade, cu practică și recompensă'},
      {icon:'🧠', href:'review.html', title:'Smart Review', sub:'Ce ai uitat, prioritizat automat'},
      {icon:'🎯', href:'today.html', title:'Daily Challenge', sub:'Misiunea ta de azi'},
      {icon:'❌', href:'mistakes.html', title:'Mistakes', sub:'Greșelile tale, ca să nu le mai repeți'},
      {icon:'✍️', href:'composition.html', title:'Compunere', sub:'Scrie texte scurte în coreeană'},
      {icon:'📔', href:'journal.html', title:'Jurnal', sub:'Jurnalul tău personal în coreeană'}
    ]
  },
  en:{
    title:'🐯 Play',
    sub: AUDIENCE === 'student' ? 'Pick a challenge' : 'Choose a game type',
    surpriseTitle:'Surprise me', surpriseSub:"We'll pick what to practice today, based on your real progress",
    games:[
      {icon:'⚡', href:'quick60.html', title:'Quick 60', sub:'60 seconds, how many can you solve?'},
      {icon:'🧠', href:'memory.html', title:'Memory', sub:'Remember the word before it disappears'},
      {icon:'🎧', href:'listening.html', title:'Listen', sub:'Listen and pick the right answer'},
      {icon:'🧩', href:'builder.html', title:'Build', sub:'Build the sentence — Sentence Challenge'},
      {icon:'🎯', href:'exercises.html?type=particle', title:'Particle Master', sub:'은/는, 이/가, 을/를, 에, 에서...'},
      {icon:'🗣', href:'reading.html', title:'Speak', sub:'Read aloud and record yourself'},
      {icon:'👑', href:'boss.html', title:'Boss', sub:'The final challenge for every structure'},
      {icon:'💬', href:'conversation.html', title:'Conversations', sub:'50 real-life situations — restaurant, airport, subway...'},
      {icon:'✦', href:'stories.html', title:'Stories', sub:'19 episodic stories with practice and rewards'},
      {icon:'🧠', href:'review.html', title:'Smart Review', sub:"What you've forgotten, auto-prioritized"},
      {icon:'🎯', href:'today.html', title:'Daily Challenge', sub:"Today's mission"},
      {icon:'❌', href:'mistakes.html', title:'Mistakes', sub:"Your mistakes, so you don't repeat them"},
      {icon:'✍️', href:'composition.html', title:'Composition', sub:'Write short texts in Korean'},
      {icon:'📔', href:'journal.html', title:'Journal', sub:'Your personal journal in Korean'}
    ]
  }
};
function L(){ return UI[LANG]; }

/* ── ADULT "SURPRISE ME" ─────────────────────────────────────────
   Picks a real next activity from actual progress signals — never a
   literal random page. Weighted so more urgent/incomplete things come
   up more often, with just enough variety across repeat clicks. */
function dueCount(key){
  if(!window.RKSrs) return 0;
  var data = RKSrs.load(key);
  var now = Date.now();
  var n = 0;
  Object.keys(data).forEach(function(k){ if(data[k] && data[k].due <= now) n++; });
  return n;
}
function isDailyFlagDone(key){
  try {
    var d = JSON.parse(localStorage.getItem(key) || 'null');
    var today = new Date().toISOString().slice(0,10);
    return !!(d && d.date === today && d.done);
  } catch(e){ return false; }
}
function surpriseMe(){
  var pool = [];
  var add = function(href, weight){ for(var i=0;i<weight;i++) pool.push(href); };

  var dueTotal = dueCount('RK_FC_SRS') + dueCount('RK_HJ_SRS') + dueCount('RK_EX_SRS');
  if(dueTotal >= 5) add('review.html', 3);

  if(window.RKGamification){
    var goals = RKGamification.getDailyTaskGoals();
    var tasks = RKGamification.getDailyTasks();
    if(tasks.vocab < goals.vocab) add('exercises.html?type=ko-ro', 2);
    if(goals.grammar && tasks.grammar < goals.grammar) add('exercises.html?type=particle', 2);
    if(tasks.sentences < goals.sentences) add('exercises.html?type=puzzle', 2);
  }
  if(!isDailyFlagDone('RK_DAILY_LISTEN')) add('listening.html', 2);
  if(!isDailyFlagDone('RK_DAILY_PRON')) add('reading.html', 2);

  var stats = window.RKStorage ? RKStorage.get('RK_STATS', {byType:{}}) : {byType:{}};
  var weakest = null, weakestPct = 100;
  Object.keys(stats.byType || {}).forEach(function(t){
    var d = stats.byType[t];
    if(d && d.total >= 5){
      var pct = d.correct / d.total * 100;
      if(pct < weakestPct){ weakestPct = pct; weakest = t; }
    }
  });
  if(weakest && weakestPct < 70) add('exercises.html?type=' + weakest, 2);

  // Always-available variety fallback, kept light so it never dominates.
  add('conversation.html', 1);
  add('stories.html', 1);

  location.href = pool[Math.floor(Math.random() * pool.length)];
}

function render(){
  var l = L();
  document.getElementById('pageTitle').textContent = l.title;
  document.getElementById('pageSubtitle').textContent = l.sub;
  RKNav.setLang(LANG);
  document.getElementById('playGrid').innerHTML = l.games.map(function(g){
    return '<a class="pl-card" href="' + g.href + '">' +
      '<div class="pl-card-icon">' + g.icon + '</div>' +
      '<div class="pl-card-title">' + g.title + '</div>' +
      '<div class="pl-card-sub">' + g.sub + '</div>' +
    '</a>';
  }).join('');

  var surpriseBtn = document.getElementById('surpriseBtn');
  if(AUDIENCE === 'adult'){
    surpriseBtn.style.display = '';
    document.getElementById('surpriseTitle').textContent = l.surpriseTitle;
    document.getElementById('surpriseSub').textContent = l.surpriseSub;
  } else {
    surpriseBtn.style.display = 'none';
  }
}
document.getElementById('surpriseBtn').addEventListener('click', surpriseMe);

RKNav.init('practice');
RKLang.init(function(lang){ LANG = lang; render(); });
render();
</script>
<script src="./js/core/dark-mode.js"></script>
<script src="./js/core/register-sw.js"></script>
<script src="./js/core/page-help.js"></script>
</body>
</html>
