<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raluca Korean — Practică</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
<meta name="theme-color" content="#6C5CE7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Space+Grotesk:wght@500;600;700&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./theme-cyber-seoul.css">
<style>
:root{
  --bg:#FAF9F7; --card:#FFFFFF; --text:#202124; --text-mid:#6B6B73; --text-low:#9C9CA3;
  --border:#E7E5E1; --shadow:rgba(32,33,36,.07);
  --lavender:#6C5CE7; --lavender-soft:#EFEBFC; --pink:#E96A9A; --pink-soft:#FCE9F0;
  --forest:#6C5CE7; --gold:#F4C95D;
}
body.dark-mode{
  --bg:#101426; --card:#181D32; --text:#F7F4FA; --text-mid:#B8B9C5; --text-low:#7D7E93;
  --border:rgba(255,255,255,.08); --shadow:rgba(0,0,0,.35);
  --lavender:#8B7CFF; --lavender-soft:rgba(139,124,255,.16); --pink:#F17EAB; --pink-soft:rgba(241,126,171,.14);
  --forest:#8B7CFF; --gold:#F3CB69;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:104px}
button{font-family:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* ── TOPBAR (same as Home / Learn) ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 0 6px}
.brand{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:800;text-decoration:none;color:var(--text)}
.rk-logo{width:20px;height:20px;flex-shrink:0}
.rk-logo .gate{stroke:#6C5CE7}
.rk-logo .ascent{stroke:#F4C95D}
body.dark-mode .rk-logo .gate{stroke:#8B7CFF}
body.dark-mode .rk-logo .ascent{stroke:#F3CB69}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--text-mid)}
.topbar-actions{display:flex;align-items:center;gap:8px}
.lang{display:flex;border:1px solid var(--border);border-radius:20px;overflow:hidden;background:var(--card)}
.lang button{border:none;background:none;padding:7px 12px;font-size:11px;font-weight:800;color:var(--text-low);cursor:pointer}
.lang button.active{background:var(--forest);color:#fff}
.title{font-size:24px;font-weight:900;margin-top:14px}
.sub{font-size:13px;color:var(--text-mid);margin-top:4px}

/* ── SURPRISE HERO ── */
.hero{
  position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;width:100%;text-align:left;cursor:pointer;
  margin-top:18px;padding:22px 20px;border:none;border-radius:28px;color:#fff;
  background:
    radial-gradient(120% 90% at 100% 0%, rgba(244,201,93,.35) 0%, rgba(244,201,93,0) 55%),
    linear-gradient(140deg,#6C5CE7 0%,#8E6CF0 45%,#E96A9A 100%);
  box-shadow:0 14px 34px rgba(108,92,231,.35);transition:transform .12s ease;
}
.hero:active{transform:scale(.98)}
.hero::after{content:'연습';position:absolute;right:-4px;bottom:-20px;font-family:'Noto Sans KR',sans-serif;font-size:96px;font-weight:900;color:rgba(255,255,255,.09);pointer-events:none;line-height:1}
.hero-dice{width:62px;height:62px;border-radius:20px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0}
.hero:hover .hero-dice{animation:wobble .6s ease}
.hero-eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.hero-title{font-size:20px;font-weight:900;margin-top:3px}
.hero-sub{font-size:13px;opacity:.88;margin-top:3px}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(10deg)}}

/* ── REVIEW CARD ── */
.review{
  display:flex;align-items:center;gap:14px;margin-top:14px;padding:16px;border-radius:22px;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--border);box-shadow:0 4px 18px var(--shadow);
}
.review-ico{width:52px;height:52px;border-radius:16px;background:var(--pink-soft);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.review-body{flex:1;min-width:0}
.review-title{font-size:16px;font-weight:900}
.review-sub{font-size:12px;color:var(--text-mid);margin-top:2px}
.review-count{min-width:44px;padding:8px 10px;border-radius:14px;text-align:center;font-size:18px;font-weight:900;color:#fff;background:var(--pink);flex-shrink:0}
.review-count.zero{background:var(--lavender-soft);color:var(--lavender);font-size:16px}

/* ── MAIN GAMES: 2×2 colored tiles ── */
.sec-title{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-low);margin:26px 4px 12px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{
  position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;min-height:150px;
  padding:16px;border-radius:24px;text-decoration:none;color:#fff;
  box-shadow:0 8px 22px var(--shadow);transition:transform .15s ease;
  animation:tileIn .45s cubic-bezier(.2,.8,.2,1) both;
}
.game:hover{transform:translateY(-3px)}
.game:active{transform:scale(.97)}
.game-ico{position:absolute;top:14px;left:16px;font-size:34px;line-height:1}
.game-kr{position:absolute;right:-6px;top:-8px;font-family:'Noto Sans KR',sans-serif;font-size:64px;font-weight:900;color:rgba(255,255,255,.13);line-height:1}
.game-title{font-size:17px;font-weight:900}
.game-sub{font-size:12px;opacity:.9;margin-top:3px;line-height:1.35}
.g1{background:linear-gradient(150deg,#F4A340,#E9692C)}
.g2{background:linear-gradient(150deg,#3FB8C9,#2F7FC1)}
.g3{background:linear-gradient(150deg,#8E6CF0,#6C5CE7)}
.g4{background:linear-gradient(150deg,#F17EAB,#D9548A)}
@keyframes tileIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── MORE: small chips ── */
.more{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:flex;align-items:center;gap:6px;padding:9px 13px;border-radius:999px;text-decoration:none;
  background:var(--card);border:1px solid var(--border);font-size:13px;font-weight:700;color:var(--text);
  box-shadow:0 2px 8px var(--shadow);
}
.chip:hover{border-color:var(--lavender)}
.explore{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:20px;padding:12px;font-size:12px;font-weight:700;color:var(--text-mid);text-decoration:none;border:1px dashed var(--border);border-radius:14px}

@media (prefers-reduced-motion: reduce){ .game,.hero:hover .hero-dice{animation:none} }
</style>
</head>
<body class="theme-anime">

<div class="wrap">
  <div class="topbar">
    <a href="index.html" class="brand">←
      <svg class="rk-logo" viewBox="0 0 48 48" fill="none" aria-hidden="true" focusable="false">
        <path class="gate" d="M10 34V20c0-6 4-10 10-10h8c6 0 10 4 10 10v14" stroke-width="4.4" stroke-linecap="round"/>
        <path class="ascent" d="M15 34 24 20l9 14" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Raluca Korean</a>
    <div class="topbar-actions">
      <div class="lang">
        <button id="btnRo" type="button">RO</button>
        <button id="btnEn" type="button">EN</button>
      </div>
      <button class="icon-btn" id="cyberToggle" type="button" aria-label="Toggle Cyber Seoul theme">⚡</button>
      <button class="icon-btn" id="darkToggle" type="button" aria-label="Toggle dark mode">🌙</button>
    </div>
  </div>

  <div class="title" id="pageTitle"></div>
  <div class="sub" id="pageSubtitle"></div>

  <button class="hero" id="surpriseBtn" type="button">
    <span class="hero-dice">🎲</span>
    <span>
      <div class="hero-eyebrow" id="surpriseEyebrow"></div>
      <div class="hero-title" id="surpriseTitle"></div>
      <div class="hero-sub" id="surpriseSub"></div>
    </span>
  </button>

  <a class="review" href="review.html">
    <span class="review-ico">🧠</span>
    <span class="review-body">
      <div class="review-title" id="reviewTitle"></div>
      <div class="review-sub" id="reviewSub"></div>
    </span>
    <span class="review-count" id="reviewCount">0</span>
  </a>

  <div class="sec-title" id="gamesTitle"></div>
  <div class="games" id="games"></div>

  <div class="sec-title" id="moreTitle"></div>
  <div class="more" id="more"></div>

  <a class="explore" href="explore.html" id="exploreLink"></a>
</div>

<div id="rkBottomNav"></div>

<script src="./js/core/storage.js"></script>
<script src="./js/core/srs.js"></script>
<script src="./js/core/gamification.js"></script>
<script src="./js/core/bottom-nav.js"></script>
<script src="./js/core/dark-mode.js"></script>
<script src="./js/core/visual-theme.js"></script>
<script>
'use strict';

var LANG = localStorage.getItem('RK_LANG') || 'ro';
var AUDIENCE = localStorage.getItem('RK_AUDIENCE') || 'adult';
if(AUDIENCE === 'student') document.body.classList.add('audience-student');
RKNav.init('practice');

var UI = {
  ro:{
    title:'Practică', sub: AUDIENCE === 'student' ? 'Alege o provocare 🎮' : 'Alege ce exersezi azi',
    surpriseEyebrow:'NU ȘTII CE SĂ ALEGI?', surpriseTitle:'Surprinde-mă', surpriseSub:'Alegem noi, după progresul tău',
    reviewTitle:'Recapitulare', reviewSub:function(n){ return n ? 'Cuvinte și greșeli de reluat azi' : 'Totul e la zi — poți relua greșelile'; },
    gamesTitle:'JOCURI', moreTitle:'MAI MULTE',
    games:[
      {cls:'g1', icon:'⚡', kr:'빨리', href:'quick60.html', title:'Quick 60', sub:'60 de secunde, cât rezolvi?'},
      {cls:'g2', icon:'🎧', kr:'듣기', href:'listening.html', title:'Ascultă', sub:'Auzi și alegi răspunsul'},
      {cls:'g3', icon:'🧩', kr:'문장', href:'builder.html', title:'Construiește', sub:'Propoziții din cuvinte'},
      {cls:'g4', icon:'💬', kr:'대화', href:'conversation.html', title:'Conversații', sub:'Restaurant, metrou, aeroport…'}
    ],
    more:[
      {icon:'✦', href:'stories.html', title:'Povești'},
      {icon:'🧠', href:'memory.html', title:'Memory'},
      {icon:'🎯', href:'exercises.html?type=particle', title:'Particule'},
      {icon:'👑', href:'boss.html', title:'Boss'},
      {icon:'❌', href:'mistakes.html', title:'Greșeli'},
      {icon:'✍️', href:'composition.html', title:'Compunere'},
      {icon:'📔', href:'journal.html', title:'Jurnal'}
    ],
    exploreLink:'🧭 Vezi toate funcțiile'
  },
  en:{
    title:'Practice', sub: AUDIENCE === 'student' ? 'Pick a challenge 🎮' : 'Pick what to practice today',
    surpriseEyebrow:"CAN'T DECIDE?", surpriseTitle:'Surprise me', surpriseSub:"We'll pick, based on your progress",
    reviewTitle:'Review', reviewSub:function(n){ return n ? 'Words and mistakes to go over today' : 'All caught up — you can revisit mistakes'; },
    gamesTitle:'GAMES', moreTitle:'MORE',
    games:[
      {cls:'g1', icon:'⚡', kr:'빨리', href:'quick60.html', title:'Quick 60', sub:'60 seconds — how many?'},
      {cls:'g2', icon:'🎧', kr:'듣기', href:'listening.html', title:'Listen', sub:'Hear it, pick the answer'},
      {cls:'g3', icon:'🧩', kr:'문장', href:'builder.html', title:'Build', sub:'Sentences from words'},
      {cls:'g4', icon:'💬', kr:'대화', href:'conversation.html', title:'Conversations', sub:'Restaurant, subway, airport…'}
    ],
    more:[
      {icon:'✦', href:'stories.html', title:'Stories'},
      {icon:'🧠', href:'memory.html', title:'Memory'},
      {icon:'🎯', href:'exercises.html?type=particle', title:'Particles'},
      {icon:'👑', href:'boss.html', title:'Boss'},
      {icon:'❌', href:'mistakes.html', title:'Mistakes'},
      {icon:'✍️', href:'composition.html', title:'Composition'},
      {icon:'📔', href:'journal.html', title:'Journal'}
    ],
    exploreLink:'🧭 See every feature'
  }
};
function L(){ return UI[LANG]; }

function dueCount(key){
  if(!window.RKSrs) return 0;
  var data = RKSrs.load(key);
  var now = Date.now();
  var n = 0;
  Object.keys(data).forEach(function(k){ if(data[k] && data[k].due <= now) n++; });
  return n;
}
function countHardExercises(){
  if(!window.RKStorage) return 0;
  var srs = RKStorage.get('RK_EX_SRS', {});
  var n = 0;
  Object.keys(srs).forEach(function(key){
    var c = srs[key];
    if(c && c.n >= 1 && c.EF < 2.2) n++;
  });
  return n;
}
function isDailyFlagDone(key){
  try {
    var d = JSON.parse(localStorage.getItem(key) || 'null');
    var today = new Date().toISOString().slice(0,10);
    return !!(d && d.date === today && d.done);
  } catch(e){ return false; }
}

/* ── "SURPRISE ME" ─────────────────────────────────────────
   Picks a real next activity from actual progress signals — never a
   literal random page. Weighted so more urgent/incomplete things come
   up more often, with just enough variety across repeat clicks. */
function surpriseMe(){
  var pool = [];
  var add = function(href, weight){ for(var i=0;i<weight;i++) pool.push(href); };

  var dueTotal = dueCount('RK_FC_SRS') + dueCount('RK_HJ_SRS') + dueCount('RK_EX_SRS');
  if(dueTotal >= 5) add('review.html', 3);

  if(window.RKGamification){
    var goals = RKGamification.getDailyTaskGoals();
    var tasks = RKGamification.getDailyTasks();
    if(tasks.vocab < goals.vocab) add('exercises.html?type=ko-ro', 2);
    if(goals.grammar && tasks.grammar < goals.grammar) add('exercises.html?type=particle', 2);
    if(tasks.sentences < goals.sentences) add('exercises.html?type=puzzle', 2);
  }
  if(!isDailyFlagDone('RK_DAILY_LISTEN')) add('listening.html', 2);
  if(!isDailyFlagDone('RK_DAILY_PRON')) add('reading.html', 2);

  var stats = window.RKStorage ? RKStorage.get('RK_STATS', {byType:{}}) : {byType:{}};
  var weakest = null, weakestPct = 100;
  Object.keys(stats.byType || {}).forEach(function(t){
    var d = stats.byType[t];
    if(d && d.total >= 5){
      var pct = d.correct / d.total * 100;
      if(pct < weakestPct){ weakestPct = pct; weakest = t; }
    }
  });
  if(weakest && weakestPct < 70) add('exercises.html?type=' + weakest, 2);

  // Always-available variety fallback, kept light so it never dominates.
  add('quick60.html', 1);
  add('conversation.html', 1);
  add('stories.html', 1);

  location.href = pool[Math.floor(Math.random() * pool.length)];
}

function render(){
  var l = L();
  document.getElementById('btnRo').classList.toggle('active', LANG === 'ro');
  document.getElementById('btnEn').classList.toggle('active', LANG === 'en');
  document.getElementById('pageTitle').textContent = l.title;
  document.getElementById('pageSubtitle').textContent = l.sub;
  document.getElementById('surpriseEyebrow').textContent = l.surpriseEyebrow;
  document.getElementById('surpriseTitle').textContent = l.surpriseTitle;
  document.getElementById('surpriseSub').textContent = l.surpriseSub;
  document.getElementById('gamesTitle').textContent = l.gamesTitle;
  document.getElementById('moreTitle').textContent = l.moreTitle;
  document.getElementById('exploreLink').textContent = l.exploreLink;
  RKNav.setLang(LANG);

  var due = dueCount('RK_FC_SRS') + dueCount('RK_HJ_SRS') + countHardExercises();
  document.getElementById('reviewTitle').textContent = l.reviewTitle;
  document.getElementById('reviewSub').textContent = l.reviewSub(due);
  var countEl = document.getElementById('reviewCount');
  countEl.textContent = due ? due : '✓';
  countEl.classList.toggle('zero', !due);

  document.getElementById('games').innerHTML = l.games.map(function(g, i){
    return '<a class="game ' + g.cls + '" href="' + g.href + '" style="animation-delay:' + (i * 60) + 'ms">' +
      '<span class="game-kr">' + g.kr + '</span>' +
      '<span class="game-ico">' + g.icon + '</span>' +
      '<span class="game-title">' + g.title + '</span>' +
      '<span class="game-sub">' + g.sub + '</span>' +
    '</a>';
  }).join('');
  document.getElementById('more').innerHTML = l.more.map(function(m){
    return '<a class="chip" href="' + m.href + '"><span>' + m.icon + '</span>' + m.title + '</a>';
  }).join('');
}
document.getElementById('surpriseBtn').addEventListener('click', surpriseMe);
document.getElementById('btnRo').addEventListener('click', function(){ LANG = 'ro'; localStorage.setItem('RK_LANG','ro'); render(); });
document.getElementById('btnEn').addEventListener('click', function(){ LANG = 'en'; localStorage.setItem('RK_LANG','en'); render(); });

render();
</script>
<script src="./js/core/register-sw.js"></script>
<script src="./js/core/page-help.js"></script>
</body>
</html>
