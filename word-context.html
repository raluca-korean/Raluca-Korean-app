<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harta Cuvântului</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#db2777">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">

<style>
.app{max-width:1180px}
.app .card{padding:13px 15px;margin-bottom:9px;border-radius:13px}
.app h1{font-size:19px}
.app .sub{font-size:12px}

/* ── Search ── */
.wc-search-wrap{position:relative}
.wc-search{
  width:100%;padding:10px 40px 10px 14px;border-radius:11px;
  background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);
  color:var(--rk-text,#fff);font-size:1rem;font-family:inherit;
  outline:none;transition:border-color .2s,background .2s;
}
.wc-search:focus{background:rgba(255,255,255,.12);border-color:#db2779}
.wc-search::placeholder{color:rgba(255,255,255,.32)}
body.dark-mode .wc-search{color:#f0e8ff}
.wc-clear{
  position:absolute;right:7px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:rgba(255,255,255,.4);font-size:1.1rem;
  cursor:pointer;padding:3px;line-height:1;box-shadow:none;display:none;
}
.wc-clear.vis{display:block}
.wc-hint{font-size:.74rem;color:rgba(255,255,255,.35);margin-top:6px;line-height:1.45}
body.dark-mode .wc-hint{color:rgba(210,170,240,.55)}
.wc-hint b{color:rgba(255,255,255,.6)}
body.dark-mode .wc-hint b{color:rgba(240,232,255,.85)}
.wc-cat-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.wc-cat-pill{
  padding:3px 10px;border-radius:11px;font-size:.72rem;font-weight:700;
  border:1px solid rgba(255,255,255,.16);background:none;
  color:rgba(255,255,255,.45);cursor:pointer;transition:all .18s;
}
body.dark-mode .wc-cat-pill{color:rgba(210,170,240,.6)}
.wc-cat-pill.on{background:rgba(219,39,119,.22);border-color:#db2779;color:#f0abfc}
.wc-res-count{font-size:.74rem;color:rgba(255,255,255,.35);margin:8px 0 4px;min-height:1em}
body.dark-mode .wc-res-count{color:rgba(210,170,240,.5)}
.wc-res-list{display:flex;flex-direction:column;gap:4px;max-height:280px;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
.wc-res-item{
  padding:7px 10px;border-radius:9px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);cursor:pointer;transition:all .16s;
  display:flex;align-items:center;gap:9px;
}
.wc-res-item:hover{background:rgba(219,39,119,.12);border-color:rgba(219,39,119,.35)}
.wc-res-ko{font-size:1rem;font-weight:700;min-width:66px;color:#f0abfc}
.wc-res-trans{font-size:.8rem;color:rgba(255,255,255,.6);flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
body.dark-mode .wc-res-trans{color:rgba(224,213,245,.7)}
.wc-res-cat{font-size:.64rem;padding:1px 7px;border-radius:8px;background:rgba(255,255,255,.08);
  color:rgba(255,255,255,.4);white-space:nowrap}
.wc-res-full{font-size:.85rem;flex-shrink:0}
.wc-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.wc-chip{
  padding:4px 10px;border-radius:11px;background:rgba(219,39,119,.10);
  border:1px solid rgba(219,39,119,.22);font-size:.82rem;cursor:pointer;
  transition:all .16s;color:#f0abfc;font-family:inherit;font-weight:700;
}
.wc-chip:hover{background:rgba(219,39,119,.2);border-color:#db2779}
.wc-empty{text-align:center;padding:18px 14px;color:rgba(255,255,255,.35);font-size:.88rem;line-height:1.55}
body.dark-mode .wc-empty{color:rgba(210,170,240,.55)}

/* ── Explore layout: map + sentence panel side by side ── */
.wc-explore{display:grid;grid-template-columns:1fr 1.35fr;gap:10px;align-items:start}
@media(max-width:840px){.wc-explore{grid-template-columns:1fr}}

/* ── Compass map ── */
.wc-map-card{padding:14px}
.wc-compass{
  display:grid;
  grid-template-columns:1fr 1.5fr 1fr;
  grid-template-areas:"n n n" "w c e" "s s s";
  gap:7px;
}
@media(max-width:840px){
  .wc-compass{grid-template-columns:1fr 1fr}
  .wc-compass{grid-template-areas:"c c" "n n" "w e" "s s"}
}
.wc-zone-n{grid-area:n}
.wc-zone-w{grid-area:w}
.wc-zone-c{grid-area:c}
.wc-zone-e{grid-area:e}
.wc-zone-s{grid-area:s}

.wc-zone-c{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:4px;padding:10px 6px;
}
.wc-map-ko{font-size:2rem;font-weight:900;color:#f0abfc;letter-spacing:.02em;cursor:pointer;
  text-shadow:0 0 22px rgba(219,39,119,.25);line-height:1.05}
.wc-map-badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.wc-map-pos{font-size:.68rem;font-weight:700;padding:2px 9px;border-radius:9px;
  background:rgba(219,39,119,.18);color:#f0abfc;border:1px solid rgba(219,39,119,.3);white-space:nowrap}
.wc-map-badge{font-size:.62rem;font-weight:700;padding:2px 8px;border-radius:8px;
  background:rgba(88,204,2,.16);color:#86efac;border:1px solid rgba(88,204,2,.28)}
.wc-map-badge.gen{background:rgba(28,176,246,.14);color:#7dd3fc;border-color:rgba(28,176,246,.26)}
.wc-homonym{font-size:.72rem;color:#fcd34d;margin-top:4px;line-height:1.4}

.wc-zone{border-radius:11px;padding:8px 9px;display:flex;flex-direction:column;gap:6px;min-height:36px}
.wc-zone-n>.wc-zone{background:rgba(255,150,0,.08);border:1px solid rgba(255,150,0,.18)}
.wc-zone-w>.wc-zone{background:rgba(28,176,246,.08);border:1px solid rgba(28,176,246,.18)}
.wc-zone-e>.wc-zone{background:rgba(88,204,2,.08);border:1px solid rgba(88,204,2,.18)}
.wc-zone-s>.wc-zone{background:rgba(206,130,255,.08);border:1px solid rgba(206,130,255,.18)}
.wc-zone-lbl{font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;font-weight:800;opacity:.65}
.wc-zone-n .wc-zone-lbl{color:#ff9600}
.wc-zone-w .wc-zone-lbl{color:#1cb0f6}
.wc-zone-e .wc-zone-lbl{color:#58cc02}
.wc-zone-s .wc-zone-lbl{color:#ce82ff}
.wc-zone-words{display:flex;flex-wrap:wrap;gap:4px}
.wc-word-chip{
  padding:3px 9px;border-radius:9px;font-size:.78rem;font-weight:700;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.75);white-space:nowrap;
}
body.dark-mode .wc-word-chip{color:#e8e0f5}
.wc-word-chip.clickable{cursor:pointer;transition:all .14s}
.wc-word-chip.clickable:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)}
.wc-word-chip .g{font-size:.68rem;opacity:.6;font-weight:500;margin-left:4px}

.wc-sense-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.wc-sense-tab{
  padding:4px 11px;border-radius:10px;font-size:.76rem;font-weight:700;
  border:1px solid rgba(255,255,255,.16);background:none;color:rgba(255,255,255,.5);cursor:pointer;
}
.wc-sense-tab.on{background:rgba(219,39,119,.2);border-color:#db2779;color:#f0abfc}

/* ── Sentence panel ── */
.wc-sent-card{padding:14px}
.wc-sent-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.wc-sent-title{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.4);font-weight:800}
body.dark-mode .wc-sent-title{color:rgba(210,170,240,.6)}
.wc-rom-toggle{
  display:flex;align-items:center;gap:5px;font-size:.72rem;color:rgba(255,255,255,.5);cursor:pointer;user-select:none;
}
.wc-rom-toggle input{accent-color:#db2779}
.wc-sent-list{display:flex;flex-direction:column}
.wc-sent-row{
  padding:7px 0;border-bottom:1px solid rgba(255,255,255,.07);
  display:flex;align-items:flex-start;gap:8px;
}
.wc-sent-row:last-child{border-bottom:none}
.wc-sent-lvl{
  flex-shrink:0;width:7px;height:7px;border-radius:50%;margin-top:7px;
}
.wc-sent-lvl.easy{background:#58cc02}
.wc-sent-lvl.medium{background:#1cb0f6}
.wc-sent-lvl.complex{background:#ce82ff}
.wc-sent-main{flex:1;min-width:0}
.wc-sent-ko{font-size:.98rem;font-weight:700;line-height:1.45}
.wc-sent-ko b{color:#f0abfc;background:rgba(219,39,119,.16);padding:0 1px;margin:0 -1px;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.wc-sent-ko .wc-tok{cursor:pointer;border-radius:4px;transition:background .12s}
.wc-sent-ko .wc-tok:hover{background:rgba(255,255,255,.12)}
.wc-sent-rom{font-size:.74rem;color:rgba(255,255,255,.4);font-style:italic;margin-top:1px;display:none}
body.dark-mode .wc-sent-rom{color:rgba(210,170,240,.5)}
.wc-sent-rom.show{display:block}
.wc-sent-ro{font-size:.85rem;color:rgba(255,255,255,.72);margin-top:2px}
body.dark-mode .wc-sent-ro{color:rgba(224,213,245,.82)}
.wc-sent-play{
  flex-shrink:0;background:none;border:1px solid rgba(255,255,255,.16);
  border-radius:50%;width:25px;height:25px;padding:0;font-size:.78rem;
  display:flex;align-items:center;justify-content:center;box-shadow:none;margin-top:2px;
}
.wc-sent-play:hover{background:rgba(219,39,119,.14);transform:none}
.wc-gen-note{font-size:.78rem;color:rgba(255,255,255,.4);margin-top:8px;line-height:1.45;font-style:italic}
body.dark-mode .wc-gen-note{color:rgba(210,170,240,.5)}

.wc-toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
  background:rgba(20,10,30,.92);color:#fff;padding:10px 20px;border-radius:12px;
  font-size:.88rem;opacity:0;pointer-events:none;transition:all .25s ease;z-index:500;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
}
.wc-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<body class="theme-anime">
<div class="app">

  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div>
        <h1 id="pgTitle">🗺️ Harta Cuvântului</h1>
        <div class="sub" id="pgSub">Introdu un cuvânt și explorează-l printr-o hartă de asocieri și propoziții</div>
      </div>
      <div id="pageControls"></div>
    </div>
  </div>

  <div class="card">
    <div class="wc-search-wrap">
      <input id="wcSearch" class="wc-search" type="text" autocomplete="off" spellcheck="false"
             placeholder="ex: 물, 가다, 학교 …">
      <button class="wc-clear" id="wcClear" type="button">✕</button>
    </div>
    <div class="wc-hint" id="wcHint"></div>
    <div class="wc-cat-row" id="wcCatRow"></div>
    <div class="wc-res-count" id="wcResCount"></div>
    <div class="wc-res-list" id="wcResList"></div>
    <div id="wcFeatured">
      <div class="wc-rel-lbl" id="wcFeaturedLbl" style="margin-top:6px;font-size:.72rem;color:rgba(255,255,255,.4);font-weight:700"></div>
      <div class="wc-chips" id="wcChips"></div>
    </div>
  </div>

  <div id="wcResult"></div>

</div>

<div class="wc-toast" id="wcToast"></div>

<script src="./js/core/storage.js"></script>
<script src="./js/core/lang-picker.js"></script>
<script src="./js/core/dark-mode.js"></script>
<script src="./js/core/audio.js"></script>
<script src="./js/core/register-sw.js"></script>
<script>
// ── STATE ────────────────────────────────────────────────────────
let DICT = {};
let VOCAB = [];
let cLang = (window.RKLang && RKLang.get()) || 'ro';
let activeCat = '';
let query = '';
let currentWord = null;
let currentSenseIdx = 0;
let showRomanization = true;
let vocabIndex = null;

const CAT_LABELS = {
  ro:{ nouns:'Substantiv', verbs:'Verb', adjectives:'Adjectiv', adverbs:'Adverb',
       objects:'Obiect', subjects:'Subiect', connectors:'Conector', grammar:'Gramatică',
       modifiers:'Modificator', times:'Timp', places:'Loc' },
  en:{ nouns:'Noun', verbs:'Verb', adjectives:'Adjective', adverbs:'Adverb',
       objects:'Object', subjects:'Subject', connectors:'Connector', grammar:'Grammar',
       modifiers:'Modifier', times:'Time', places:'Place' }
};
const CAT_ORDER = ['nouns','verbs','adjectives','adverbs','connectors','grammar','modifiers','times','places'];
const ZONE_LABELS = {
  ro:{ n:'Adjective asociate', w:'Verbe asociate', e:'Substantive asociate', s:'Expresii & metafore' },
  en:{ n:'Related adjectives', w:'Related verbs', e:'Related nouns', s:'Expressions & metaphors' }
};
const LEVEL_LABEL = { ro:{easy:'ușor',medium:'mediu',complex:'complex'}, en:{easy:'easy',medium:'medium',complex:'complex'} };

const STRIP_SUFFIXES = ['입니다','이에요','예요','습니다','합니다','했어요','했다','하고','해서','에서','에게','한테','까지','부터','이지만','지만','으로','로는','로써','로','는','은','이','가','을','를','에','도','와','과','랑','만','의','다','요','고','서'];
function stripParticle(chunk) {
  let w = chunk.replace(/[.,!?"'”“‘’()]/g,'').trim();
  for (const suf of STRIP_SUFFIXES) {
    if (w.length > suf.length && w.endsWith(suf)) { w = w.slice(0, -suf.length); break; }
  }
  return w;
}

const JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
function toJamo(text) {
  let r = '';
  for (const ch of text) {
    const c = ch.charCodeAt(0);
    if (c >= 0xAC00 && c <= 0xD7A3) {
      const s = c - 0xAC00;
      const jong = s%28, jung = Math.floor(s/28)%21, cho = Math.floor(s/588);
      r += ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'][cho];
      r += JUNG[jung];
      if (jong) r += ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'][jong];
    } else { r += ch; }
  }
  return r;
}

function hasBatchim(word) {
  const last = word[word.length - 1];
  const code = last ? last.charCodeAt(0) : 0;
  if (code < 0xAC00 || code > 0xD7A3) return true;
  return ((code - 0xAC00) % 28) !== 0;
}

// ── CONJUGATION (for generated/non-curated conjugable words) ─────
function conjugate(word) {
  if (!word.endsWith('다')) return null;
  const stem = word.slice(0,-1);
  const last = stem[stem.length-1];
  if (!last) return null;
  const code = last.charCodeAt(0);
  if (code < 0xAC00 || code > 0xD7A3) return null;
  const s = code - 0xAC00, jong = s % 28, jung = Math.floor(s/28) % 21, cho = Math.floor(s/588);

  if (last === '이') {
    const base = stem.slice(0,-1);
    return [{ro:'prezent',en:'present', form: base+'예요'}, {ro:'trecut',en:'past', form: base+'이었어요'}];
  }
  if (last === '하') {
    const base = stem.slice(0,-1);
    return [{ro:'prezent',en:'present', form: base+'해요'}, {ro:'trecut',en:'past', form: base+'했어요'}];
  }
  const B_IRREGULAR = ['고맙다','춥다','덥다','쉽다','어렵다','가깝다','아름답다','반갑다','귀엽다','무겁다','가볍다'];
  if (jong === 17 && B_IRREGULAR.includes(word)) {
    const openSyllable = String.fromCharCode(code - jong);
    const base = stem.slice(0,-1) + openSyllable;
    return [{ro:'prezent',en:'present', form: base+'워요'}, {ro:'trecut',en:'past', form: base+'웠어요'}];
  }
  const REUL_REGULAR = ['따르다', '들르다', '치르다'];
  if (last === '르' && jong === 0 && stem.length >= 2 && !REUL_REGULAR.includes(word)) {
    const preStem = stem.slice(0, -1);
    const preLast = preStem[preStem.length - 1];
    const pCode = preLast.charCodeAt(0);
    const pJung = Math.floor((pCode - 0xAC00) / 28) % 21;
    const preBright = pJung === 0 || pJung === 8;
    const doubled = String.fromCharCode(pCode + 8);
    const newSyl = preBright ? '라' : '러';
    const base = preStem.slice(0, -1) + doubled + newSyl;
    return [{ro:'prezent',en:'present', form: base+'요'}, {ro:'trecut',en:'past', form: base.slice(0,-1)+(preBright?'랐':'렀')+'어요'}];
  }
  const DIGEUT_IRREGULAR_BASES = ['걷다', '듣다'];
  if (jong === 7 && DIGEUT_IRREGULAR_BASES.some(b => word === b || word.endsWith(b))) {
    const base = stem.slice(0,-1) + String.fromCharCode(code + 1);
    const bright = jung === 0 || jung === 8;
    return [{ro:'prezent',en:'present', form: base+(bright?'아요':'어요')}, {ro:'trecut',en:'past', form: base+(bright?'았어요':'었어요')}];
  }

  const aVowel = jung===0||jung===8;
  const suf = aVowel ? '아':'어';
  let pres, past;
  if (jong===0) {
    if (jung===0) { pres = stem+'요'; past = stem.slice(0,-1) + String.fromCharCode(code+20) + '어요'; }
    else if (jung===8) { pres = stem.slice(0,-1) + String.fromCharCode(0xAC00+cho*588+9*28) + '요'; past = stem.slice(0,-1) + String.fromCharCode(0xAC00+cho*588+9*28+20) + '어요'; }
    else if (jung===13) { pres = stem.slice(0,-1) + String.fromCharCode(0xAC00+cho*588+14*28) + '요'; past = stem.slice(0,-1) + String.fromCharCode(0xAC00+cho*588+14*28+20) + '어요'; }
    else if (jung===18) {
      const pre = stem.slice(0, -1);
      const preLast = pre[pre.length-1];
      let preBright = false;
      if (preLast) {
        const pc = preLast.charCodeAt(0);
        if (pc >= 0xAC00 && pc <= 0xD7A3) { const pj = Math.floor((pc-0xAC00)/28)%21; preBright = pj===0||pj===8; }
      }
      const newJung = preBright ? 0 : 4;
      pres = pre + String.fromCharCode(0xAC00 + cho*588 + newJung*28) + '요';
      past = pre + String.fromCharCode(0xAC00 + cho*588 + newJung*28 + 20) + '어요';
    } else { pres = stem+'어요'; past = stem+'었어요'; }
  } else { pres = stem+suf+'요'; past = stem+(aVowel?'았':'었')+'어요'; }
  return [{ro:'prezent',en:'present', form: pres}, {ro:'trecut',en:'past', form: past}];
}

// ── LOAD DATA ────────────────────────────────────────────────────
Promise.all([
  fetch('./data/context-words.json').then(r => r.json()),
  fetch('./data/vocab-korean.json').then(r => r.json())
]).then(([dict, vocab]) => {
  DICT = dict;
  VOCAB = vocab;
  vocabIndex = new Map(vocab.map(e => [e.ko, e]));
  renderChips();
  renderCats();
  applyLang(cLang);
}).catch(() => {
  document.getElementById('wcResult').innerHTML =
    '<div class="card"><div class="wc-empty">⚠️ Nu s-au putut încărca datele.</div></div>';
});

// ── SEARCH ─────────────────────────────────────────────────────
function scoreEntry(entry, q) {
  if (!q) return 0;
  const qL = q.toLowerCase();
  const koJ = toJamo(entry.ko);
  const qJ  = toJamo(qL);
  const koL = entry.ko.toLowerCase();
  const ro  = entry.ro.toLowerCase();
  const en  = entry.en.toLowerCase();
  if (koL === qL || ro === qL || en === qL) return 100;
  if (koL.startsWith(qL) || koJ.startsWith(qJ)) return 80;
  if (ro.startsWith(qL) || en.startsWith(qL)) return 70;
  if (koL.includes(qL) || koJ.includes(qJ)) return 50;
  if (ro.includes(qL) || en.includes(qL)) return 40;
  return 0;
}
function getResults() {
  let results = VOCAB;
  if (activeCat) results = results.filter(e => e.categories?.includes(activeCat));
  if (!query.trim()) return activeCat ? results.slice(0,60) : [];
  return results.map(e => ({ ...e, _score: scoreEntry(e, query.trim()) }))
    .filter(e => e._score > 0).sort((a,b) => b._score - a._score).slice(0,60);
}
function renderCats() {
  const L = cLang === 'ro' ? CAT_LABELS.ro : CAT_LABELS.en;
  const all = cLang === 'ro' ? 'Toate' : 'All';
  let html = `<button class="wc-cat-pill${!activeCat?' on':''}" onclick="setCat('')">${all}</button>`;
  CAT_ORDER.forEach(c => { html += `<button class="wc-cat-pill${activeCat===c?' on':''}" onclick="setCat('${c}')">${L[c]||c}</button>`; });
  document.getElementById('wcCatRow').innerHTML = html;
}
function setCat(c) { activeCat = c; renderCats(); renderSearchResults(); }
window.setCat = setCat;

function renderSearchResults() {
  const res = getResults();
  const isRo = cLang === 'ro';
  const L = isRo ? CAT_LABELS.ro : CAT_LABELS.en;
  const countEl = document.getElementById('wcResCount');
  const listEl = document.getElementById('wcResList');
  const featuredEl = document.getElementById('wcFeatured');
  if (!query.trim() && !activeCat) { countEl.textContent=''; listEl.innerHTML=''; featuredEl.style.display=''; return; }
  featuredEl.style.display = 'none';
  if (res.length === 0) { countEl.textContent = isRo ? 'Niciun rezultat' : 'No results'; listEl.innerHTML=''; return; }
  countEl.textContent = res.length + (isRo ? ' rezultate din glosar' : ' results from the glossary');
  listEl.innerHTML = res.map(e => {
    const cat = e.categories && e.categories[0];
    const catLbl = cat ? (L[cat] || cat) : '';
    const trans = isRo ? e.ro : e.en;
    const isFull = !!DICT[e.ko];
    return `<div class="wc-res-item" onclick="searchAndFill('${e.ko.replace(/'/g,"\\'")}')">
      <span class="wc-res-ko">${e.ko}</span>
      <span class="wc-res-trans">${trans}</span>
      ${catLbl ? `<span class="wc-res-cat">${catLbl}</span>` : ''}
      ${isFull ? '<span class="wc-res-full" title="' + (isRo?'Hartă completă':'Full map') + '">✨</span>' : ''}
    </div>`;
  }).join('');
}
document.getElementById('wcSearch').addEventListener('input', e => {
  query = e.target.value;
  document.getElementById('wcClear').classList.toggle('vis', query.length > 0);
  renderSearchResults();
});
document.getElementById('wcSearch').addEventListener('keydown', e => {
  if (e.key === 'Enter') { const res = getResults(); if (res.length) searchAndFill(res[0].ko); }
});
document.getElementById('wcClear').addEventListener('click', () => {
  query = ''; document.getElementById('wcSearch').value=''; document.getElementById('wcClear').classList.remove('vis');
  renderSearchResults();
});

function searchAndFill(word) {
  document.getElementById('wcSearch').value = word;
  query = word;
  document.getElementById('wcClear').classList.add('vis');
  renderSearchResults();
  openWord(word);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
window.searchAndFill = searchAndFill;

function openWord(word) {
  currentSenseIdx = 0;
  const v = vocabIndex && vocabIndex.get(word);
  if (!v) { renderNotFound(word); return; }
  currentWord = word;
  renderExplore();
}

function exploreToken(raw) {
  const w = stripParticle(raw);
  if (!w) return;
  if (vocabIndex && vocabIndex.get(w)) { searchAndFill(w); return; }
  if (DICT[w]) { searchAndFill(w); return; }
  toast(cLang === 'ro' ? `Nu am găsit „${w}” în glosar — încearcă un alt cuvânt.` : `Couldn't find "${w}" in the glossary — try another word.`);
}
window.exploreToken = exploreToken;

function toast(msg) {
  const t = document.getElementById('wcToast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

function renderTokens(koHtml) {
  return koHtml.split(' ').map(chunk => {
    const plain = chunk.replace(/<\/?b>/g, '');
    return `<span class="wc-tok" onclick="exploreToken('${plain.replace(/'/g,"\\'")}')">${chunk}</span>`;
  }).join(' ');
}
function speak(text) {
  const clean = (text || '').replace(/<\/?b>/g, '');
  if (window.AudioEngine) AudioEngine.speak(clean);
}
window.speak = speak;

function renderChips() {
  const isRo = cLang === 'ro';
  document.getElementById('wcFeaturedLbl').textContent = isRo
    ? `✨ Cuvinte cu hartă completă (${Object.keys(DICT).length})`
    : `✨ Words with a full map (${Object.keys(DICT).length})`;
  document.getElementById('wcChips').innerHTML = Object.keys(DICT).map(k =>
    `<button class="wc-chip" onclick="searchAndFill('${k.replace(/'/g,"\\'")}')">${k}</button>`).join('');
}

function renderNotFound(q) {
  const isRo = cLang === 'ro';
  document.getElementById('wcResult').innerHTML = isRo
    ? `<div class="card"><div class="wc-empty">😕 „<b>${q}</b>” nu există în glosarul aplicației.<br>Caută mai sus în vocabularul aplicației (${VOCAB.length} cuvinte).</div></div>`
    : `<div class="card"><div class="wc-empty">😕 "<b>${q}</b>" isn't in the app's glossary.<br>Search the app's vocabulary above (${VOCAB.length} words).</div></div>`;
  currentWord = null;
}

// ═══════════════════════════════════════════════════════════════
// GENERATED (non-curated) content — lighter map + a few sentences
// ═══════════════════════════════════════════════════════════════
function isConjugable(v) { const cats = v.categories || []; return v.ko.endsWith('다') && (cats.includes('verbs') || cats.includes('adjectives')); }
function isNounLike(v) { const cats = v.categories || []; return !isConjugable(v) && cats.some(c => ['nouns','objects','subjects','places','times'].includes(c)); }

function buildGeneratedSense(v) {
  const cat = v.categories && v.categories[0];
  const sameCat = cat ? VOCAB.filter(e => e.ko !== v.ko && e.categories?.includes(cat)) : [];
  const sample = sameCat.sort(() => Math.random()-0.5).slice(0,8).map(e => ({ ko:e.ko, ro:e.ro, en:e.en }));
  const isRo = cLang === 'ro';
  const associations = sample.length ? [
    { zone:'e', label: {ro:'Cuvinte din aceeași categorie',en:'Words from the same category'}, words: sample }
  ] : [];

  let sentences = [];
  if (isConjugable(v)) {
    const conj = conjugate(v.ko);
    if (conj) {
      const frame = (label, t) => label.includes('trecut') || label==='past'
        ? { ko:`어제 <b>${t}</b>.`, ro: isRo?`Ieri: ${v.ro}.`:`Yesterday: ${v.en}.`, level:'easy' }
        : { ko:`지금 <b>${t}</b>.`, ro: isRo?`Acum: ${v.ro}.`:`Right now: ${v.en}.`, level:'easy' };
      conj.forEach(c => sentences.push(frame(c.ro, c.form)));
    }
  } else if (isNounLike(v)) {
    const bat = hasBatchim(v.ko);
    const copula = bat ? '이에요' : '예요';
    const ext = bat ? '이' : '가';
    sentences.push({ ko:`이것은 <b>${v.ko}${copula}</b>.`, ro: isRo?`Asta e ${v.ro}.`:`This is ${v.en}.`, level:'easy' });
    sentences.push({ ko:`${v.ko}<b>${ext}</b> 여기 있어요.`, ro: isRo?`E ${v.ro} aici.`:`There's ${v.en} here.`, level:'easy' });
  }
  return { associations, sentences, generated: true };
}

// ═══════════════════════════════════════════════════════════════
// RENDER: word map + sentence panel
// ═══════════════════════════════════════════════════════════════
function currentEntry() {
  const v = vocabIndex.get(currentWord);
  const curated = DICT[currentWord];
  if (curated) return { v, curated: true, pos: curated.pos, homonymNote: curated.homonymNote, senses: curated.senses };
  return { v, curated: false, pos: null, homonymNote: null, senses: [buildGeneratedSense(v)] };
}

function renderExplore() {
  const isRo = cLang === 'ro';
  const entry = currentEntry();
  const v = entry.v;
  const senses = entry.senses;
  const sense = senses[currentSenseIdx] || senses[0];
  const ZL = isRo ? ZONE_LABELS.ro : ZONE_LABELS.en;

  const zoneHtml = (zoneKey) => {
    const groups = (sense.associations || []).filter(a => (a.zone || '').toLowerCase() === zoneKey);
    if (!groups.length) return `<div class="wc-zone"></div>`;
    return groups.map(g => `<div class="wc-zone">
      <div class="wc-zone-lbl">${isRo ? g.label.ro : g.label.en}</div>
      <div class="wc-zone-words">${g.words.map(w => {
        const clickable = (vocabIndex.get(w.ko) || DICT[w.ko]) ? true : false;
        const gloss = isRo ? w.ro : w.en;
        return `<span class="wc-word-chip${clickable?' clickable':''}" ${clickable?`onclick="searchAndFill('${w.ko.replace(/'/g,"\\'")}')"`:''} title="${gloss}">${w.ko}<span class="g">${gloss}</span></span>`;
      }).join('')}</div>
    </div>`).join('');
  };

  let mapHtml = `<div class="wc-map-card card">`;
  if (senses.length > 1) {
    mapHtml += `<div class="wc-sense-tabs">${senses.map((s,i) =>
      `<button class="wc-sense-tab${i===currentSenseIdx?' on':''}" onclick="switchSense(${i})">${isRo?s.meaning.ro:s.meaning.en}</button>`).join('')}</div>`;
  }
  mapHtml += `<div class="wc-compass">
    <div class="wc-zone-n">${zoneHtml('n')}</div>
    <div class="wc-zone-w">${zoneHtml('w')}</div>
    <div class="wc-zone-c">
      <span class="wc-map-ko" onclick="speak('${currentWord.replace(/'/g,"\\'")}')">${currentWord}</span>
      <div class="wc-map-badges">
        ${entry.pos ? `<span class="wc-map-pos">${isRo?entry.pos.ro:entry.pos.en}</span>` : (v.categories && v.categories[0] ? `<span class="wc-map-pos">${(isRo?CAT_LABELS.ro:CAT_LABELS.en)[v.categories[0]]||''}</span>` : '')}
        <span class="wc-map-badge${entry.curated?'':' gen'}">${entry.curated ? (isRo?'hartă completă':'full map') : (isRo?'generat automat':'auto-generated')}</span>
      </div>
      ${entry.homonymNote ? `<div class="wc-homonym">⚠️ ${isRo?entry.homonymNote.ro:entry.homonymNote.en}</div>` : ''}
    </div>
    <div class="wc-zone-e">${zoneHtml('e')}</div>
    <div class="wc-zone-s">${zoneHtml('s')}</div>
  </div></div>`;

  const sentences = sense.sentences || [];
  let sentHtml = `<div class="wc-sent-card card">
    <div class="wc-sent-head">
      <div class="wc-sent-title">💬 ${isRo?'Propoziții':'Sentences'} (${sentences.length})</div>
      <label class="wc-rom-toggle"><input type="checkbox" id="romToggle" ${showRomanization?'checked':''} onchange="toggleRom(this.checked)"> ${isRo?'Romanizare':'Romanization'}</label>
    </div>
    <div class="wc-sent-list">`;
  if (!sentences.length) {
    sentHtml += `<div class="wc-empty">${isRo?'Niciun exemplu generat pentru acest tip de cuvânt.':'No generated example for this type of word.'}</div>`;
  }
  sentences.forEach(s => {
    sentHtml += `<div class="wc-sent-row">
      <span class="wc-sent-lvl ${s.level||'easy'}" title="${(isRo?LEVEL_LABEL.ro:LEVEL_LABEL.en)[s.level]||''}"></span>
      <div class="wc-sent-main">
        <div class="wc-sent-ko">${renderTokens(s.ko)}</div>
        ${s.romanization ? `<div class="wc-sent-rom${showRomanization?' show':''}">${s.romanization}</div>` : ''}
        <div class="wc-sent-ro">${s.ro}</div>
      </div>
      <button class="wc-sent-play" onclick="speak('${s.ko.replace(/<[^>]+>/g,'').replace(/'/g,"\\'")}')" title="🔊">🔊</button>
    </div>`;
  });
  sentHtml += `</div>`;
  if (entry.generated) {
    sentHtml += `<div class="wc-gen-note">${isRo
      ? 'Acest cuvânt nu are o hartă scrisă manual — vezi mai sus câteva cuvinte cu ✨ hartă completă.'
      : "This word doesn't have a hand-written map yet — see the ✨ full-map words above."}</div>`;
  }
  sentHtml += `</div>`;

  document.getElementById('wcResult').innerHTML = `<div class="wc-explore">${mapHtml}${sentHtml}</div>`;
}

function switchSense(i) { currentSenseIdx = i; renderExplore(); }
window.switchSense = switchSense;

function toggleRom(checked) {
  showRomanization = checked;
  document.querySelectorAll('.wc-sent-rom').forEach(el => el.classList.toggle('show', checked));
}
window.toggleRom = toggleRom;

// ── LANG ─────────────────────────────────────────────────────────
function applyLang(l) {
  cLang = l;
  document.getElementById('pgTitle').textContent = l === 'ro' ? '🗺️ Harta Cuvântului' : '🗺️ Word Map';
  document.getElementById('pgSub').textContent = l === 'ro'
    ? 'Introdu un cuvânt și explorează-l printr-o hartă de asocieri și propoziții'
    : 'Enter a word and explore it through a map of associations and sentences';
  document.getElementById('wcSearch').placeholder = l === 'ro' ? 'ex: 물, 가다, 학교 …' : 'e.g. 물, 가다, 학교 …';
  const n = VOCAB.length, m = Object.keys(DICT).length;
  document.getElementById('wcHint').innerHTML = l === 'ro'
    ? `Caută printre <b>${n}</b> cuvinte din glosarul aplicației. <b>${m}</b> au o hartă completă (✨); restul primesc o hartă mai simplă, generată automat.`
    : `Search across <b>${n}</b> words from the app's glossary. <b>${m}</b> have a full map (✨); the rest get a simpler, auto-generated one.`;
  renderCats();
  renderChips();
  renderSearchResults();
  if (currentWord) renderExplore();
}

if (window.RKLang) { RKLang.init(l => applyLang(l)); }
</script>
