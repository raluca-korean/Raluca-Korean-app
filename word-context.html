<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harta Cuvântului</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1c4a3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./theme-anime.css">
<style>
.app{max-width:1600px}
.app .card{padding:13px 15px;margin-bottom:9px;border-radius:13px}
.app h1{
  font-size:19px;
  background:linear-gradient(135deg,#ffb703,#ff6a3d,#ff4d8d,#c9922e);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  display:inline-block;
}
.app .sub{font-size:12px;color:#b8a888}

/* Cosmic starfield background shared by the header/search/gallery/related-
   words cards. Dark by default, matching the orbit below — but see the
   "LIGHT MODE" section near the end of this <style> block, which swaps
   these to a light variant when the site's light/dark toggle is set to
   light (the orbit itself stays fixed-dark; see that section for why). */
.wc-cosmic-card{
  background:
    radial-gradient(1.6px 1.6px at 12% 25%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(1.3px 1.3px at 78% 60%, rgba(255,255,255,.4), transparent 60%),
    radial-gradient(1.5px 1.5px at 40% 80%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1.4px 1.4px at 92% 20%, rgba(255,255,255,.4), transparent 60%),
    linear-gradient(180deg,#211d17 0%,#161310 100%);
  border-color:rgba(61,138,106,.28);
  border-bottom-color:rgba(61,138,106,.4);
  color:#f0e6d0;
}

/* ── Search ── */
.wc-search-wrap{position:relative}
.wc-search{
  width:100%;padding:10px 72px 10px 14px;border-radius:11px;
  background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);
  color:#f0e6d0;font-size:1rem;font-family:inherit;
  outline:none;transition:border-color .2s,background .2s;
}
.wc-search:focus{background:rgba(255,255,255,.12);border-color:#c9922e;box-shadow:0 0 0 4px rgba(201,146,46,.14)}
.wc-search{transition:border-color .2s,background .2s,box-shadow .25s}
.wc-search::placeholder{color:#b8a888}
.wc-clear{
  position:absolute;right:38px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:#b8a888;font-size:1.1rem;
  cursor:pointer;padding:3px;line-height:1;box-shadow:none;display:none;
  transition:color .15s,transform .2s;
}
.wc-clear.vis{display:block}
.wc-clear:hover{color:#f0d090;transform:translateY(-50%) rotate(90deg)}
.wc-clear:active{transform:translateY(-50%) rotate(90deg) scale(.88)}
.wc-go{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:#f0e6d0;font-size:1rem;
  cursor:pointer;padding:4px 6px;line-height:1;box-shadow:none;border-radius:8px;
  transition:color .15s,background .15s,transform .2s;
}
.wc-go:hover{background:rgba(201,146,46,.16);color:#f0d090;transform:translateY(-50%) scale(1.12)}
.wc-go:active{transform:translateY(-50%) scale(.92)}
.wc-empty{text-align:center;padding:18px 14px;color:#b8a888;font-size:.88rem;line-height:1.55}

.wc-random-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px}
.wc-random-lbl{font-size:.78rem;color:#b8a888}
.wc-random-btn{
  background:none;border:1px solid rgba(255,255,255,.16);color:#f0e6d0;
  border-radius:50%;width:26px;height:26px;padding:0;font-size:.85rem;
  display:flex;align-items:center;justify-content:center;box-shadow:none;
  transition:background .15s,color .15s,transform .15s;
}
.wc-random-btn:hover{background:rgba(201,146,46,.14);color:#f0d090;transform:scale(1.1)}
.wc-random-btn:active{transform:scale(.88)}
.wc-random-btn.spinning{animation:wc-spin .4s ease}

/* ══════════════════════════════════════════════════════════════════
   ORBIT — word in the center, sentences as planets around it
   Fixed cosmic palette (not theme-adaptive): this section always
   renders on a dark starfield regardless of the site's light/dark mode.
   ══════════════════════════════════════════════════════════════════ */
.wc-orbit-card{
  background:
    radial-gradient(1.6px 1.6px at 12% 22%, rgba(255,255,255,.6), transparent 60%),
    radial-gradient(1.4px 1.4px at 82% 14%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1.8px 1.8px at 68% 80%, rgba(255,255,255,.45), transparent 60%),
    radial-gradient(1.3px 1.3px at 24% 88%, rgba(255,255,255,.4), transparent 60%),
    radial-gradient(1.5px 1.5px at 92% 62%, rgba(255,255,255,.45), transparent 60%),
    radial-gradient(1.3px 1.3px at 45% 42%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1.5px 1.5px at 6% 55%, rgba(255,255,255,.4), transparent 60%),
    radial-gradient(ellipse 120% 90% at 50% 10%, #2a2620 0%, #1a1712 45%, #0a0908 100%);
  border-color:rgba(61,138,106,.28);
  border-bottom-color:rgba(61,138,106,.4);
  padding:16px 14px 18px;
  overflow:hidden;
}
.wc-orbit-topbar{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.wc-orbit-topbar .wc-speed{background:rgba(255,255,255,.08)}
.wc-orbit-topbar .wc-speed-btn{color:#d4c49f}
.wc-orbit-topbar .wc-speed-btn:hover{color:#fff}
.wc-orbit-topbar .wc-rom-toggle{color:#d4c49f}
.wc-orbit-topbar .wc-rom-toggle input{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22)}
.wc-word-actions{display:flex;gap:6px;margin-right:auto}
.wc-action-btn{
  display:flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;
  padding:5px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.08);color:#d4c49f;cursor:pointer;transition:background .15s,color .15s,border-color .15s;
}
.wc-action-btn:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.wc-action-btn.active{background:#c9922e;border-color:#c9922e;color:#fff}
.wc-action-ico{font-size:.9rem}

.wc-orbit-stage{display:flex;justify-content:center;padding:6px 0 8px}
.wc-orbit{position:relative;width:min(540px,94vw);aspect-ratio:1;container-type:inline-size}
.wc-orbit-ring{
  position:absolute;top:50%;left:50%;border-radius:50%;
  width:calc(var(--r) * 2);height:calc(var(--r) * 2);
  transform:translate(-50%,-50%);
  border:1px dashed rgba(255,255,255,.16);
  pointer-events:none;
}

.wc-orbit-sun{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:clamp(108px,30cqmin,168px);height:clamp(108px,30cqmin,168px);
  border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:radial-gradient(circle at 32% 28%, #ffe08a 0%, #ff9a3d 38%, #ff4d8d 78%, #d6266f 100%);
  box-shadow:0 0 0 6px rgba(255,150,80,.12), 0 0 44px rgba(255,120,90,.55), 0 8px 26px rgba(0,0,0,.4);
  cursor:pointer;text-align:center;padding:8px;z-index:3;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1);
}
.wc-orbit-sun:hover{transform:translate(-50%,-50%) scale(1.05)}
.wc-orbit-sun:active{transform:translate(-50%,-50%) scale(.96)}
.wc-orbit-sun.playing{animation:wc-sunPulse .9s ease}
.wc-sun-word{font-size:clamp(1.15rem,7cqmin,1.6rem);font-weight:900;color:#3a1200;letter-spacing:.01em;line-height:1.05}
.wc-sun-badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.wc-sun-tag{font-size:.58rem;font-weight:800;padding:2px 7px;border-radius:8px;
  background:rgba(20,6,15,.32);color:#fff5e8;white-space:nowrap}

.wc-planet{
  position:absolute;
  top:calc(50% + var(--radius) * sin(var(--angle)) - var(--size) / 2);
  left:calc(50% + var(--radius) * cos(var(--angle)) - var(--size) / 2);
  width:var(--size);height:var(--size);
  border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:7px;cursor:pointer;color:#2a2118;font-weight:700;
  font-size:clamp(.58rem,3.4cqmin,.74rem);line-height:1.22;
  background:var(--pc);
  box-shadow:0 3px 12px rgba(0,0,0,.35),0 0 0 2px rgba(255,255,255,.12) inset;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;
  z-index:2;
}
.wc-planet:hover{box-shadow:0 3px 16px rgba(0,0,0,.4),0 0 0 3px rgba(255,255,255,.4) inset}
.wc-planet.selected{
  box-shadow:0 0 0 3px #fff,0 0 22px var(--pc),0 4px 16px rgba(0,0,0,.45);
  transform:scale(1.12);
  z-index:4;
}
.wc-planet.playing{animation:wc-planetPulse .9s ease}
.wc-planet-lvl{position:absolute;top:6px;right:8px;width:6px;height:6px;border-radius:50%}
.wc-planet-lvl.easy{background:#0f5132}
.wc-planet-lvl.medium{background:#0c4a6e}
.wc-planet-lvl.complex{background:#4c1d95}
.wc-planet-txt{
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}

.wc-orbit-empty{text-align:center;color:#d4c49f;font-size:.85rem;padding:20px 10px}

.wc-orbit-detail{
  margin-top:6px;padding:14px;border-radius:14px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
}
.wc-detail-head{display:flex;align-items:flex-start;gap:8px}
.wc-detail-main{flex:1;min-width:0}
.wc-sent-lvl{flex-shrink:0;width:8px;height:8px;border-radius:50%;margin-top:8px}
.wc-sent-lvl.easy{background:#4ade80}
.wc-sent-lvl.medium{background:#38bdf8}
.wc-sent-lvl.complex{background:#c084fc}
.wc-sent-ko{font-size:1.05rem;font-weight:700;line-height:1.5;color:#f0e6d0}
.wc-sent-ko b{color:#ffd36b;background:rgba(255,180,50,.16);padding:0 1px;margin:0 -1px;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.wc-sent-ko .wc-tok{cursor:pointer;border-radius:4px;transition:background .12s}
.wc-sent-ko .wc-tok:hover{background:rgba(255,255,255,.14)}
.wc-sent-rom{font-size:.78rem;color:#b8a888;font-style:italic;margin-top:3px;display:none}
.wc-sent-rom.show{display:block}
.wc-sent-ro{font-size:.9rem;color:#d4c49f;margin-top:4px}
.wc-sent-play{
  flex-shrink:0;background:none;border:1px solid rgba(255,255,255,.22);color:#fff;
  border-radius:50%;width:28px;height:28px;padding:0;font-size:.85rem;
  display:flex;align-items:center;justify-content:center;box-shadow:none;margin-top:2px;
  transition:background .15s,transform .15s;
}
.wc-sent-play:hover{background:rgba(255,255,255,.16);transform:scale(1.1)}
.wc-sent-play:active{transform:scale(.9)}
.wc-sent-play.playing{animation:wc-playPulse .9s ease}
.wc-homonym{font-size:.75rem;color:#ffd977;margin-top:10px;line-height:1.4;text-align:left;
  background:rgba(255,180,50,.12);border-left:3px solid #ffb703;padding:7px 10px;border-radius:8px}
.wc-gen-note{font-size:.78rem;color:#b8a888;margin-top:10px;line-height:1.45;font-style:italic}

/* ── Related words / start gallery: calmer belts that share the same
   fixed dark palette as everything else on this page ── */
.wc-related-card{padding:14px}
.wc-related-lbl{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:800;
  color:#b8a888;margin-bottom:8px}
.wc-related-list{display:flex;flex-wrap:wrap;gap:6px}
.wc-assoc-group{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}
.wc-assoc-lbl{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
  color:#a89876;margin-bottom:7px}
.wc-word-chip{
  padding:5px 11px 5px 9px;border-radius:10px;font-size:.85rem;font-weight:700;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  border-left:3px solid var(--pc,rgba(255,255,255,.3));
  color:#f0e6d0;white-space:nowrap;
}
.wc-word-chip.clickable{cursor:pointer;transition:all .14s}
.wc-word-chip.clickable:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);border-left-color:var(--pc,#c9922e);color:#fff;transform:translateY(-1px) scale(1.03)}
.wc-word-chip.clickable:active{transform:translateY(0) scale(.95)}
.wc-word-chip .g{font-size:.72rem;opacity:.65;font-weight:500;margin-left:5px}

.wc-speed{display:flex;background:var(--rk-border);border-radius:999px;padding:2px;gap:2px;flex-shrink:0}
.wc-speed-btn{
  background:none;border:none;box-shadow:none;padding:4px 10px;border-radius:999px;
  font-size:.68rem;font-weight:700;color:var(--rk-muted);cursor:pointer;transition:background .2s,color .2s;
}
.wc-speed-btn:hover{color:var(--rk-text);transform:none}
.wc-rom-toggle{
  display:flex;align-items:center;gap:8px;font-size:.72rem;color:var(--rk-muted);cursor:pointer;user-select:none;
}
.wc-rom-toggle input{
  appearance:none;-webkit-appearance:none;margin:0;flex-shrink:0;cursor:pointer;
  width:34px;height:20px;border-radius:999px;position:relative;
  background:var(--rk-border);border:1.5px solid var(--rk-border-b);
  transition:background .25s,border-color .25s;
}
.wc-rom-toggle input::before{
  content:'';position:absolute;left:1px;top:1px;width:15px;height:15px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);
  transition:transform .28s cubic-bezier(.34,1.56,.64,1);
}
.wc-rom-toggle input:checked{background:#c9922e !important;border-color:#c9922e !important}
.wc-rom-toggle input:checked::before{transform:translateX(14px)}

/* ── Motion: entrances + feedback pulses (off for reduced-motion users) ── */
@media (prefers-reduced-motion: no-preference) {
  .wc-orbit-card{animation:wc-cardIn .45s cubic-bezier(.16,1,.3,1) both}
  .wc-related-card{animation:wc-cardIn .45s cubic-bezier(.16,1,.3,1) both;animation-delay:.08s}
  .wc-orbit-sun{animation:wc-sunPop .5s cubic-bezier(.34,1.56,.64,1) both,wc-sunFloat 5s ease-in-out 0.5s infinite}
  .wc-planet{animation:wc-planetIn .4s cubic-bezier(.34,1.56,.64,1) both}
  .wc-orbit-ring{animation:wc-ringSpin 90s linear infinite}
  .wc-orbit-ring.r1{animation-direction:reverse;animation-duration:120s}
  .wc-related-list .wc-word-chip,.wc-random-row .wc-word-chip{animation:wc-chipIn .35s cubic-bezier(.16,1,.3,1) both}
}
@keyframes wc-cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes wc-sunPop{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes wc-sunFloat{0%,100%{margin-top:0}50%{margin-top:-6px}}
@keyframes wc-planetIn{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes wc-ringSpin{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes wc-chipIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes wc-spin{to{transform:scale(1.1) rotate(360deg)}}
@keyframes wc-sunPulse{0%,100%{box-shadow:0 0 0 6px rgba(255,150,80,.12),0 0 44px rgba(255,120,90,.55),0 8px 26px rgba(0,0,0,.4)}50%{box-shadow:0 0 0 10px rgba(255,150,80,.2),0 0 64px rgba(255,120,90,.8),0 8px 26px rgba(0,0,0,.4)}}
@keyframes wc-playPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}70%{box-shadow:0 0 0 9px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@keyframes wc-planetPulse{0%{box-shadow:0 0 0 0 var(--pc)}70%{box-shadow:0 0 0 14px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}

.wc-toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
  background:rgba(33,29,23,.92);color:#fff;padding:10px 20px;border-radius:12px;
  font-size:.88rem;opacity:0;pointer-events:none;transition:all .25s ease;z-index:500;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
}
.wc-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ══════════════════════════════════════════════════════════════════
   LIGHT MODE — the orbit (sun/planets/starfield) stays a fixed dark
   "planetarium" always, since colored planets need a dark backdrop to
   read. But the chrome around it — header, search, gallery, related
   words — now follows the site's light/dark toggle like every other
   page, instead of staying dark even in bright daylight.
   ══════════════════════════════════════════════════════════════════ */
:root[data-mode="day"] .wc-cosmic-card{
  background:
    radial-gradient(1.6px 1.6px at 12% 25%, rgba(28,74,58,.22), transparent 60%),
    radial-gradient(1.3px 1.3px at 78% 60%, rgba(28,74,58,.16), transparent 60%),
    radial-gradient(1.5px 1.5px at 40% 80%, rgba(28,74,58,.14), transparent 60%),
    radial-gradient(1.4px 1.4px at 92% 20%, rgba(28,74,58,.16), transparent 60%),
    linear-gradient(180deg,#f7efdc 0%,#f3ead6 100%);
  border-color:rgba(28,74,58,.18);
  border-bottom-color:rgba(28,74,58,.26);
  color:#2a2118;
}
:root[data-mode="day"] .app .sub{color:#7a6a52}
:root[data-mode="day"] .wc-search{background:#fff;border-color:rgba(28,74,58,.2);color:#2a2118}
:root[data-mode="day"] .wc-search:focus{background:#fff;border-color:#c9922e;box-shadow:0 0 0 4px rgba(201,146,46,.12)}
:root[data-mode="day"] .wc-search::placeholder{color:#a89876}
:root[data-mode="day"] .wc-clear{color:#7a6a52}
:root[data-mode="day"] .wc-clear:hover{color:#c9922e}
:root[data-mode="day"] .wc-go{color:#2a2118}
:root[data-mode="day"] .wc-go:hover{background:rgba(201,146,46,.1);color:#c9922e}
:root[data-mode="day"] .wc-empty{color:#7a6a52}
:root[data-mode="day"] .wc-random-lbl{color:#7a6a52}
:root[data-mode="day"] .wc-random-btn{border-color:rgba(28,74,58,.22);color:#2a2118}
:root[data-mode="day"] .wc-random-btn:hover{background:rgba(201,146,46,.1);color:#c9922e}
:root[data-mode="day"] .wc-related-lbl{color:#7a6a52}
:root[data-mode="day"] .wc-assoc-lbl{color:#a89876}
:root[data-mode="day"] .wc-word-chip{background:rgba(28,74,58,.06);border-color:rgba(28,74,58,.16);color:#2a2118}
:root[data-mode="day"] .wc-word-chip.clickable:hover{background:rgba(28,74,58,.12);border-color:rgba(28,74,58,.28);color:#2a2118}
:root[data-mode="day"] .wc-word-chip .g{opacity:.6}
</style>
</head>
<body class="theme-anime">
<div class="app">

  <div class="card wc-cosmic-card">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div>
        <h1 id="pgTitle">🗺️ Harta Cuvântului</h1>
        <div class="sub" id="pgSub">Introdu un cuvânt și explorează-l printr-o hartă de asocieri și propoziții</div>
      </div>
      <div id="pageControls"></div>
    </div>
  </div>

  <div class="card wc-cosmic-card">
    <div class="wc-search-wrap">
      <input id="wcSearch" class="wc-search" type="text" autocomplete="off" spellcheck="false"
             placeholder="Scrie un cuvânt coreean și apasă Enter…">
      <button class="wc-clear" id="wcClear" type="button">✕</button>
      <button class="wc-go" id="wcGo" type="button" title="Analizează">🔍</button>
    </div>
    <div class="wc-random-row" id="wcRandomRow"></div>
  </div>

  <div id="wcStartGallery"></div>

  <div id="wcResult"></div>

</div>

<div class="wc-toast" id="wcToast"></div>

<script src="./js/core/storage.js"></script>
<script src="./js/core/lang-picker.js"></script>
<script src="./js/core/dark-mode.js"></script>
<script src="./js/core/audio.js"></script>
<script src="./js/core/verb-conjugator.js"></script>
<script src="./js/core/ro-conjugator.js"></script>
<script src="./js/core/sentence-generator.js"></script>
<script src="./js/core/register-sw.js"></script>
<script>
// ── STATE ────────────────────────────────────────────────────────
let DICT = {};
let VOCAB = [];
let cLang = (window.RKLang && RKLang.get()) || 'ro';
let currentWord = null;
let showRomanization = true;
let audioSpeed = 'normal';
let vocabIndex = null;
let currentSentences = [];
let selectedSentenceIdx = -1;

// ── FAVORITES / LEARNED (shared with Glossary + Flashcards) ────────
// Same localStorage keys as js/glossary.js — toggling here shows up
// there too, and RK_FAV_WORDS is what feeds the Flashcards deck filter.
function getFavSet()     { return new Set(JSON.parse(localStorage.getItem('RK_FAV_WORDS') || '[]')); }
function getLearnedSet() { return new Set(JSON.parse(localStorage.getItem('RK_LEARNED')    || '[]')); }
function isFav(ko)     { return getFavSet().has(ko); }

function copyWordLink(btn) {

const CAT_LABELS = {
  ro:{ nouns:'Substantiv', verbs:'Verb', adjectives:'Adjectiv', adverbs:'Adverb',
       objects:'Obiect', subjects:'Subiect', connectors:'Conector', grammar:'Gramatică',
       modifiers:'Modificator', times:'Timp', places:'Loc' },
  en:{ nouns:'Noun', verbs:'Verb', adjectives:'Adjective', adverbs:'Adverb',
       objects:'Object', subjects:'Subject', connectors:'Connector', grammar:'Grammar',
       modifiers:'Modifier', times:'Time', places:'Place' }
};
const CAT_ORDER = ['nouns','verbs','adjectives','adverbs','connectors','grammar','modifiers','times','places'];
const LEVEL_LABEL = { ro:{easy:'ușor',medium:'mediu',complex:'complex'}, en:{easy:'easy',medium:'medium',complex:'complex'} };

const STRIP_SUFFIXES = ['입니다','이에요','예요','습니다','합니다','했어요','했다','하고','해서','에서','에게','한테','까지','부터','이지만','지만','으로','로는','로써','로','는','은','이','가','을','를','에','도','와','과','랑','만','의','다','요','고','서'];
function stripParticle(chunk) {
  let w = chunk.replace(/[.,!?"'”“‘’()]/g,'').trim();
  for (const suf of STRIP_SUFFIXES) {
    if (w.length > suf.length && w.endsWith(suf)) { w = w.slice(0, -suf.length); break; }
  }
  return w;
}

const JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
function toJamo(text) {
  let r = '';
  for (const ch of text) {
    const c = ch.charCodeAt(0);
    if (c >= 0xAC00 && c <= 0xD7A3) {
      const s = c - 0xAC00;
      const jong = s%28, jung = Math.floor(s/28)%21, cho = Math.floor(s/588);
      r += ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'][cho];
      r += JUNG[jung];
      if (jong) r += ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'][jong];
    } else { r += ch; }
  }
  return r;
}

// ── CONJUGATION (for generated/non-curated conjugable words) ─────
// hasBatchim/conjugate + the irregular word lists now live in
// js/core/verb-conjugator.js (window.VerbConjugator) so other pages can
// reuse the same general-purpose engine instead of duplicating it.

// Additional inflected forms (honorific, connective, attributive…) used only
// to build a reverse lookup for click-to-explore; skipped for irregular
// stems where a naive rule would produce a wrong form.
function extraSurfaceForms(word, categories) {
  const forms = [];
  if (!word.endsWith('다')) return forms;
  const stem = word.slice(0, -1);
  const last = stem[stem.length - 1];
  if (!last) return forms;
  const code = last.charCodeAt(0);
  if (code < 0xAC00 || code > 0xD7A3) return forms;
  const jong = (code - 0xAC00) % 28;
  const jung = Math.floor((code - 0xAC00) / 28) % 21;
  const isAdj = categories && categories.includes('adjectives');
  const isVerb = categories && categories.includes('verbs');

  const conj = VerbConjugator.conjugate(word);
  if (conj && conj[0] && conj[0].form.endsWith('요') && last !== '이') {
    const pres = conj[0].form;
    forms.push(pres.slice(0, -1) + '서'); // -아서/어서 (cause/sequence)
    forms.push(pres.slice(0, -1) + '야'); // -아야/어야 (obligation, "must")
  }
  forms.push(stem + '고'); // -고 (and/then) — attaches to the plain stem, always safe

  const isReulIrregular = last === '르' && jong === 0 && stem.length >= 2 && !VerbConjugator.REUL_REGULAR.includes(word);
  const isEuIrregular = jong === 0 && jung === 18;
  const isIrregular = VerbConjugator.B_IRREGULAR.includes(word) || VerbConjugator.BO_WA_EXCEPTIONS.includes(word)
    || VerbConjugator.D_IRREGULAR.some(b => word === b || word.endsWith(b)) || VerbConjugator.H_IRREGULAR.includes(word)
    || isReulIrregular || isEuIrregular || last === '하' || last === '이';
  if (isIrregular) return forms;

  const rieulFinal = jong === 8;
  const hasBatchim = jong !== 0;

  if (rieulFinal) forms.push(stem.slice(0, -1) + String.fromCharCode(code - 8) + '세요');
  else forms.push(stem + (hasBatchim ? '으세요' : '세요'));

  forms.push(stem + (hasBatchim && !rieulFinal ? '으면' : '면'));

  if (rieulFinal) forms.push(stem.slice(0, -1) + String.fromCharCode(code - 8) + '니까');
  else forms.push(stem + (hasBatchim ? '으니까' : '니까'));

  if (isVerb) {
    if (rieulFinal) forms.push(stem + '까요');
    else if (hasBatchim) forms.push(stem + '을까요');
    else forms.push(stem.slice(0, -1) + String.fromCharCode(code + 8) + '까요');
    if (rieulFinal) forms.push(stem.slice(0, -1) + String.fromCharCode(code - 8) + '는');
    else forms.push(stem + '는');
  }
  if (isAdj) {
    if (rieulFinal) forms.push(stem.slice(0, -1) + String.fromCharCode(code - 8 + 4));
    else if (hasBatchim) forms.push(stem + '은');
    else forms.push(stem.slice(0, -1) + String.fromCharCode(code + 4));
  }
  return forms;
}

// Reverse lookup: inflected surface form -> dictionary-form vocab word.
// Lets click-to-explore resolve forms like 있어요/좋은/바빠서/마셔요 back to
// their headword (있다/좋다/바쁘다/마시다), not just plain particle strips.
let CONJ_REVERSE = new Map();
function buildConjReverse() {
  CONJ_REVERSE = new Map();
  VOCAB.forEach(e => {
    if (!SentenceGenerator.isConjugable(e)) return;
    const conj = VerbConjugator.conjugate(e.ko);
    if (conj) conj.forEach(c => { if (c.form && !CONJ_REVERSE.has(c.form)) CONJ_REVERSE.set(c.form, e.ko); });
    extraSurfaceForms(e.ko, e.categories).forEach(f => { if (f && !CONJ_REVERSE.has(f)) CONJ_REVERSE.set(f, e.ko); });
  });
}

// ── LOAD DATA ────────────────────────────────────────────────────
let EXTRA_SENTENCES = {};
Promise.all([
  fetch('./data/context-words.json').then(r => r.json()),
  fetch('./data/vocab-korean.json').then(r => r.json()),
  fetch('./data/extra-generated-sentences.json').then(r => r.json()).catch(() => ({}))
]).then(([dict, vocab, extra]) => {
  DICT = dict;
  VOCAB = vocab;
  EXTRA_SENTENCES = extra;
  vocabIndex = new Map(vocab.map(e => [e.ko, e]));
  buildConjReverse();
  applyLang(cLang);

  if (initialWord && vocabIndex.get(initialWord)) searchAndFill(initialWord);
}).catch(() => {
  document.getElementById('wcResult').innerHTML =
    '<div class="card"><div class="wc-empty">⚠️ Nu s-au putut încărca datele.</div></div>';
});

// ── SEARCH ─────────────────────────────────────────────────────
// Most people type Romanian without diacritics (no ă/â/î/ș/ț on their
// keyboard) — strip them from both sides so "scoala"/"mancare"/"caine"
// still find "școală"/"mâncare"/"câine".
function stripDiacritics(s) {
  return s
    .replace(/[ăâ]/g, 'a')
    .replace(/î/g, 'i')
    .replace(/[șş]/g, 's')
    .replace(/[țţ]/g, 't')
    .normalize('NFD').replace(/[̀-ͯ]/g, '');
}
function scoreEntry(entry, q) {
  if (!q) return 0;
  const qL = q.toLowerCase();
  const qN = stripDiacritics(qL);
  const koJ = toJamo(entry.ko);
  const qJ  = toJamo(qL);
  const koL = entry.ko.toLowerCase();
  const ro  = entry.ro.toLowerCase();
  const roN = stripDiacritics(ro);
  const en  = entry.en.toLowerCase();
  if (koL === qL || ro === qL || roN === qN || en === qL) return 100;
  if (koL.startsWith(qL) || koJ.startsWith(qJ)) return 80;
  if (ro.startsWith(qL) || roN.startsWith(qN) || en.startsWith(qL)) return 70;
  if (koL.includes(qL) || koJ.includes(qJ)) return 50;
  if (ro.includes(qL) || roN.includes(qN) || en.includes(qL)) return 40;
  return 0;
}
// Best fuzzy match for a typed word that isn't an exact vocab entry.
function bestMatch(q) {
  if (!q.trim()) return null;
  let best = null, bestScore = 0;
  for (const e of VOCAB) {
    const s = scoreEntry(e, q.trim());
    if (s > bestScore) { bestScore = s; best = e; }
  }
  return bestScore >= 50 ? best : null;
}

function submitSearch() {
  const q = document.getElementById('wcSearch').value.trim();
  if (!q) return;
  if (vocabIndex.get(q)) { searchAndFill(q); return; }
  const match = bestMatch(q);
  if (match) { searchAndFill(match.ko); return; }
  renderNotFound(q);
}
window.submitSearch = submitSearch;

document.getElementById('wcSearch').addEventListener('input', e => {
  document.getElementById('wcClear').classList.toggle('vis', e.target.value.length > 0);
});
document.getElementById('wcSearch').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitSearch();
});
document.getElementById('wcGo').addEventListener('click', submitSearch);
document.getElementById('wcClear').addEventListener('click', () => {
  document.getElementById('wcSearch').value = '';
  document.getElementById('wcClear').classList.remove('vis');
  document.getElementById('wcResult').innerHTML = '';
  currentWord = null;
  updateUrlForWord(null);
  renderRandomWord();
  renderStartGallery();
});

function searchAndFill(word) {
  document.getElementById('wcSearch').value = word;
  document.getElementById('wcClear').classList.add('vis');
  openWord(word);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
window.searchAndFill = searchAndFill;

function openWord(word) {
  const v = vocabIndex && vocabIndex.get(word);

  currentWord = word;
  updateUrlForWord(word);
  renderExplore();
  renderRandomWord();
  renderStartGallery();
}

// ── DEEP LINKING (?word=학교) ────────────────────────────────────
// Lets people share/bookmark a link straight to one word instead of
// always landing on the gallery, and makes browser back/forward step
// through the words they've explored.
function updateUrlForWord(word) {
  const url = new URL(location.href);
  if (word) url.searchParams.set('word', word); else url.searchParams.delete('word');
  if (url.href !== location.href) history.pushState({ word: word || null }, '', url);
}
window.addEventListener('popstate', e => {
  const word = (e.state && e.state.word) || new URLSearchParams(location.search).get('word');
  if (word && vocabIndex && vocabIndex.get(word)) {
    document.getElementById('wcSearch').value = word;
    document.getElementById('wcClear').classList.add('vis');
    currentWord = word;
    renderExplore();
    renderRandomWord();
    renderStartGallery();
  } else {
    document.getElementById('wcSearch').value = '';
    document.getElementById('wcClear').classList.remove('vis');
    document.getElementById('wcResult').innerHTML = '';
    currentWord = null;
    renderRandomWord();
    renderStartGallery();
  }
});

// ── RANDOM WORD SUGGESTION ─────────────────────────────────────────
let randomWordEntry = null;
function pickRandomWord() {
  if (!VOCAB.length) return null;
  return VOCAB[Math.floor(Math.random() * VOCAB.length)];
}
function renderRandomWord() {
  const el = document.getElementById('wcRandomRow');
  if (!el) return;
  if (currentWord) { el.innerHTML = ''; return; }
  if (!randomWordEntry) randomWordEntry = pickRandomWord();
  if (!randomWordEntry) { el.innerHTML = ''; return; }
  const isRo = cLang === 'ro';
  const gloss = isRo ? randomWordEntry.ro : randomWordEntry.en;
  el.innerHTML = `<span class="wc-random-lbl">${isRo ? 'Nu știi ce cuvânt să alegi? Încearcă:' : "Don't know which word to pick? Try:"}</span>
    <span class="wc-word-chip clickable" style="--pc:#ffb703" onclick="searchAndFill('${randomWordEntry.ko.replace(/'/g,"\\'")}')" title="${gloss}">${randomWordEntry.ko}<span class="g">${gloss}</span></span>
    <button class="wc-random-btn" type="button" onclick="spinRandomWord(this)" title="${isRo ? 'Alt cuvânt' : 'Another word'}">🎲</button>`;
}
function rerollRandomWord() {
  randomWordEntry = pickRandomWord();
  renderRandomWord();
}
window.rerollRandomWord = rerollRandomWord;
function spinRandomWord(btn) {
  btn.classList.add('spinning');
  setTimeout(rerollRandomWord, 220);
}
window.spinRandomWord = spinRandomWord;

// ── START GALLERY: quick-start chips for every fully-curated word ──────
function renderStartGallery() {
  const el = document.getElementById('wcStartGallery');
  if (!el) return;
  if (currentWord) { el.innerHTML = ''; return; }
  const words = Object.keys(DICT || {});
  if (!words.length) { el.innerHTML = ''; return; }
  const isRo = cLang === 'ro';
  let html = `<div class="card wc-cosmic-card">
    <div class="wc-related-lbl">✨ ${isRo ? 'Cuvinte cu lecție completă' : 'Words with a full lesson'} (${words.length})</div>
    <div class="wc-related-list">`;
  words.forEach((w, i) => {
    const entry = vocabIndex && vocabIndex.get(w);
    const gloss = entry ? (isRo ? entry.ro : entry.en) : '';
    const delay = Math.min(i * 0.02, 0.3).toFixed(3);
    const color = PLANET_COLORS[i % PLANET_COLORS.length];
    html += `<span class="wc-word-chip clickable" style="--pc:${color};animation-delay:${delay}s" onclick="searchAndFill('${w.replace(/'/g,"\\'")}')" title="${gloss}">${w}${gloss ? `<span class="g">${gloss}</span>` : ''}</span>`;
  });
  html += `</div></div>`;
  el.innerHTML = html;
}

function exploreToken(raw) {
  const cleaned = raw.replace(/[.,!?"'”“‘’()]/g,'').trim();
  if (!cleaned) return;
  if (vocabIndex && vocabIndex.get(cleaned)) { searchAndFill(cleaned); return; }
  if (DICT[cleaned]) { searchAndFill(cleaned); return; }
  if (CONJ_REVERSE.has(cleaned)) { searchAndFill(CONJ_REVERSE.get(cleaned)); return; }
  const w = stripParticle(cleaned);
  if (vocabIndex && vocabIndex.get(w)) { searchAndFill(w); return; }
  if (DICT[w]) { searchAndFill(w); return; }
  if (CONJ_REVERSE.has(w)) { searchAndFill(CONJ_REVERSE.get(w)); return; }
  toast(cLang === 'ro' ? `Nu am găsit „${w}” în glosar — încearcă un alt cuvânt.` : `Couldn't find "${w}" in the glossary — try another word.`);
}
window.exploreToken = exploreToken;

function toast(msg) {
  const t = document.getElementById('wcToast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

function renderTokens(koHtml) {
  return koHtml.split(' ').map(chunk => {
    const plain = chunk.replace(/<\/?b>/g, '');
    return `<span class="wc-tok" onclick="exploreToken('${plain.replace(/'/g,"\\'")}')">${chunk}</span>`;
  }).join(' ');
}
function speak(text, el) {
  const clean = (text || '').replace(/<\/?b>/g, '');
  if (window.AudioEngine) AudioEngine.speak(clean, { repeat: 1, slow: audioSpeed === 'slow' });
  if (el) {
    el.classList.add('playing');
    setTimeout(() => el.classList.remove('playing'), 900);
  }
}
window.speak = speak;

function renderNotFound(q) {
  const isRo = cLang === 'ro';
  document.getElementById('wcResult').innerHTML = isRo
    ? `<div class="card wc-cosmic-card"><div class="wc-empty">😕 „<b>${q}</b>” nu există în glosarul aplicației.<br>Caută mai sus în vocabularul aplicației (${VOCAB.length} cuvinte).</div></div>`
    : `<div class="card wc-cosmic-card"><div class="wc-empty">😕 "<b>${q}</b>" isn't in the app's glossary.<br>Search the app's vocabulary above (${VOCAB.length} words).</div></div>`;
  currentWord = null;
  renderRandomWord();
  renderStartGallery();
}

// ═══════════════════════════════════════════════════════════════
// GENERATED (non-curated) content — lighter map + at least 5 sentences,
// built only from mechanically-derived, already-tested conjugation
// forms (conjugate() / the -고 /-아서/-어서 /-아야/-어야 derivations also
// used by extraSurfaceForms()) so every generated sentence stays
// grammatically valid Korean even though it isn't hand-curated.
// ═══════════════════════════════════════════════════════════════


// Last-resort "related words" for any word with no hand-written associations
// and no compound-word matches (a same-category sample beats an empty panel).
function categoryFallbackAssociations(v) {
  const cat = v.categories && v.categories[0];
  const sameCat = cat ? VOCAB.filter(e => e.ko !== v.ko && e.categories?.includes(cat)) : [];
  const sample = sameCat.sort(() => Math.random()-0.5).slice(0,8).map(e => ({ ko:e.ko, ro:e.ro, en:e.en }));
  return sample.length ? [
    { zone:'e', label: {ro:'Cuvinte din aceeași categorie',en:'Words from the same category'}, words: sample }
  ] : [];
}


function buildGeneratedSense(v) {
  const associations = categoryFallbackAssociations(v);
  const isRo = cLang === 'ro';

  let sentences = [];
  if (EXTRA_SENTENCES[v.ko]) {
    sentences = EXTRA_SENTENCES[v.ko].map(x => ({ ko: x.ko, ro: isRo ? x.ro : x.en, level: x.level }));
  } else {
    sentences = SentenceGenerator.generate(v, cLang);
  }
  return { associations, sentences, generated: true };
}

// ═══════════════════════════════════════════════════════════════
// RENDER: word + related words (left) + sentences (right)
// ═══════════════════════════════════════════════════════════════
function currentEntry() {
  const v = vocabIndex.get(currentWord);
  const curated = DICT[currentWord];
  if (curated) return { v, curated: true, pos: curated.pos, homonymNote: curated.homonymNote, senses: curated.senses };
  return { v, curated: false, pos: null, homonymNote: null, senses: [buildGeneratedSense(v)] };
}

// Any vocabulary word that contains the searched word (or vice versa) — works
// mechanically for all 1354 words, not just the curated ones.
function relatedWords(word) {
  // A 1-syllable overlap (e.g. "가위" containing "위") is almost never a real
  // semantic relation — require the shared part to be 2+ characters so this
  // stays "compound word" matching (학교 -> 대학교/고등학교), not noise. Any
  // word this rule now excludes still gets the category-based fallback below.
  return VOCAB.filter(e => {
    if (e.ko === word) return false;
    const shorter = e.ko.length < word.length ? e.ko : word;
    if (shorter.length < 2) return false;
    return e.ko.includes(word) || word.includes(e.ko);
  }).sort((a,b) => a.ko.length - b.ko.length).slice(0, 24);
}

// Curated words carry hand-written associations (Verbe asociate, Substantive
// asociate, Expresii & metafore…) and generated words carry a same-category
// sample — both computed in currentEntry()/buildGeneratedSense() but, until
// now, never actually rendered. relatedWords() alone leaves ~39% of the
// vocab ("compound-word matches only") with an empty related-words panel,
// so merge these association zones in as extra grouped sections, skipping
// anything already shown in the plain related-words list above.
function relatedAssociationGroups(entry, alreadyShown, isRo) {
  const shownKo = new Set([currentWord, ...alreadyShown.map(w => w.ko)]);
  const groupMap = new Map();
  let assocSource = entry.senses.flatMap(s => s.associations || []);
  // A few hand-curated words (돈, 시간, 알다…) were written before associations
  // existed for them — give those the same same-category fallback generated
  // words get, instead of leaving the panel empty just because they're curated.
  if (!assocSource.length && entry.v) assocSource = categoryFallbackAssociations(entry.v);
  assocSource.forEach(g => {
    const key = isRo ? g.label.ro : g.label.en;
    if (!groupMap.has(key)) groupMap.set(key, { label: g.label, words: [] });
    const target = groupMap.get(key);
    g.words.forEach(w => {
      if (shownKo.has(w.ko) || target.words.some(x => x.ko === w.ko)) return;
      shownKo.add(w.ko);
      target.words.push(w);
    });
  });
  return [...groupMap.values()].filter(g => g.words.length);
}

// Inline !important is used for the active state because a global dark-mode
// rule (body.dark-mode button:not(#darkToggle)...) forces button backgrounds
// with !important at ID-level specificity, which a class selector can't beat.
function speedBtnHtml(mode, label) {
  const on = audioSpeed === mode;
  const style = on ? ' style="background:#c9922e !important;color:#fff !important"' : '';
  return `<button type="button" class="wc-speed-btn${on?' active':''}" data-speed="${mode}"${style} onclick="setAudioSpeed('${mode}')">${label}</button>`;
}

// ── ORBIT layout: word in the center, sentences as planets around it ────
const PLANET_COLORS = ['#22d3ee','#34d399','#fbbf24','#fb7185','#a78bfa','#38bdf8','#f472b6','#4ade80','#fb923c','#c084fc'];
const RING_CAPACITY = [4, 6, 8, 10, 12];

// Distributes N items across concentric rings, each planet positioned with
// plain trig (top/left via CSS sin()/cos()) so the math stays unambiguous.
// The radial gap between rings is always > bubble size, which guarantees
// zero overlap between adjacent rings no matter how the angles line up
// (the closest two rings can ever get is when their items share an angle,
// at which point the gap alone already exceeds one bubble's diameter).
// Ring capacity is capped low on purpose so several sentences reliably
// produce more than one ring — the point is concentric circles, not just
// the tightest possible packing.
function assignOrbitPositions(n) {
  if (!n) return { positions: [], size: '19cqmin' };
  const size = Math.max(11, Math.min(19, 22 - n * 0.8)); // cqmin, shrinks as sentence count grows
  const gap = size * 1.25;                                // > size ⇒ rings never touch
  const baseRadius = 20 + size * 0.7;
  const positions = [];
  let remaining = n, ring = 0;
  while (remaining > 0) {
    const cap = RING_CAPACITY[Math.min(ring, RING_CAPACITY.length - 1)];
    const count = Math.min(cap, remaining);
    const radius = (baseRadius + ring * gap).toFixed(2) + 'cqmin';
    const offset = (ring % 2) * (180 / count);
    for (let i = 0; i < count; i++) {
      positions.push({ angle: (360 / count) * i + offset, radius, ring });
    }
    remaining -= count; ring++;
  }
  return { positions, size: size.toFixed(2) + 'cqmin' };
}

function renderDetailHtml(s, isRo) {
  return `<div class="wc-detail-head">
    <span class="wc-sent-lvl ${s.level||'easy'}" title="${(isRo?LEVEL_LABEL.ro:LEVEL_LABEL.en)[s.level]||''}"></span>
    <div class="wc-detail-main">
      <div class="wc-sent-ko">${renderTokens(s.ko)}</div>
      ${s.romanization ? `<div class="wc-sent-rom${showRomanization?' show':''}">${s.romanization}</div>` : ''}
      <div class="wc-sent-ro">${isRo ? s.ro : (s.en || s.ro)}</div>
    </div>
    <button class="wc-sent-play" onclick="speak('${s.ko.replace(/<[^>]+>/g,'').replace(/'/g,"\\'")}', this)" title="🔊">🔊</button>
  </div>`;
}

function selectSentence(i) {
  selectedSentenceIdx = i;
  document.querySelectorAll('.wc-planet').forEach(p => p.classList.toggle('selected', Number(p.dataset.i) === i));
  const detail = document.getElementById('wcOrbitDetail');
  const s = currentSentences[i];
  if (!s) return;
  if (detail) detail.innerHTML = renderDetailHtml(s, cLang === 'ro');
  const planet = document.querySelector(`.wc-planet[data-i="${i}"]`);
  speak(s.ko.replace(/<[^>]+>/g, ''), planet);
}
window.selectSentence = selectSentence;

function renderExplore() {
  const isRo = cLang === 'ro';
  const entry = currentEntry();
  const v = entry.v;
  // Flatten every sense's sentences into one list (no sub-navigation for homonyms).
  const sentences = entry.senses.flatMap(s => s.sentences || []);
  const related = relatedWords(currentWord);
  const assocGroups = relatedAssociationGroups(entry, related, isRo);
  currentSentences = sentences;
  selectedSentenceIdx = sentences.length ? 0 : -1;

  const { positions, size } = assignOrbitPositions(sentences.length);
  const ringRadii = [...new Set(positions.map(p => p.radius))];
  const ringsHtml = ringRadii.map((r, i) => `<div class="wc-orbit-ring r${i % 2}" style="--r:${r}"></div>`).join('');
  // Fewer rings ⇒ a smaller stage, so a 2-sentence word isn't lost in a huge empty square.
  const orbitPx = Math.min(540, 260 + ringRadii.length * 160);

  const planetsHtml = sentences.map((s, i) => {
    const pos = positions[i];
    const color = PLANET_COLORS[i % PLANET_COLORS.length];
    const preview = s.ko.replace(/<\/?b>/g, '');
    return `<div class="wc-planet${i===0?' selected':''}" data-i="${i}"
      style="--angle:${pos.angle}deg;--radius:${pos.radius};--size:clamp(56px,${size},112px);--pc:${color};animation-delay:${Math.min(i*0.04,0.4)}s"
      onclick="selectSentence(${i})" title="${(isRo?LEVEL_LABEL.ro:LEVEL_LABEL.en)[s.level]||''}">
      <span class="wc-planet-lvl ${s.level||'easy'}"></span>
      <span class="wc-planet-txt">${preview}</span>
    </div>`;
  }).join('');

  const posLabel = entry.pos ? (isRo?entry.pos.ro:entry.pos.en)
    : (v.categories && v.categories[0] ? (isRo?CAT_LABELS.ro:CAT_LABELS.en)[v.categories[0]] : '');

  const orbitHtml = `<div class="wc-orbit-card card">
    <div class="wc-orbit-topbar">
      ${wordActionsHtml(currentWord, isRo)}
      <div class="wc-speed" role="group" aria-label="${isRo?'Viteză audio':'Audio speed'}">
        ${speedBtnHtml('normal', 'Normal')}
        ${speedBtnHtml('slow', isRo?'Lent':'Slow')}
      </div>
      <label class="wc-rom-toggle"><input type="checkbox" id="romToggle" ${showRomanization?'checked':''} onchange="toggleRom(this.checked)"> ${isRo?'Romanizare':'Romanization'}</label>
    </div>
    <div class="wc-orbit-stage">
      <div class="wc-orbit" style="width:min(${orbitPx}px,94vw)">
        ${ringsHtml}
        <div class="wc-orbit-sun" onclick="speak('${currentWord.replace(/'/g,"\\'")}', this)">
          <span class="wc-sun-word">${currentWord}</span>
          <div class="wc-sun-badges">
            ${posLabel ? `<span class="wc-sun-tag">${posLabel}</span>` : ''}
            <span class="wc-sun-tag">${entry.curated ? '✨' : '⚙️'}</span>
          </div>
        </div>
        ${planetsHtml}
      </div>
    </div>
    <div class="wc-orbit-detail" id="wcOrbitDetail">
      ${sentences.length ? renderDetailHtml(sentences[0], isRo) : `<div class="wc-orbit-empty">${isRo?'Niciun exemplu generat pentru acest tip de cuvânt.':'No generated example for this type of word.'}</div>`}
    </div>
    ${entry.homonymNote ? `<div class="wc-homonym">⚠️ ${isRo?entry.homonymNote.ro:entry.homonymNote.en}</div>` : ''}
    ${entry.generated ? `<div class="wc-gen-note">${isRo
      ? 'Acest cuvânt nu are o hartă scrisă manual — apasă pe planetele din jur pentru celelalte exemple.'
      : "This word doesn't have a hand-written map yet — tap the planets around it for more examples."}</div>` : ''}
  </div>`;

  const chipHtml = (w, i) => {
    const gloss = isRo ? w.ro : w.en;
    const delay = Math.min(i * 0.025, 0.3).toFixed(3);
    const color = PLANET_COLORS[i % PLANET_COLORS.length];
    // Some hand-written associations are idioms/words with no standalone
    // vocab entry (e.g. "마음이 가다", "존재하다") — only wire up the click
    // when it would actually resolve, so it never dead-ends on "not found".
    const resolvable = (vocabIndex && vocabIndex.get(w.ko)) || DICT[w.ko];
    const cls = 'wc-word-chip' + (resolvable ? ' clickable' : '');
    const onclick = resolvable ? ` onclick="searchAndFill('${w.ko.replace(/'/g,"\\'")}')"` : '';
    return `<span class="${cls}"${onclick} style="--pc:${color};animation-delay:${delay}s" title="${gloss}">${w.ko}<span class="g">${gloss}</span></span>`;
  };

  let relatedHtml = `<div class="wc-related-card card wc-cosmic-card">
    <div class="wc-related-lbl">${isRo?'Cuvinte înrudite':'Related words'} (${related.length})</div>
    <div class="wc-related-list">`;
  if (!related.length && !assocGroups.length) {
    relatedHtml += `<span style="font-size:.85rem;color:#b8a888">${isRo?'Niciun cuvânt înrudit găsit.':'No related words found.'}</span>`;
  }
  related.forEach((w, i) => { relatedHtml += chipHtml(w, i); });
  relatedHtml += `</div>`;
  assocGroups.forEach(g => {
    const label = isRo ? g.label.ro : g.label.en;
    relatedHtml += `<div class="wc-assoc-group">
      <div class="wc-assoc-lbl">${label} (${g.words.length})</div>
      <div class="wc-related-list">${g.words.map((w, i) => chipHtml(w, i)).join('')}</div>
    </div>`;
  });
  relatedHtml += `</div>`;

  document.getElementById('wcResult').innerHTML = orbitHtml + relatedHtml;

  // Auto-speak the sentence that's already showing in the detail panel
  // (the first planet), so audio plays as soon as the circles appear —
  // not only after an extra tap on the play button.
  if (sentences.length) {
    const firstPlanet = document.querySelector('.wc-planet[data-i="0"]');
    speak(sentences[0].ko.replace(/<[^>]+>/g, ''), firstPlanet);
  }
}

function toggleRom(checked) {
  showRomanization = checked;
  document.querySelectorAll('.wc-sent-rom').forEach(el => el.classList.toggle('show', checked));
}
window.toggleRom = toggleRom;

function setAudioSpeed(mode) {
  audioSpeed = mode;
  document.querySelectorAll('.wc-speed-btn').forEach(b => {
    const on = b.dataset.speed === mode;
    b.classList.toggle('active', on);
    if (on) {
      b.style.setProperty('background', '#c9922e', 'important');
      b.style.setProperty('color', '#fff', 'important');
    } else {
      b.style.removeProperty('background');
      b.style.removeProperty('color');
    }
  });
}
window.setAudioSpeed = setAudioSpeed;

// ── LANG ─────────────────────────────────────────────────────────
function applyLang(l) {
  cLang = l;
  document.getElementById('pgTitle').textContent = l === 'ro' ? '🗺️ Harta Cuvântului' : '🗺️ Word Map';
  document.getElementById('pgSub').textContent = l === 'ro'
    ? 'Scrie un cuvânt coreean și vezi cuvinte înrudite + propoziții'
    : 'Type a Korean word and see related words + sentences';
  document.getElementById('wcSearch').placeholder = l === 'ro' ? 'Scrie un cuvânt coreean și apasă Enter…' : 'Type a Korean word and press Enter…';
  if (currentWord) renderExplore();
  renderRandomWord();
  renderStartGallery();
}

if (window.RKLang) { RKLang.init(l => applyLang(l)); }
</script>
<script src="./js/core/page-help.js"></script>
</body>
</html>
