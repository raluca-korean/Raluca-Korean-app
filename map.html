<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raluca Korean — Harta Seulului</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#db2777">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./theme-anime.css">
<style>
/* ── SUMMARY ──────────────────────────────────────────── */
.mp-summary{text-align:center;padding:22px 16px 18px}
.mp-summary-num{font-size:38px;font-weight:900;color:var(--rk-heading);line-height:1}
.mp-summary-lbl{font-size:13px;color:var(--rk-muted);margin-top:6px;font-weight:600}

/* ── LINE / STOPS ─────────────────────────────────────── */
.mp-line{padding:4px 4px 0}
.mp-stop{display:flex;gap:14px;align-items:stretch;padding-bottom:22px}
.mp-stop:last-child{padding-bottom:0}
.mp-node-wrap{width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:center}
.mp-node{
  width:52px;height:52px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:24px;
  color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18);position:relative;z-index:1;
}
.mp-node-done{outline:3px solid rgba(34,197,94,.55);outline-offset:2px}
.mp-node-line{flex:1;width:3px;background:var(--rk-stroke);margin-top:2px;border-radius:2px;min-height:12px}

.mp-card{
  flex:1;min-width:0;background:var(--rk-card);border:2px solid var(--rk-stroke);border-bottom:4px solid var(--rk-stroke-b);
  border-radius:14px;padding:14px 16px;box-shadow:0 4px 14px var(--rk-shadow);
}
.mp-card-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mp-card-name{font-size:15px;font-weight:800;color:var(--rk-heading)}
.mp-card-ko{font-size:12px;color:var(--rk-muted-ui);font-weight:600}
.mp-card-theme{font-size:12px;color:var(--rk-muted);margin-top:2px;margin-bottom:10px}
.mp-bar-bg{flex:1;height:8px;background:rgba(0,0,0,.07);border-radius:5px;overflow:hidden}
body.dark-mode .mp-bar-bg{background:rgba(255,255,255,.09)}
.mp-bar{height:100%;border-radius:5px;background:linear-gradient(90deg,#db2777,#7c3aed);transition:width .8s cubic-bezier(.4,0,.2,1)}
.mp-done-badge{font-size:10px;font-weight:800;color:#16a34a;background:rgba(34,197,94,.14);padding:2px 8px;border-radius:8px}

/* ── SKILL BREAKDOWN (TOPIK Mode fused into the map) ─────── */
.mp-skills{margin-bottom:10px}
.mp-skill-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.mp-skill-row:last-child{margin-bottom:0}
.mp-skill-lbl{font-size:10px;font-weight:700;color:var(--rk-muted);width:64px;flex-shrink:0}
.mp-skill-pct{font-size:10px;font-weight:800;color:var(--rk-muted-ui);flex-shrink:0;min-width:28px;text-align:right}
.mp-actions{display:flex;gap:8px;flex-wrap:wrap}
.mp-action{
  font-size:12px;font-weight:700;text-decoration:none;color:var(--rk-heading);
  background:var(--rk-bg-flat);padding:7px 12px;border-radius:10px;transition:opacity .15s;
}
.mp-action:hover{opacity:.75}

/* ── CAPSTONE ─────────────────────────────────────────── */
.mp-capstone .mp-node{background:linear-gradient(145deg,#f59e0b,#db2777)}
.mp-capstone .mp-card{background:linear-gradient(145deg,rgba(245,158,11,.12),rgba(219,39,119,.10));border-color:rgba(245,158,11,.35)}
.mp-capstone .mp-action{background:linear-gradient(135deg,#db2777,#7c3aed);color:#fff}

body.dark-mode .mp-node-line{background:rgba(167,139,250,.25)}

@media(max-width:480px){
  .mp-node,.mp-node-wrap{width:42px}
  .mp-node{height:42px;font-size:19px}
  .mp-card{padding:12px 14px}
}
</style>
</head>
<body class="theme-anime">
<div class="app">

<div class="card">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
    <div>
      <h1 id="pageTitle">🗺️ Harta Seulului</h1>
      <div class="sub" id="pageSubtitle">Fiecare cartier e un capitol din călătoria ta coreeană</div>
    </div>
    <div id="pageControls"></div>
  </div>
</div>

<div class="card mp-summary">
  <div class="mp-summary-num" id="summaryNum">0 / 6</div>
  <div class="mp-summary-lbl" id="summaryLbl">cartiere explorate</div>
</div>

<div class="card mp-line" id="mapLine"></div>

</div><!-- /app -->

<script src="./js/core/storage.js"></script>
<script src="./js/core/srs.js"></script>
<script src="./js/core/lang-picker.js"></script>
<script>
'use strict';

var LANG = RKLang.get();

var UI = {
  ro:{
    title:'🗺️ Harta Seulului', sub:'Fiecare cartier e un capitol din călătoria ta coreeană',
    summaryLbl:'cartiere explorate',
    lessons:'📗 Lecții', exercises:'📝 Exerciții', glossary:'📚 Glosar', boss:'👹 Boss',
    done:'✓ Gata', exam:'🎓 Susține testul',
    vocab:'Vocabular', grammar:'Gramatică', sentences:'Propoziții',
    capstoneName:'Namsan Tower', capstoneKo:'남산타워', capstoneTheme:'Testul final TOPIK — încununarea călătoriei tale'
  },
  en:{
    title:'🗺️ Seoul Map', sub:"Every neighborhood is a chapter of your Korean journey",
    summaryLbl:'neighborhoods explored',
    lessons:'📗 Lessons', exercises:'📝 Exercises', glossary:'📚 Glossary', boss:'👹 Boss',
    done:'✓ Done', exam:'🎓 Take the test',
    vocab:'Vocabulary', grammar:'Grammar', sentences:'Sentences',
    capstoneName:'Namsan Tower', capstoneKo:'남산타워', capstoneTheme:'The final TOPIK test — the peak of your journey'
  }
};
function L(){ return UI[LANG]; }

var ZONES = [
  {level:1, icon:'🌱', color:'#ff9600', ko:'서울역', ro:'Seoul Station',  en:'Seoul Station',  theme_ro:'Primii pași în coreeană',   theme_en:'First steps in Korean'},
  {level:2, icon:'☕', color:'#00b8d4', ko:'익선동', ro:'Ikseon-dong',    en:'Ikseon-dong',    theme_ro:'Viața de zi cu zi',          theme_en:'Everyday life'},
  {level:3, icon:'🛍', color:'#22c55e', ko:'명동',   ro:'Myeongdong',     en:'Myeongdong',     theme_ro:'Shopping & oraș',            theme_en:'Shopping & city'},
  {level:4, icon:'🎤', color:'#a855f7', ko:'홍대',   ro:'Hongdae',        en:'Hongdae',        theme_ro:'Cultură & K-pop',            theme_en:'Culture & K-pop'},
  {level:5, icon:'🌃', color:'#db2777', ko:'강남',   ro:'Gangnam',        en:'Gangnam',        theme_ro:'Viață profesională',         theme_en:'Professional life'},
  {level:6, icon:'🏯', color:'#f59e0b', ko:'경복궁', ro:'Gyeongbokgung',  en:'Gyeongbokgung',  theme_ro:'Cultură & istorie',          theme_en:'Culture & history'}
];

// Same key format exercises.js uses for RK_EX_SRS (copied from today.html).
function exerciseKey(type, item){
  if(type === "ko-ro")      return "ko-ro||" + (item.q || "");
  if(type === "ro-ko")      return "ro-ko||" + (item.correct || "");
  if(type === "particle")   return "particle||" + (item.template || "") + "|" + (item.correct || "");
  if(type === "particlePlus") return "pp||" + (item.template || "") + "|" + (Array.isArray(item.correct) ? item.correct.join() : item.correct || "");
  if(type === "conjug")     return "conjug||" + (item.correct || "");
  if(type === "puzzle")     return "puzzle||" + (Array.isArray(item.correct) ? item.correct[0] : "");
  if(type === "chain")      return "chain||" + (Array.isArray(item.correct) ? item.correct[0] : "");
  return type + "||" + JSON.stringify(item.correct);
}

function coverage(types, zone, exJson, exSrs){
  var total = 0, done = 0;
  types.forEach(function(type){
    (exJson[type] || []).forEach(function(item){
      if(item.topik !== zone.level) return;
      total++;
      if(exSrs[exerciseKey(type, item)]) done++;
    });
  });
  return { total: total, done: done, pct: total ? Math.round(done / total * 100) : 0 };
}

function computeZoneProgress(zone, lessons, exJson, doneLessons, exSrs){
  var lessonsInZone = lessons.filter(function(ls){ return ls.topik === zone.level; });
  var lessonsDone = lessonsInZone.filter(function(ls){ return doneLessons.indexOf(ls.id) !== -1; }).length;

  var vocab = coverage(['ko-ro','ro-ko'], zone, exJson, exSrs);
  var grammarEx = coverage(['particle','particlePlus','conjug'], zone, exJson, exSrs);
  var grammar = {
    total: grammarEx.total + lessonsInZone.length,
    done: grammarEx.done + lessonsDone,
  };
  grammar.pct = grammar.total ? Math.round(grammar.done / grammar.total * 100) : 0;
  var sentences = coverage(['puzzle','chain'], zone, exJson, exSrs);

  var total = vocab.total + grammar.total + sentences.total;
  var done = vocab.done + grammar.done + sentences.done;
  var pct = total ? Math.round(done / total * 100) : 0;
  return { pct: pct, vocab: vocab, grammar: grammar, sentences: sentences };
}

function skillRow(label, data){
  return '<div class="mp-skill-row">' +
    '<span class="mp-skill-lbl">' + label + '</span>' +
    '<div class="mp-bar-bg"><div class="mp-bar" style="width:' + data.pct + '%"></div></div>' +
    '<span class="mp-skill-pct">' + data.pct + '%</span>' +
  '</div>';
}

function renderZone(zone, progress){
  var l = L();
  var pct = progress.pct;
  var name = LANG === 'ro' ? zone.ro : zone.en;
  var theme = LANG === 'ro' ? zone.theme_ro : zone.theme_en;
  return '<div class="mp-stop">' +
    '<div class="mp-node-wrap">' +
      '<div class="mp-node' + (pct === 100 ? ' mp-node-done' : '') + '" style="background:' + zone.color + '">' + zone.icon + '</div>' +
      '<div class="mp-node-line"></div>' +
    '</div>' +
    '<div class="mp-card">' +
      '<div class="mp-card-head">' +
        '<div><span class="mp-card-name">' + name + '</span> <span class="mp-card-ko">' + zone.ko + '</span></div>' +
        (pct === 100 ? '<span class="mp-done-badge">' + l.done + '</span>' : '<span class="mp-skill-pct">' + pct + '%</span>') +
      '</div>' +
      '<div class="mp-card-theme">' + theme + '</div>' +
      '<div class="mp-skills">' +
        skillRow(l.vocab, progress.vocab) +
        skillRow(l.grammar, progress.grammar) +
        skillRow(l.sentences, progress.sentences) +
      '</div>' +
      '<div class="mp-actions">' +
        '<a class="mp-action" href="lessons.html?level=' + zone.level + '">' + l.lessons + '</a>' +
        '<a class="mp-action" href="exercises.html?level=' + zone.level + '">' + l.exercises + '</a>' +
        '<a class="mp-action" href="glossary.html">' + l.glossary + '</a>' +
        '<a class="mp-action" href="boss.html?level=' + zone.level + '">' + l.boss + '</a>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function renderCapstone(avgPct){
  var l = L();
  return '<div class="mp-stop mp-capstone">' +
    '<div class="mp-node-wrap">' +
      '<div class="mp-node">🌸</div>' +
    '</div>' +
    '<div class="mp-card">' +
      '<div class="mp-card-head">' +
        '<div><span class="mp-card-name">' + l.capstoneName + '</span> <span class="mp-card-ko">' + l.capstoneKo + '</span></div>' +
      '</div>' +
      '<div class="mp-card-theme">' + l.capstoneTheme + '</div>' +
      '<div class="mp-actions">' +
        '<a class="mp-action" href="exam.html">' + l.exam + '</a>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function render(){
  var l = L();
  document.getElementById('pageTitle').textContent = l.title;
  document.getElementById('pageSubtitle').textContent = l.sub;
  document.getElementById('summaryLbl').textContent = l.summaryLbl;

  Promise.all([
    fetch('./data/lessons.json').then(function(r){ return r.json(); }),
    fetch('./data/exercises.json').then(function(r){ return r.json(); })
  ]).then(function(results){
    var lessons = results[0], exJson = results[1];
    var doneLessons = JSON.parse(localStorage.getItem('RK_LESSON_DONE') || '[]');
    var exSrs = window.RKSrs ? RKSrs.load('RK_EX_SRS') : {};

    var html = '';
    var completedZones = 0;
    var lastPct = 0;
    ZONES.forEach(function(zone){
      var progress = computeZoneProgress(zone, lessons, exJson, doneLessons, exSrs);
      if(progress.pct === 100) completedZones++;
      lastPct = progress.pct;
      html += renderZone(zone, progress);
    });
    html += renderCapstone(lastPct);

    document.getElementById('mapLine').innerHTML = html;
    document.getElementById('summaryNum').textContent = completedZones + ' / ' + ZONES.length;
  }).catch(function(){
    document.getElementById('mapLine').innerHTML = '';
  });
}

RKLang.init(function(lang){ LANG = lang; render(); });
render();
</script>
<script src="./js/core/dark-mode.js"></script>
<script src="./js/core/register-sw.js"></script>
<script src="./js/core/page-help.js"></script>
</body>
</html>
