<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raluca Korean — Propoziții de bază</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#6C5CE7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./theme-anime.css">
<style>
/* Interactive bits are div[role=button]/[role=tab], not <button>: theme-anime.css
   restyles every dark-mode <button> with !important. */
.bs{max-width:640px;margin:0 auto;padding:16px 16px 96px}
.bs-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.bs-hdr h1{margin:0;font-size:22px;color:var(--rk-heading)}
.bs-hdr .sub{margin-top:4px;font-size:13px;color:var(--rk-muted)}

.bs-prog{display:flex;align-items:center;gap:12px;margin-top:14px}
.bs-prog-bar{flex:1;height:8px;border-radius:6px;background:var(--rk-border);overflow:hidden}
.bs-prog-bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#6C5CE7,#E96A9A,#F4C95D);transition:width .5s ease}
.bs-prog-txt{font-size:12.5px;font-weight:800;color:var(--rk-muted);white-space:nowrap}

.bs-tabs{display:flex;gap:8px;margin:14px 0 10px;flex-wrap:wrap}
.bs-tab{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;cursor:pointer;user-select:none;
  font-size:13px;font-weight:800;color:var(--rk-text);background:var(--rk-card);border:1.5px solid var(--rk-stroke-b)}
.bs-tab.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,#7C6EF0,#6C5CE7)}
.bs-tab.toggle.on{background:linear-gradient(135deg,#2FB67C,#4A90A4)}
.bs-tab:focus-visible,.bs-chip:focus-visible,.bs-row:focus-visible,.bs-ko:focus-visible,.bs-btn:focus-visible{outline:3px solid #8B7CFF;outline-offset:2px}

.bs-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.bs-chips::-webkit-scrollbar{display:none}
.bs-chip{flex-shrink:0;cursor:pointer;user-select:none;padding:8px 13px;border-radius:12px;font-size:13px;font-weight:800;
  color:var(--rk-muted);background:var(--rk-card);border:1.5px solid var(--rk-stroke)}
.bs-chip b{color:#6C5CE7;margin-right:4px}
body.dark-mode .bs-chip b{color:#8B7CFF}
.bs-chip.on{color:var(--rk-heading);border-color:#6C5CE7;box-shadow:0 0 0 3px rgba(108,92,231,.12)}

.bs-chapter{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:18px 4px 10px;color:var(--rk-muted);font-size:12px;font-weight:800;letter-spacing:.04em}
.bs-chapter strong{color:var(--rk-heading);font-size:15px;letter-spacing:0}

.bs-unit{padding:0;overflow:hidden}
.bs-unit-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;
  background:linear-gradient(90deg,rgba(108,92,231,.12),rgba(233,106,154,.08));border-bottom:1px solid var(--rk-stroke)}
.bs-unit-kicker{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#6C5CE7}
body.dark-mode .bs-unit-kicker{color:#A99CFF}
.bs-unit-title{font-size:17px;font-weight:900;color:var(--rk-heading);margin-top:2px}
.bs-unit-meta{font-size:11.5px;font-weight:700;color:var(--rk-muted);margin-top:2px}
.bs-btn{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;cursor:pointer;user-select:none;padding:8px 12px;border-radius:999px;
  font-size:12.5px;font-weight:800;color:#6C5CE7;background:rgba(108,92,231,.10);border:1px solid rgba(108,92,231,.22)}
body.dark-mode .bs-btn{color:#B3A8FF;background:rgba(139,124,255,.16);border-color:rgba(139,124,255,.28)}
.bs-btn.playing{color:#fff;background:linear-gradient(135deg,#E96A9A,#6C5CE7);border-color:transparent}

.bs-row{display:flex;gap:12px;padding:14px 16px;border-bottom:1px dashed var(--rk-stroke)}
.bs-row:last-child{border-bottom:none}
.bs-row.speaking{background:rgba(108,92,231,.07)}
.bs-check{flex-shrink:0;width:28px;height:28px;margin-top:2px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;
  border:2px solid var(--rk-stroke-b);color:transparent;font-size:15px;font-weight:900;user-select:none;transition:all .2s}
.bs-check.on{border-color:#E5534B;color:#E5534B;background:rgba(229,83,75,.08)}
.bs-body{flex:1;min-width:0}
.bs-mean{font-size:14px;font-weight:700;color:var(--rk-heading)}
.bs-mean::before{content:'# ';color:var(--rk-muted);font-weight:800}
.bs-ko{font-family:'Noto Sans KR',sans-serif;font-size:23px;font-weight:700;color:var(--rk-heading);margin-top:6px;line-height:1.35;cursor:pointer;display:inline-block;border-radius:8px}
.bs-ko:hover{color:#6C5CE7}
.bs-ko .spk{font-size:15px;margin-left:6px;opacity:.55}
.bs-rom{font-size:13px;color:var(--rk-muted);margin-top:3px;letter-spacing:.01em}
body.no-rom .bs-rom{display:none}
.bs-alt{margin-top:6px}
.bs-alt .bs-ko{font-size:19px;margin-top:0}
.bs-groups{display:flex;gap:6px;flex-wrap:wrap;margin:0 2px 12px}
.bs-group{cursor:pointer;user-select:none;font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px;
  color:#6C5CE7;background:rgba(108,92,231,.10);border:1px solid rgba(108,92,231,.2)}
body.dark-mode .bs-group{color:#B3A8FF;background:rgba(139,124,255,.14);border-color:rgba(139,124,255,.26)}
.bs-group:focus-visible{outline:3px solid #8B7CFF;outline-offset:2px}
.bs-tip{margin-top:8px;font-size:12.5px;line-height:1.45;color:var(--rk-muted);padding:7px 10px;border-radius:10px;background:rgba(244,201,93,.14);border-left:3px solid #F4C95D}
.bs-tip b{color:#B8860B;margin-right:4px}
body.dark-mode .bs-tip b{color:#F3CB69}

/* practice mode: Korean hidden until tapped */
.bs-hide{margin-top:8px;display:flex;align-items:center;justify-content:center;min-height:58px;border-radius:12px;cursor:pointer;user-select:none;
  font-size:13px;font-weight:800;color:var(--rk-muted);border:2px dashed var(--rk-stroke-b)}
.bs-grade{display:flex;gap:8px;margin-top:10px}
.bs-grade .bs-btn{flex:1;justify-content:center}
.bs-grade .bs-btn.ok{color:#2FB67C;background:rgba(47,182,124,.12);border-color:rgba(47,182,124,.3)}

.bs-info{margin-top:4px}
.bs-info-kicker{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--rk-muted)}
.bs-info h3{margin:4px 0 8px;font-size:18px;color:var(--rk-heading)}
.bs-info p{margin:0;font-size:14px;line-height:1.6;color:var(--rk-text)}

.bs-empty{text-align:center;color:var(--rk-muted);font-size:14px;padding:24px 8px}
</style>
</head>
<body class="theme-anime">
<div class="bs">

  <div class="card">
    <div class="bs-hdr">
      <div>
        <h1 id="pageTitle">Propoziții de bază</h1>
        <div class="sub" id="pageSub"></div>
      </div>
      <div id="pageControls"></div>
    </div>
    <div class="bs-prog">
      <div class="bs-prog-bar"><i id="progBar"></i></div>
      <span class="bs-prog-txt" id="progTxt"></span>
    </div>
  </div>

  <div class="bs-tabs" role="tablist" id="modeTabs"></div>
  <div class="bs-chips" id="chapterChips"></div>
  <div id="content" aria-live="polite"></div>

</div>

<script src="./js/core/storage.js"></script>
<script src="./js/core/audio.js"></script>
<script src="./js/core/lang-picker.js"></script>
<script>
'use strict';

var LANG = RKLang.get();
var KNOWN_KEY = 'RK_BASICS_KNOWN';
var PREF_KEY = 'RK_BASICS_PREFS';

var UI = {
  ro: {
    title: 'Propoziții de bază', sub: 'Fraze esențiale pe situații, ca într-un ghid de conversație. Atinge coreeana ca s-o auzi.',
    prog: function (k, n) { return '✓ ' + k + ' din ' + n; },
    learn: '📖 Învață', practice: '🎯 Exersează', rom: 'Romanizare',
    chapter: function (n) { return 'CAPITOLUL ' + (n < 10 ? '0' + n : n); },
    unit: function (n) { return 'Unitatea ' + n; },
    unitMeta: function (k, n) { return k + '/' + n + ' știute'; },
    playAll: '▶ Ascultă tot', stop: '■ Stop',
    tip: 'tip', info: 'Bine de știut',
    reveal: '👆 Atinge ca să vezi în coreeană',
    know: '✓ Știu', notYet: '↺ Încă nu',
    markKnown: 'Marchează ca știută', markUnknown: 'Marchează ca neștiută',
    allKnown: 'Ai bifat toate propozițiile din acest capitol! 🎉 Mergi la următorul sau exersează din nou.'
  },
  en: {
    title: 'Basic sentences', sub: 'Essential phrases by situation, like a conversation guide. Tap the Korean to hear it.',
    prog: function (k, n) { return '✓ ' + k + ' of ' + n; },
    learn: '📖 Learn', practice: '🎯 Practice', rom: 'Romanization',
    chapter: function (n) { return 'CHAPTER ' + (n < 10 ? '0' + n : n); },
    unit: function (n) { return 'Unit ' + n; },
    unitMeta: function (k, n) { return k + '/' + n + ' known'; },
    playAll: '▶ Play all', stop: '■ Stop',
    tip: 'tip', info: 'Good to know',
    reveal: '👆 Tap to see it in Korean',
    know: '✓ I know it', notYet: '↺ Not yet',
    markKnown: 'Mark as known', markUnknown: 'Mark as not known',
    allKnown: 'You ticked every sentence in this chapter! 🎉 Move on to the next one or practise again.'
  }
};
function L() { return UI[LANG]; }
function tr(o) { return o ? (o[LANG] || o.ro || '') : ''; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

function load(key, fb) { try { var v = JSON.parse(localStorage.getItem(key) || 'null'); return v == null ? fb : v; } catch (e) { return fb; } }
var known = load(KNOWN_KEY, []);
var prefs = Object.assign({ mode: 'learn', rom: true, chapter: 0 }, load(PREF_KEY, {}));
function savePrefs() { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); }
function isKnown(ko) { return known.indexOf(ko) !== -1; }
function setKnown(ko, on) {
  known = known.filter(function (k) { return k !== ko; });
  if (on) known.push(ko);
  localStorage.setItem(KNOWN_KEY, JSON.stringify(known));
}

var DATA = null;
var revealed = {};      // practice mode: which sentences are uncovered
var playToken = 0;      // cancels a running "play all"

function allItems() {
  var out = [];
  DATA.chapters.forEach(function (c) { c.units.forEach(function (u) { out = out.concat(u.items); }); });
  return out;
}

/* ── RENDER ───────────────────────────────────────────── */
function renderTop() {
  var l = L();
  document.getElementById('pageTitle').textContent = l.title;
  document.getElementById('pageSub').textContent = l.sub;
  document.title = 'Raluca Korean — ' + l.title;
  var items = allItems();
  var k = items.filter(function (it) { return isKnown(it.ko); }).length;
  document.getElementById('progBar').style.width = (items.length ? Math.round(k / items.length * 100) : 0) + '%';
  document.getElementById('progTxt').textContent = l.prog(k, items.length);

  var tabs = [
    { id: 'learn', label: l.learn, on: prefs.mode === 'learn', role: 'tab' },
    { id: 'practice', label: l.practice, on: prefs.mode === 'practice', role: 'tab' },
    { id: 'rom', label: (prefs.rom ? '✓ ' : '') + l.rom, on: prefs.rom, toggle: true, role: 'switch' }
  ];
  document.getElementById('modeTabs').innerHTML = tabs.map(function (t) {
    return '<div class="bs-tab' + (t.toggle ? ' toggle' : '') + (t.on ? ' on' : '') + '" role="' + t.role + '" tabindex="0" data-tab="' + t.id + '"' +
      (t.role === 'tab' ? ' aria-selected="' + t.on + '"' : ' aria-checked="' + t.on + '"') + '>' + esc(t.label) + '</div>';
  }).join('');
  document.body.classList.toggle('no-rom', !prefs.rom);

  document.getElementById('chapterChips').innerHTML = DATA.chapters.map(function (c, i) {
    return '<div class="bs-chip' + (i === prefs.chapter ? ' on' : '') + '" role="tab" tabindex="0" aria-selected="' + (i === prefs.chapter) + '" data-ch="' + i + '"><b>' + c.num + '</b>' + esc(tr(c)) + '</div>';
  }).join('');
}

function renderContent() {
  var l = L();
  var ch = DATA.chapters[prefs.chapter] || DATA.chapters[0];
  // Units sharing a "group" (a book unit like Greetings) share one number.
  var groupNo = 0, lastGroup = null;
  function nextGroup(u) {
    var key = u.group ? tr(u.group) : null;
    if (!key || key !== lastGroup) groupNo++;
    lastGroup = key;
  }
  // Numbering restarts in every chapter, like the book (Unit 1, Unit 2…).

  var html = '<div class="bs-chapter"><span>' + l.chapter(ch.num) + '</span><strong>' + esc(tr(ch)) + '</strong></div>';
  var practice = prefs.mode === 'practice';
  var shown = 0;

  var groups = [];
  ch.units.forEach(function (u) { if (u.group && groups.every(function (g) { return g.key !== tr(u.group); })) groups.push({ key: tr(u.group), id: u.id }); });
  if (groups.length > 1) {
    html += '<div class="bs-groups">' + groups.map(function (g, gi) {
      return '<div class="bs-group" role="button" tabindex="0" data-jump="' + g.id + '">' + (gi + 1) + '. ' + esc(g.key) + '</div>';
    }).join('') + '</div>';
  }

  ch.units.forEach(function (u) {
    nextGroup(u);
    var items = practice ? u.items.filter(function (it) { return !isKnown(it.ko); }) : u.items;
    if (practice && !items.length) return;
    shown += items.length;
    var k = u.items.filter(function (it) { return isKnown(it.ko); }).length;
    html += '<section class="card bs-unit" data-unit="' + u.id + '">' +
      '<div class="bs-unit-head"><div>' +
        '<div class="bs-unit-kicker">' + l.unit(groupNo) + (u.group && tr(u.group) !== tr(u) ? ' · ' + esc(tr(u.group)) : '') + '</div>' +
        '<div class="bs-unit-title">' + esc(tr(u)) + '</div>' +
        '<div class="bs-unit-meta">' + l.unitMeta(k, u.items.length) + '</div>' +
      '</div>' + (practice ? '' : '<div class="bs-btn" role="button" tabindex="0" data-play="' + u.id + '">' + l.playAll + '</div>') + '</div>';
    items.forEach(function (it) {
      var on = isKnown(it.ko);
      var open = !practice || revealed[it.ko];
      html += '<div class="bs-row" data-ko="' + esc(it.ko) + '">' +
        '<div class="bs-check' + (on ? ' on' : '') + '" role="checkbox" tabindex="0" aria-checked="' + on + '" aria-label="' + esc(on ? l.markUnknown : l.markKnown) + '" data-check="' + esc(it.ko) + '">✓</div>' +
        '<div class="bs-body">' +
          '<div class="bs-mean">' + esc(tr(it)) + '</div>' +
          (open
            ? '<div class="bs-ko" role="button" tabindex="0" lang="ko" data-say="' + esc(it.ko) + '">' + esc(it.ko) + '<span class="spk" aria-hidden="true">🔊</span></div>' +
              '<div class="bs-rom">' + esc(it.rom) + '</div>' +
              (it.alt || []).map(function (a) {
                return '<div class="bs-alt"><div class="bs-ko" role="button" tabindex="0" lang="ko" data-say="' + esc(a.ko) + '">' + esc(a.ko) + '<span class="spk" aria-hidden="true">🔊</span></div>' +
                  '<div class="bs-rom">' + esc(a.rom) + '</div></div>';
              }).join('') +
              (it.tip ? '<div class="bs-tip"><b>' + l.tip + '</b>' + esc(tr(it.tip)) + '</div>' : '') +
              (practice ? '<div class="bs-grade">' +
                '<div class="bs-btn" role="button" tabindex="0" data-grade="0" data-k="' + esc(it.ko) + '">' + l.notYet + '</div>' +
                '<div class="bs-btn ok" role="button" tabindex="0" data-grade="1" data-k="' + esc(it.ko) + '">' + l.know + '</div></div>' : '')
            : '<div class="bs-hide" role="button" tabindex="0" data-reveal="' + esc(it.ko) + '">' + l.reveal + '</div>') +
        '</div></div>';
    });
    html += '</section>';
  });

  if (practice && !shown) html += '<div class="card bs-empty">' + l.allKnown + '</div>';

  (ch.infos || []).forEach(function (info) {
    html += '<div class="card bs-info"><div class="bs-info-kicker">' + l.info + '</div>' +
      '<h3>' + esc(tr(info.title)) + '</h3><p>' + esc(tr(info)) + '</p></div>';
  });
  document.getElementById('content').innerHTML = html;
}

function render() { stopAll(); renderTop(); renderContent(); }

/* ── AUDIO ────────────────────────────────────────────── */
function say(ko, onend) {
  if (!window.AudioEngine) { if (onend) onend(); return; }
  AudioEngine.speak(ko, onend ? { onend: onend } : {});
}
function markSpeaking(ko) {
  document.querySelectorAll('.bs-row.speaking').forEach(function (r) { r.classList.remove('speaking'); });
  if (!ko) return;
  var row = document.querySelector('.bs-row[data-ko="' + CSS.escape(ko) + '"]');
  if (row) { row.classList.add('speaking'); row.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
}
function stopAll() {
  playToken++;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  markSpeaking(null);
  document.querySelectorAll('.bs-btn.playing').forEach(function (b) { b.classList.remove('playing'); b.textContent = L().playAll; });
}
function playUnit(id, btn) {
  if (btn.classList.contains('playing')) { stopAll(); return; }
  stopAll();
  var unit = null;
  DATA.chapters.forEach(function (c) { c.units.forEach(function (u) { if (u.id === id) unit = u; }); });
  if (!unit) return;
  var token = playToken;
  btn.classList.add('playing'); btn.textContent = L().stop;
  var i = 0;
  (function next() {
    if (token !== playToken) return;
    if (i >= unit.items.length) { stopAll(); return; }
    var ko = unit.items[i++].ko;
    markSpeaking(ko);
    var done = false;
    var advance = function () { if (done) return; done = true; setTimeout(next, 700); };
    say(ko, advance);
    setTimeout(advance, 6000); // onend isn't reliable on every browser
  })();
}

/* ── EVENTS ───────────────────────────────────────────── */
function handle(e) {
  var t = e.target.closest('[data-tab],[data-ch],[data-play],[data-check],[data-say],[data-reveal],[data-grade],[data-jump]');
  if (!t) return;
  if (t.dataset.jump) {
    var sec = document.querySelector('.bs-unit[data-unit="' + t.dataset.jump + '"]');
    if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  if (t.dataset.tab) {
    if (t.dataset.tab === 'rom') prefs.rom = !prefs.rom;
    else { prefs.mode = t.dataset.tab; revealed = {}; }
    savePrefs(); render();
  } else if (t.dataset.ch) {
    prefs.chapter = parseInt(t.dataset.ch, 10) || 0; revealed = {};
    savePrefs(); render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else if (t.dataset.play) {
    playUnit(t.dataset.play, t);
  } else if (t.dataset.check) {
    setKnown(t.dataset.check, !isKnown(t.dataset.check));
    renderTop(); renderContent();
  } else if (t.dataset.say) {
    stopAll(); say(t.dataset.say);
  } else if (t.dataset.reveal) {
    revealed[t.dataset.reveal] = true;
    renderContent(); say(t.dataset.reveal);
  } else if (t.dataset.grade) {
    if (t.dataset.grade === '1') setKnown(t.dataset.k, true);
    else delete revealed[t.dataset.k];
    renderTop(); renderContent();
  }
}
document.addEventListener('click', handle);
document.addEventListener('keydown', function (e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('[role=button],[role=tab],[role=checkbox],[role=switch]')) {
    e.preventDefault(); handle(e);
  }
});

RKLang.init(function (lang) { LANG = lang; render(); });

fetch('./data/basic-sentences.json').then(function (r) { return r.json(); }).then(function (d) {
  DATA = d;
  if (prefs.chapter >= DATA.chapters.length) prefs.chapter = 0;
  render();
}).catch(function () {
  document.getElementById('content').innerHTML = '<div class="card bs-empty">⚠️</div>';
});
</script>
<script src="./js/core/dark-mode.js"></script>
<script src="./js/core/seoul-bg.js"></script>
<script src="./js/core/register-sw.js"></script>
</body>
</html>
