<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raluca Korean — Smart Review</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
<meta name="theme-color" content="#6C5CE7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F7; --card:#FFFFFF; --text:#202124; --text-mid:#6B6B73; --text-low:#9C9CA3;
  --border:#E7E5E1; --shadow:rgba(32,33,36,.07);
  --lavender:#6C5CE7; --lavender-soft:#EFEBFC; --pink:#E96A9A; --bar-bg:#EFEDE9;
  --forest:#6C5CE7; --gold:#F4C95D;
}
body.dark-mode{
  --bg:#101426; --card:#181D32; --text:#F7F4FA; --text-mid:#B8B9C5; --text-low:#7D7E93;
  --border:rgba(255,255,255,.08); --shadow:rgba(0,0,0,.35);
  --lavender:#8B7CFF; --lavender-soft:rgba(139,124,255,.16); --pink:#F17EAB; --bar-bg:rgba(255,255,255,.08);
  --forest:#8B7CFF; --gold:#F3CB69;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:96px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 0 6px}
.brand{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:800;text-decoration:none;color:var(--text)}
.rk-logo{width:20px;height:20px;flex-shrink:0}
.rk-logo .gate{stroke:#6C5CE7}
.rk-logo .ascent{stroke:#F4C95D}
body.dark-mode .rk-logo .gate{stroke:#8B7CFF}
body.dark-mode .rk-logo .ascent{stroke:#F3CB69}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--text-mid)}
.topbar-actions{display:flex;align-items:center;gap:8px}
.lang{display:flex;border:1px solid var(--border);border-radius:20px;overflow:hidden;background:var(--card)}
.lang button{border:none;background:none;padding:7px 12px;font-size:11px;font-weight:800;color:var(--text-low);cursor:pointer;font-family:inherit}
.lang button.active{background:var(--forest);color:#fff}

.hero{text-align:center;padding:20px 10px 6px}
.hero-icon{font-size:40px}
.hero-num{font-size:40px;font-weight:900;margin-top:4px}
.hero-lbl{font-size:13px;color:var(--text-mid);margin-top:2px}

.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;margin-top:16px;box-shadow:0 4px 18px var(--shadow)}
.card-eyebrow{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--lavender)}
.card-title{font-size:17px;font-weight:900;margin-top:6px}
.card-sub{font-size:13px;color:var(--text-mid);margin-top:3px}
.cta{
  display:inline-block;margin-top:14px;padding:11px 20px;border-radius:12px;text-decoration:none;font-weight:800;font-size:13px;
  background:linear-gradient(90deg,var(--lavender),var(--pink));color:#fff;
}
.cta.secondary{background:var(--lavender-soft);color:var(--lavender)}
.empty{text-align:center;padding:26px 10px}
.empty-icon{font-size:44px}
.empty-title{font-size:15px;font-weight:800;margin-top:8px}
.empty-sub{font-size:13px;color:var(--text-mid);margin-top:4px}
</style>
</head>
<body class="theme-anime">

<div class="wrap">
  <div class="topbar">
    <a href="index.html" class="brand">←
      <svg class="rk-logo" viewBox="0 0 48 48" fill="none" aria-hidden="true" focusable="false">
        <path class="gate" d="M10 34V20c0-6 4-10 10-10h8c6 0 10 4 10 10v14" stroke-width="4.4" stroke-linecap="round"/>
        <path class="ascent" d="M15 34 24 20l9 14" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Raluca Korean</a>
    <div class="topbar-actions">
      <div class="lang">
        <button id="btnRo" type="button">RO</button>
        <button id="btnEn" type="button">EN</button>
      </div>
      <button class="icon-btn" id="darkToggle" type="button" aria-label="Toggle dark mode">🌙</button>
    </div>
  </div>

  <div class="hero">
    <div class="hero-icon">🧠</div>
    <div class="hero-num" id="totalNum">0</div>
    <div class="hero-lbl" id="totalLbl">items to review</div>
  </div>

  <div id="body"></div>
</div>

<div id="rkBottomNav"></div>

<script src="./js/core/storage.js"></script>
<script src="./js/core/srs.js"></script>
<script src="./js/core/bottom-nav.js"></script>
<script>
'use strict';

var LANG = localStorage.getItem('RK_LANG') || 'ro';
RKNav.init('practice');
var UI = {
  ro:{
    totalLbl:'itemi de recapitulat',
    vocabTitle:'Vocabular uitat', vocabSub:function(n){ return n + ' cuvinte scadente în Flashcards'; },
    hanjaTitle:'Hanja uitată', hanjaSub:function(n){ return n + ' caractere scadente'; },
    hardTitle:'Exerciții dificile', hardSub:function(n){ return n + ' exerciții pe care le greșești des'; },
    reviewNow:'REVIEW NOW →', seeAll:'Vezi toate greșelile →',
    allDoneTitle:'Ești la zi! ✨', allDoneSub:'Nu ai nimic de recapitulat acum — revino mai târziu.'
  },
  en:{
    totalLbl:'items to review',
    vocabTitle:'Forgotten vocabulary', vocabSub:function(n){ return n + ' words due in Flashcards'; },
    hanjaTitle:'Forgotten Hanja', hanjaSub:function(n){ return n + ' characters due'; },
    hardTitle:'Difficult exercises', hardSub:function(n){ return n + ' exercises you often get wrong'; },
    reviewNow:'REVIEW NOW →', seeAll:'See all mistakes →',
    allDoneTitle:"You're all caught up! ✨", allDoneSub:'Nothing to review right now — check back later.'
  }
};
function L(){ return UI[LANG]; }

function dueCount(key){
  if(!window.RKSrs) return 0;
  var data = RKSrs.load(key);
  var now = Date.now();
  var n = 0;
  Object.keys(data).forEach(function(k){ if(data[k] && data[k].due <= now) n++; });
  return n;
}

/* Same EF-based "hard exercise" logic as mistakes.html -- reused, not reinvented. */
function parseType(key){
  if(key.indexOf('ko-ro||') === 0) return 'ko-ro';
  if(key.indexOf('ro-ko||') === 0) return 'ro-ko';
  if(key.indexOf('particle||') === 0) return 'particle';
  if(key.indexOf('pp||') === 0) return 'particlePlus';
  if(key.indexOf('conjug||') === 0) return 'conjug';
  if(key.indexOf('puzzle||') === 0) return 'puzzle';
  if(key.indexOf('chain||') === 0) return 'chain';
  return 'unknown';
}
function countHardExercises(){
  var srs = window.RKSrs ? RKSrs.load('RK_EX_SRS') : {};
  var n = 0;
  Object.keys(srs).forEach(function(key){
    var c = srs[key];
    if(!c || c.n < 1) return;
    if(parseType(key) === 'unknown') return;
    if(c.EF < 2.2) n++;
  });
  return n;
}

function render(){
  var l = L();
  var vocab = dueCount('RK_FC_SRS');
  var hanja = dueCount('RK_HJ_SRS');
  var hard = countHardExercises();
  var total = vocab + hanja + hard;

  document.getElementById('totalNum').textContent = total;
  document.getElementById('totalLbl').textContent = l.totalLbl;
  RKNav.setLang(LANG);

  var html = '';
  if(total === 0){
    html = '<div class="card"><div class="empty">' +
      '<div class="empty-icon">✨</div>' +
      '<div class="empty-title">' + l.allDoneTitle + '</div>' +
      '<div class="empty-sub">' + l.allDoneSub + '</div>' +
    '</div></div>';
  } else {
    if(vocab > 0){
      html += '<a class="card" href="flashcards.html" style="display:block;text-decoration:none;color:inherit">' +
        '<div class="card-eyebrow">📚 ' + l.vocabTitle + '</div>' +
        '<div class="card-title">' + vocab + '</div>' +
        '<div class="card-sub">' + l.vocabSub(vocab) + '</div>' +
        '<span class="cta">' + l.reviewNow + '</span>' +
      '</a>';
    }
    if(hanja > 0){
      html += '<a class="card" href="hanja-book.html" style="display:block;text-decoration:none;color:inherit">' +
        '<div class="card-eyebrow">漢 ' + l.hanjaTitle + '</div>' +
        '<div class="card-title">' + hanja + '</div>' +
        '<div class="card-sub">' + l.hanjaSub(hanja) + '</div>' +
        '<span class="cta">' + l.reviewNow + '</span>' +
      '</a>';
    }
    if(hard > 0){
      html += '<a class="card" href="mistakes.html" style="display:block;text-decoration:none;color:inherit">' +
        '<div class="card-eyebrow">❌ ' + l.hardTitle + '</div>' +
        '<div class="card-title">' + hard + '</div>' +
        '<div class="card-sub">' + l.hardSub(hard) + '</div>' +
        '<span class="cta secondary">' + l.seeAll + '</span>' +
      '</a>';
    }
  }
  document.getElementById('body').innerHTML = html;
}

function applyLang(){
  document.getElementById('btnRo').classList.toggle('active', LANG === 'ro');
  document.getElementById('btnEn').classList.toggle('active', LANG === 'en');
  render();
}
document.getElementById('btnRo').addEventListener('click', function(){ LANG = 'ro'; localStorage.setItem('RK_LANG','ro'); applyLang(); });
document.getElementById('btnEn').addEventListener('click', function(){ LANG = 'en'; localStorage.setItem('RK_LANG','en'); applyLang(); });

(function initTheme(){
  var theme = localStorage.getItem('RK_THEME');
  var isDark = theme === 'dark' || theme === null;
  document.body.classList.toggle('dark-mode', isDark);
  document.getElementById('darkToggle').textContent = isDark ? '☀️' : '🌙';
})();
document.getElementById('darkToggle').addEventListener('click', function(){
  var nowDark = !document.body.classList.contains('dark-mode');
  document.body.classList.toggle('dark-mode', nowDark);
  localStorage.setItem('RK_THEME', nowDark ? 'dark' : 'light');
  document.getElementById('darkToggle').textContent = nowDark ? '☀️' : '🌙';
});

applyLang();
</script>
<script src="./js/core/register-sw.js"></script>
</body>
</html>
